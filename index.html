<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPK Studio — XML Processing Studio (JPK_CIT / JPK_KR_PD)</title>
<style>
/* ============================================================
   JPK STUDIO — design tokens
   ============================================================ */
:root{
  --radius:12px; --radius-s:8px;
  --font-ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --tr:180ms cubic-bezier(.4,0,.2,1);
}
html[data-theme="dark"]{
  --bg:#0b0f1a; --bg2:#0e1424; --panel:#121a2c; --panel2:#0f1522;
  --glass:rgba(18,26,44,.78); --line:#232d48; --line2:#1a2338;
  --text:#e8edf8; --muted:#8d98b6; --faint:#5a6580;
  --accent:#e9b44c; --accent-ink:#1a1200; --accent2:#5b9dff;
  --ok:#3ecf8e; --warn:#f0a24b; --err:#ff5d6c; --sel:#2a3a63;
  --editor-bg:#0d1322; --gutter:#0a0f1c;
  --hl-tag:#7fb4ff; --hl-attr:#e9b44c; --hl-val:#7fe0b4; --hl-com:#697694; --hl-pi:#c792ea; --hl-txt:#dfe6f5;
}
html[data-theme="light"]{
  --bg:#eef1f7; --bg2:#e6eaf3; --panel:#ffffff; --panel2:#f6f8fc;
  --glass:rgba(255,255,255,.85); --line:#d8deec; --line2:#e6eaf3;
  --text:#17203a; --muted:#5a6580; --faint:#9aa4bd;
  --accent:#b07c14; --accent-ink:#fff; --accent2:#2b6fd6;
  --ok:#149a63; --warn:#c07417; --err:#d33b4d; --sel:#dbe6ff;
  --editor-bg:#fbfcff; --gutter:#f1f4fa;
  --hl-tag:#1a5fd0; --hl-attr:#9a6700; --hl-val:#0f7d54; --hl-com:#8b93a7; --hl-pi:#8331c8; --hl-txt:#22304f;
  --shadow:0 10px 30px rgba(30,45,90,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui); font-size:14px; color:var(--text);
  background:radial-gradient(1200px 700px at 85% -10%, var(--bg2), transparent 60%), var(--bg);
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
::selection{background:var(--sel)}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-rows:52px 1fr auto 26px;height:100vh}
/* toolbar */
#toolbar{
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--glass);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);z-index:30;
}
#brand{display:flex;align-items:center;gap:10px;margin-right:6px;user-select:none}
#brand .mark{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),#c8892a);color:#181000;
  font-weight:800;font-size:13px;letter-spacing:-.5px;box-shadow:0 4px 14px rgba(233,180,76,.35);
}
#brand .name{font-weight:700;letter-spacing:.2px}
#brand .name small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.6px;text-transform:uppercase}
.tbtn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--radius-s);
  border:1px solid transparent;color:var(--text);transition:background var(--tr),border-color var(--tr);
  white-space:nowrap;
}
.tbtn:hover{background:var(--panel2);border-color:var(--line)}
.tbtn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 4px 14px rgba(233,180,76,.28)}
.tbtn.primary:hover{filter:brightness(1.06)}
.tbtn svg{width:15px;height:15px;flex:none}
#toolbar .spacer{flex:1}
#limit-chip{
  display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel2);font-size:12px;color:var(--muted);
}
#limit-chip b{color:var(--accent)}
#limit-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
#limit-chip.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#limit-chip.over .dot{background:var(--err);box-shadow:0 0 8px var(--err)}

/* ---------- main split ---------- */
#main{display:flex;min-height:0}
#sidebar{
  width:224px;min-width:170px;max-width:420px;flex:none;display:flex;flex-direction:column;
  background:var(--panel2);border-right:1px solid var(--line);transition:margin var(--tr);
}
#sidebar.collapsed{margin-left:-260px}
#sidebar nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.navbtn{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-s);
  color:var(--muted);font-weight:500;text-align:left;transition:all var(--tr);border:1px solid transparent;
}
.navbtn svg{width:16px;height:16px;flex:none}
.navbtn:hover{color:var(--text);background:var(--panel)}
.navbtn.active{color:var(--text);background:var(--panel);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.navbtn .kbd{margin-left:auto;font-size:10px;color:var(--faint)}
#sidebar .sec{padding:14px 14px 6px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:700}
#recent{flex:1;overflow:auto;padding:0 8px 10px}
.recent-item{
  display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;
  padding:8px 10px;border-radius:var(--radius-s);border:1px solid transparent;transition:all var(--tr);
}
.recent-item:hover{background:var(--panel);border-color:var(--line)}
.recent-item .rn{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-item .rm{font-size:11px;color:var(--faint)}
#side-resizer{width:5px;cursor:col-resize;flex:none;background:transparent;transition:background var(--tr)}
#side-resizer:hover{background:var(--accent2)}

#content{flex:1;display:flex;flex-direction:column;min-width:0}
/* tabs */
#tabs{display:flex;align-items:flex-end;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line);background:var(--bg2);overflow-x:auto}
.tab{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px 10px 0 0;
  border:1px solid var(--line);border-bottom:none;background:var(--panel2);color:var(--muted);
  max-width:220px;transition:all var(--tr);font-size:13px;
}
.tab .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.active{background:var(--panel);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.tab .x{opacity:.5;border-radius:4px;padding:0 3px}
.tab .x:hover{opacity:1;background:var(--err);color:#fff}
#tabs:empty{display:none}

#views{flex:1;overflow:auto;padding:18px;min-height:0}
.view{display:none;animation:fadein .22s ease}
.view.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- generic panels ---------- */
.grid{display:grid;gap:14px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);
}
.card h3{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
.metric{font-size:26px;font-weight:700;letter-spacing:-.5px}
.metric small{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.field input,.field select{
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:8px 10px;min-width:120px;transition:border-color var(--tr);
}
.field input:focus,.field select:focus{border-color:var(--accent2);outline:none}
.btn{
  padding:8px 14px;border-radius:var(--radius-s);border:1px solid var(--line);
  background:var(--panel2);transition:all var(--tr);font-weight:500;
  display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--accent2);background:var(--panel)}
.btn.acc{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
.btn.acc:hover{filter:brightness(1.07)}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.err{color:var(--err);border-color:var(--err)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.info{color:var(--accent2);border-color:var(--accent2)}
.muted{color:var(--muted)} .small{font-size:12px}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.5px;text-transform:uppercase}
table.tbl td{padding:7px 10px;border-bottom:1px solid var(--line2);font-family:var(--font-mono);font-size:12px}
table.tbl tr:hover td{background:var(--panel2)}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .3s ease}

/* ---------- dropzone ---------- */
#drop{
  border:2px dashed var(--line);border-radius:var(--radius);padding:44px 20px;text-align:center;
  color:var(--muted);transition:all var(--tr);background:var(--panel2);
}
#drop.hot{border-color:var(--accent);color:var(--accent);background:var(--panel);transform:scale(1.005)}
#drop .big{font-size:17px;color:var(--text);font-weight:600;margin-bottom:6px}
#drop kbd{font-family:var(--font-mono);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px}

/* ---------- editor ---------- */
#editor-wrap{display:flex;flex-direction:column;height:calc(100vh - 214px);min-height:320px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--editor-bg)}
#editor-bar{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
#editor-bar .btn{padding:5px 10px;font-size:12px}
#findbar{display:none;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
#findbar.show{display:flex}
#findbar input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-family:var(--font-mono);font-size:12px;width:180px}
#findbar .cnt{font-size:11px;color:var(--muted);min-width:70px}
#editor-body{position:relative;flex:1;display:flex;min-height:0}
#gutter{
  flex:none;width:56px;background:var(--gutter);color:var(--faint);text-align:right;
  padding:10px 8px 10px 0;font-family:var(--font-mono);font-size:12.5px;line-height:1.55;
  overflow:hidden;user-select:none;border-right:1px solid var(--line2);white-space:pre;
}
#gutter .cur{color:var(--accent);font-weight:700}
#edstack{position:relative;flex:1;min-width:0}
#hilite,#ed{
  position:absolute;inset:0;padding:10px 14px;font-family:var(--font-mono);font-size:12.5px;line-height:1.55;
  white-space:pre;overflow:auto;tab-size:2;
}
#hilite{pointer-events:none;color:var(--hl-txt)}
#hilite .curline{background:linear-gradient(90deg,var(--sel),transparent);display:inline-block;width:100%}
#ed{
  background:transparent;border:none;resize:none;color:transparent;caret-color:var(--accent);
  outline:none;z-index:2;
}
#ed.plain{color:var(--text)}
.t-tag{color:var(--hl-tag)} .t-attr{color:var(--hl-attr)} .t-val{color:var(--hl-val)}
.t-com{color:var(--hl-com);font-style:italic} .t-pi{color:var(--hl-pi)} .t-cd{color:var(--hl-val)}

/* ---------- tree ---------- */
#tree{font-family:var(--font-mono);font-size:12.5px;line-height:1.7}
.tnode{margin-left:16px}
.tnode>.trow{display:flex;align-items:center;gap:5px;border-radius:5px;padding:1px 6px;cursor:default}
.tnode>.trow:hover{background:var(--panel2)}
.twist{width:14px;flex:none;color:var(--faint);cursor:pointer;transition:transform var(--tr);display:inline-block;text-align:center}
.tnode.open>.trow .twist{transform:rotate(90deg)}
.tnode>.kids{display:none}
.tnode.open>.kids{display:block}
.tname{color:var(--hl-tag)} .tattr{color:var(--hl-attr)} .ttext{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:460px}
.tcount{color:var(--faint);font-size:11px}

/* ---------- issues ---------- */
.issue{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);margin-bottom:8px;background:var(--panel2);align-items:flex-start}
.issue .ic{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px}
.issue.err .ic{background:var(--err)} .issue.warn .ic{background:var(--warn)} .issue.ok .ic{background:var(--ok)} .issue.info .ic{background:var(--accent2)}
.issue b{font-size:13px} .issue .d{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- logs drawer ---------- */
#logs-drawer{border-top:1px solid var(--line);background:var(--panel2);display:none;flex-direction:column;height:180px;min-height:70px;max-height:60vh}
#logs-drawer.show{display:flex}
#logs-head{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line2);cursor:row-resize;user-select:none}
#logs-head b{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
#logs-body{flex:1;overflow:auto;font-family:var(--font-mono);font-size:11.5px;padding:8px 12px}
.logline{padding:1px 0;color:var(--muted)} .logline .lt{color:var(--faint)} 
.logline.err{color:var(--err)} .logline.warn{color:var(--warn)} .logline.ok{color:var(--ok)}

/* ---------- statusbar ---------- */
#statusbar{
  display:flex;align-items:center;gap:16px;padding:0 14px;font-size:11.5px;color:var(--muted);
  background:var(--panel2);border-top:1px solid var(--line);
}
#statusbar .sitem{display:flex;gap:5px;align-items:center;white-space:nowrap}
#statusbar .grow{flex:1}
#sb-progress{width:160px;display:none}
#sb-progress.show{display:block}

/* ---------- toasts ---------- */
#toasts{position:fixed;right:18px;bottom:44px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{
  min-width:240px;max-width:360px;padding:11px 14px;border-radius:var(--radius);
  background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);
  box-shadow:var(--shadow);animation:toast-in .25s ease;font-size:13px;display:flex;gap:9px;align-items:flex-start;
}
.toast .tic{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--accent2)}
.toast.ok .tic{background:var(--ok)} .toast.err .tic{background:var(--err)} .toast.warn .tic{background:var(--warn)}
.toast.out{animation:toast-out .25s ease forwards}
@keyframes toast-in{from{opacity:0;transform:translateX(24px)}to{opacity:1}}
@keyframes toast-out{to{opacity:0;transform:translateX(24px)}}

/* ---------- dialog ---------- */
#overlay{position:fixed;inset:0;background:rgba(4,7,15,.55);backdrop-filter:blur(3px);display:none;place-items:center;z-index:90}
#overlay.show{display:grid}
#dialog{
  width:min(520px,92vw);max-height:84vh;overflow:auto;background:var(--glass);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;
  animation:dlg .2s ease;
}
@keyframes dlg{from{opacity:0;transform:scale(.96)}to{opacity:1}}
#dialog h2{font-size:16px;margin-bottom:12px}
#dialog .dbody{font-size:13px;color:var(--muted);line-height:1.6}
#dialog .dfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#dialog input[type=text],#dialog input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-top:8px}

/* ---------- context menu ---------- */
#ctxmenu{
  position:fixed;z-index:110;display:none;min-width:190px;padding:6px;
  background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);
}
#ctxmenu button{display:flex;width:100%;justify-content:space-between;gap:16px;padding:7px 11px;border-radius:7px;font-size:13px;text-align:left}
#ctxmenu button:hover{background:var(--panel)}
#ctxmenu .kbd{color:var(--faint);font-size:11px}
#ctxmenu hr{border:none;border-top:1px solid var(--line);margin:5px 4px}

/* ---------- gauge / charts ---------- */
.gauge-wrap{display:flex;gap:18px;align-items:center}
canvas{max-width:100%}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px}
.legend .li{display:flex;gap:8px;align-items:center;color:var(--muted)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}

/* split results */
.part{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-s);margin-bottom:7px;background:var(--panel2)}
.part .pn{font-family:var(--font-mono);font-size:12.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part .ps{font-size:11.5px;color:var(--muted);white-space:nowrap}

kbd.k{font-family:var(--font-mono);background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px}
.shortcuts td{padding:5px 10px;font-size:12.5px}

@media (max-width:860px){
  #sidebar{position:absolute;z-index:40;height:calc(100vh - 78px);top:52px;box-shadow:var(--shadow)}
  #views{padding:12px}
}
</style>
</head>
<body>
<div id="app">

  <!-- ======================= TOOLBAR ======================= -->
  <header id="toolbar" role="toolbar" aria-label="Main toolbar">
    <button class="tbtn" id="btn-sidebar" title="Toggle sidebar (Ctrl+B)" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div id="brand"><div class="mark">JS</div>
      <div class="name">JPK Studio<small>XML processing · JPK_CIT</small></div>
    </div>
    <button class="tbtn primary" id="btn-open">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0-12 4 4m-4-4L8 7M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      Open XML
    </button>
    <button class="tbtn" id="btn-sample">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4M15 3h6v6M10 14 21 3"/></svg>
      Sample JPK_KR_PD
    </button>
    <button class="tbtn" id="btn-validate-quick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 13 4 4L19 7"/></svg>
      Validate
    </button>
    <button class="tbtn" id="btn-split-quick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3M12 8v8"/></svg>
      Split
    </button>
    <div class="spacer"></div>
    <div id="limit-chip" title="Ministry of Finance gateway limit for a single JPK file">
      <span class="dot"></span><span>MF gateway limit&nbsp;<b>100 MB</b></span><span id="chip-size"></span>
    </div>
    <button class="tbtn" id="btn-logs" title="Toggle logs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h16M4 14h10M4 18h7"/></svg>
    </button>
    <button class="tbtn" id="btn-theme" title="Toggle theme (Ctrl+J)" aria-label="Toggle color theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
    <button class="tbtn" id="btn-help" title="Keyboard shortcuts (F1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.8.3-1.4 1-1.4 1.9v.3M12 17h.01"/></svg>
    </button>
  </header>

  <!-- ======================= MAIN ======================= -->
  <div id="main">
    <aside id="sidebar" aria-label="Navigation">
      <nav id="nav"></nav>
      <div class="sec">Recent files</div>
      <div id="recent" aria-label="Recent files"></div>

/* ---------------------------- tiny utilities ---------------------------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtBytes = b => {
  if (b == null) return '—';
  const u = ['B','KB','MB','GB']; let i = 0;
  while (b >= 1024 && i < u.length-1) { b /= 1024; i++; }
  return (i ? b.toFixed(b < 10 ? 2 : 1) : b) + ' ' + u[i];
};
const fmtInt = n => n == null ? '—' : n.toLocaleString('en-US');
const now = () => new Date().toLocaleTimeString();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

/* Doc model:

/* ============================================================================
 * CRC32 + ZIP (stored) — manual implementation, no JSZip
 * ========================================================================== */
const CRC32_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32Update(crc, bytes) {
  for (let i = 0; i < bytes.length; i++)
    crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return crc >>> 0;
}
async function crc32Blob(blob, task) {
  let crc = 0xFFFFFFFF;
  const CH = 4*MB;
  for (let off = 0; off < blob.size; off += CH) {
    if (task?.cancelled) throw new Error('cancelled');
    const buf = new Uint8Array(await blob.slice(off, off+CH).arrayBuffer());
    crc = crc32Update(crc, buf) ^ 0; // keep running (inverted at end)
    crc = crc >>> 0;
    // note: crc32Update expects pre-inverted running value
    await nextFrame();
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
class ZipBuilder {           // ZIP with method 0 (stored) — valid, universal
  constructor(){ this.entries = []; }
  add(name, blob){ this.entries.push({ name, blob }); }
  async build(task) {
    const enc = new TextEncoder();
    const chunks = []; const central = [];
    let offset = 0;
    const dt = (() => {                       // DOS date/time
      const d = new Date();
      const time = (d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
      const date = ((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
      return { time, date };
    })();
    const u16=(v)=>[v&255,(v>>8)&255], u32=(v)=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
    for (const e of this.entries) {
      if (task?.cancelled) throw new Error('cancelled');
      const nameB = enc.encode(e.name);
      const crc = await crc32Blob(e.blob, task);
      const size = e.blob.size;
      const lfh = new Uint8Array([
        0x50,0x4B,0x03,0x04, ...u16(20), ...u16(0x0800), ...u16(0),
        ...u16(dt.time), ...u16(dt.date), ...u32(crc), ...u32(size), ...u32(size),
        ...u16(nameB.length), ...u16(0)
      ]);
      chunks.push(lfh, nameB, e.blob);
      central.push({ nameB, crc, size, offset });
      offset += lfh.length + nameB.length + size;
    }
    const cdStart = offset; let cdSize = 0;
    for (const c of central) {
      const rec = new Uint8Array([
        0x50,0x4B,0x01,0x02, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0),
        ...u16(dt.time), ...u16(dt.date), ...u32(c.crc), ...u32(c.size), ...u32(c.size),
        ...u16(c.nameB.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
        ...u32(0), ...u32(c.offset)
      ]);
      chunks.push(rec, c.nameB);
      cdSize += rec.length + c.nameB.length;
    }
    chunks.push(new Uint8Array([
      0x50,0x4B,0x05,0x06, ...u16(0), ...u16(0),
      ...u16(central.length), ...u16(central.length),
      ...u32(cdSize), ...u32(cdStart), ...u16(0)
    ]));
    return new Blob(chunks, { type:'application/zip' });
  }
}

/* ============================================================================
 * PDF — manual minimal generator (Helvetica, multi-page), no jsPDF
 * ========================================================================== */
function buildPdf(title, lines) {
  const enc = new TextEncoder();
  const escP = s => s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')
                     .replace(/[^\x20-\x7E]/g, '?');
  const perPage = 52, pages = [];
  for (let i = 0; i < Math.max(1, Math.ceil(lines.length/perPage)); i++)
    pages.push(lines.slice(i*perPage, (i+1)*perPage));
  const objs = [];                                     // 1-indexed bodies
  const pageIds = pages.map((_,i)=> 4 + i*2);
  objs[1] = `<< /Type /Catalog /Pages 2 0 R >>`;
  objs[2] = `<< /Type /Pages /Kids [${pageIds.map(id=>id+' 0 R').join(' ')}] /Count ${pages.length} >>`;
  objs[3] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>`;
  pages.forEach((pl, i) => {
    let y = 800, body = `BT /F1 14 Tf 46 ${y} Td (${escP(title)}${pages.length>1?` — page ${i+1}/${pages.length}`:''}) Tj ET\n`;
    y -= 26;
    for (const ln of pl) {
      body += `BT /F1 9 Tf 46 ${y} Td (${escP(ln).slice(0,110)}) Tj ET\n`;
      y -= 13.5;
    }
    objs[pageIds[i]] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${pageIds[i]+1} 0 R >>`;
    objs[pageIds[i]+1] = `<< /Length ${enc.encode(body).length} >>\nstream\n${body}endstream`;
  });
  let pdf = '%PDF-1.4\n'; const xref = [0];
  for (let i = 1; i < objs.length; i++) {
    xref[i] = enc.encode(pdf).length;
    pdf += `${i} 0 obj\n${objs[i]}\nendobj\n`;
  }
  const xs = enc.encode(pdf).length;
  pdf += `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for (let i = 1; i < objs.length; i++) pdf += String(xref[i]).padStart(10,'0') + ' 00000 n \n';
  pdf += `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xs}\n%%EOF`;
  return new Blob([pdf], { type:'application/pdf' });
}

/* ============================================================================
 * XML utilities — encoding, validation, pretty print, highlight, JSON, CSV
 * ========================================================================== */
const Xml = {
  detectEncoding(bytes) {                    // BOM + declaration sniffing
    if (bytes[0]===0xEF && bytes[1]===0xBB && bytes[2]===0xBF) return 'UTF-8 (BOM)';
    if (bytes[0]===0xFF && bytes[1]===0xFE) return 'UTF-16 LE (BOM)';
    if (bytes[0]===0xFE && bytes[1]===0xFF) return 'UTF-16 BE (BOM)';
    const head = new TextDecoder('latin1').decode(bytes.slice(0, 200));
    const m = head.match(/encoding\s*=\s*["']([\w-]+)["']/i);
    return m ? m[1].toUpperCase() + ' (declared)' : 'UTF-8 (assumed)';
  },
  validateUtf8(bytes) {                      // strict UTF-8 scanner
    let i = 0; const n = bytes.length;
    while (i < n) {
      const b = bytes[i];
      if (b < 0x80) { i++; continue; }
      let need, min;
      if ((b & 0xE0) === 0xC0) { need = 1; min = 0x80; }
      else if ((b & 0xF0) === 0xE0) { need = 2; min = 0x800; }
      else if ((b & 0xF8) === 0xF0) { need = 3; min = 0x10000; }
      else return { ok:false, at:i };
      if (i + need > n - 1) return { ok:false, at:i };
      let cp = b & (0x3F >> need);
      for (let k = 1; k <= need; k++) {
        const c = bytes[i+k];
        if ((c & 0xC0) !== 0x80) return { ok:false, at:i+k };
        cp = (cp << 6) | (c & 0x3F);
      }
      if (cp < min || cp > 0x10FFFF || (cp >= 0xD800 && cp <= 0xDFFF)) return { ok:false, at:i };
      i += need + 1;
    }
    return { ok:true };
  },
  parse(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    const err = doc.querySelector('parsererror');
    if (err) {
      const msg = err.textContent.replace(/\s+/g,' ').trim();
      const lm = msg.match(/line[:\s]+(\d+)/i);
      return { doc:null, error: msg.slice(0, 300), line: lm ? +lm[1] : null };
    }
    return { doc, error:null };
  },
  async prettyPrint(text, task) {            // token-based, chunked, async
    const out = []; let indent = 0, i = 0, count = 0;
    const push = s => out.push('  '.repeat(Math.max(0,indent)) + s);
    const N = text.length;
    while (i < N) {
      if (task?.cancelled) throw new Error('cancelled');
      const lt = text.indexOf('<', i);
      if (lt === -1) { const t = text.slice(i).trim(); if (t) push(t); break; }
      const t = text.slice(i, lt).trim();
      if (t) push(t);
      let gt;
      if (text.startsWith('<!--', lt)) gt = text.indexOf('-->', lt) + 2;
      else if (text.startsWith('<![CDATA[', lt)) gt = text.indexOf(']]>', lt) + 2;
      else gt = text.indexOf('>', lt);
      if (gt < lt) { push(text.slice(lt)); break; }
      const tag = text.slice(lt, gt+1);
      if (tag.startsWith('</')) { indent--; push(tag); }
      else if (tag.startsWith('<?') || tag.startsWith('<!')) push(tag);
      else if (tag.endsWith('/>')) push(tag);
      else {                                    // maybe inline: <a>text</a>
        const close = text.indexOf('<', gt+1);
        const inner = close > -1 ? text.slice(gt+1, close) : '';
        if (close > -1 && text.startsWith('</', close) && !inner.includes('\n') && inner.length < 90) {
          const cgt = text.indexOf('>', close);
          push(text.slice(lt, cgt+1)); i = cgt + 1;
          if (++count % 4000 === 0) { Task.progress(i/N); await nextFrame(); }
          continue;
        }
        push(tag); indent++;
      }
      i = gt + 1;
      if (++count % 4000 === 0) { Task.progress(i/N); await nextFrame(); }
    }
    return out.join('\n');
  },
  highlight(text) {                          // XML syntax highlighting (regex tokens)
    return esc(text)
      .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="t-com">$1</span>')
      .replace(/(&lt;!\[CDATA\[[\s\S]*?\]\]&gt;)/g, '<span class="t-cd">$1</span>')
      .replace(/(&lt;\?[\s\S]*?\?&gt;)/g, '<span class="t-pi">$1</span>')
      .replace(/(&lt;\/?)([\w:.-]+)((?:[^&]|&(?!gt;))*?)(\/?&gt;)/g, (m, o, name, attrs, c) => {
        const a = attrs.replace(/([\w:.-]+)(=)(&quot;.*?&quot;|'.*?')/g,
          '<span class="t-attr">$1</span>$2<span class="t-val">$3</span>');
        return `${o}<span class="t-tag">${name}</span>${a}${c}`;
      });
  },
  xmlToJson(node) {
    if (node.nodeType === 9) return { [node.documentElement.nodeName]: this.xmlToJson(node.documentElement) };
    const o = {};
    for (const a of node.attributes || []) o['@'+a.name] = a.value;
    let text = '';
    for (const c of node.childNodes) {
      if (c.nodeType === 3 || c.nodeType === 4) text += c.nodeValue;
      else if (c.nodeType === 1) {
        const v = this.xmlToJson(c), k = c.nodeName;
        if (k in o) { if (!Array.isArray(o[k])) o[k] = [o[k]]; o[k].push(v); }
        else o[k] = v;
      }
    }
    text = text.trim();
    if (text) { if (Object.keys(o).length === 0) return text; o['#text'] = text; }
    return o;
  },
  toCsv(doc, recordTag) {
    const recs = [...doc.getElementsByTagName(recordTag)];
    if (!recs.length) return null;
    const cols = new Set();
    for (const r of recs.slice(0, 3000)) {
      for (const a of r.attributes) cols.add('@'+a.name);
      for (const c of r.children) cols.add(c.nodeName);
    }
    const head = [...cols];
    const q = v => { v = String(v ?? ''); return /[",\n;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    const rows = [head.map(q).join(',')];
    for (const r of recs) {
      rows.push(head.map(h => {
        if (h.startsWith('@')) return q(r.getAttribute(h.slice(1)));
        const c = [...r.children].find(x => x.nodeName === h);
        return q(c ? c.textContent : '');
      }).join(','));
    }
    return rows.join('\r\n');
  }
};

/* ============================================================================
 * Analyzer — async DOM statistics
 * ========================================================================== */
const Analyzer = {
  async run(doc, task) {
    const st = {
      nodes:0, elements:0, attributes:0, textNodes:0, comments:0, cdata:0, pis:0,
      maxDepth:0, namespaces:new Map(), names:new Map(), branches:[], textBytes:0
    };
    const walker = doc.createTreeWalker(doc, 0xFFFFFFFF);
    let n, i = 0;
    const depthOf = node => { let d=0; while ((node=node.parentNode) && node.nodeType!==9) d++; return d; };
    while ((n = walker.nextNode())) {
      if (task?.cancelled) throw new Error('cancelled');
      st.nodes++;
      switch (n.nodeType) {
        case 1: {
          st.elements++; st.attributes += n.attributes.length;
          st.names.set(n.nodeName, (st.names.get(n.nodeName)||0)+1);
          if (n.namespaceURI) st.namespaces.set(n.namespaceURI, (st.namespaces.get(n.namespaceURI)||0)+1);
          const d = depthOf(n); if (d > st.maxDepth) st.maxDepth = d;
          break;
        }
        case 3: st.textNodes++; st.textBytes += n.nodeValue.length; break;
        case 4: st.cdata++; st.textBytes += n.nodeValue.length; break;
        case 7: st.pis++; break;
        case 8: st.comments++; break;
      }
      if (++i % 15000 === 0) { Task.progress(Math.min(.95, i/600000)); await nextFrame(); }
    }
    // largest branches: direct children of root by descendant element count
    const root = doc.documentElement;
    for (const c of root.children) {
      st.branches.push({ name:c.nodeName, count: c.getElementsByTagName('*').length + 1 });
    }
    st.branches.sort((a,b)=>b.count-a.count);
    // aggregate repeated names of same tag among root children
    const agg = new Map();
    for (const b of st.branches) {
      const a = agg.get(b.name) || { name:b.name, count:0, times:0 };
      a.count += b.count; a.times++; agg.set(b.name, a);
    }
    st.rootGroups = [...agg.values()].sort((a,b)=>b.count-a.count);
    st.repeated = [...st.names.entries()].filter(([,c])=>c>1).sort((a,b)=>b[1]-a[1]).slice(0,12);
    st.memoryEstimate = st.nodes*96 + st.textBytes*2 + st.attributes*64;   // rough DOM cost
    st.complexity = Math.round(Math.log2(1+st.elements) * (1 + st.maxDepth/8) * (1 + st.names.size/60) * 10) / 10;
    return st;
  }
};

/* ============================================================================
 * Validator — technical + JPK_KR_PD business rules
 * ========================================================================== */
const Validator = {
  nipValid(nip) {
    nip = String(nip||'').replace(/[\s-]/g,'');
    if (!/^\d{10}$/.test(nip)) return false;
    const w = [6,5,7,2,3,4,5,6,7];
    const sum = w.reduce((s,x,i)=> s + x*+nip[i], 0);
    return sum % 11 === +nip[9];
  },
  async run(d, task) {
    const issues = [];
    const add = (sev, title, detail) => issues.push({ sev, title, detail });

    /* --- technical layer --- */
    if (d.encoding && !/utf-?8/i.test(d.encoding))
      add('warn', 'Non-UTF-8 encoding declared', `Detected: ${d.encoding}. The MF gateway expects UTF-8; Polish characters may be corrupted.`);
    if (d.utf8ok === false)
      add('err', 'Invalid UTF-8 byte sequence', 'The file contains bytes that are not valid UTF-8. Fix the export encoding in your ERP.');
    else if (d.utf8ok === true)
      add('ok', 'UTF-8 validation passed', 'All byte sequences are valid UTF-8.');

    if (d.size > MF_LIMIT)
      add('err', 'File exceeds the 100 MB MF gateway limit',
        `${fmtBytes(d.size)} — the Ministry of Finance gateway will reject it. Use the Split module to divide JPK_KR_PD into compliant parts.`);
    else
      add('ok', 'Within the 100 MB gateway limit', `${fmtBytes(d.size)} of 100 MB (${(d.size/MF_LIMIT*100).toFixed(1)}%).`);

    if (!d.doc) {
      if (d.big) add('warn','Large-file mode','DOM validation skipped (file above DOM limit). Technical size/encoding checks and stream splitting remain available.');
      else add('err','Not well-formed XML', d.parseError || 'Parser error.');
      d.issues = issues; return issues;
    }
    add('ok', 'Well-formed XML', 'Document parses without structural errors.');

    const doc = d.doc, root = doc.documentElement;
    if (!root.namespaceURI)
      add('warn', 'Missing default namespace on root', `<${root.nodeName}> declares no xmlns. JPK structures published by MF are namespace-qualified.`);
    else if (/crd\.gov\.pl/.test(root.namespaceURI))
      add('ok', 'MF namespace detected', root.namespaceURI);
    else
      add('info', 'Root namespace', root.namespaceURI);

    const get = tag => root.getElementsByTagName(tag);
    const txt = tag => get(tag)[0]?.textContent?.trim();

    /* --- JPK_KR_PD business layer --- */
    const isJpk = /^JPK/i.test(root.nodeName) || get('Naglowek').length;
    if (isJpk) {
      const kod = txt('KodFormularza');
      if (kod) add(kod.includes('JPK_KR') ? 'ok' : 'info', 'Form code', `KodFormularza = ${kod}`);
      for (const req of ['Naglowek','Podmiot1'])
        if (!get(req).length) add('err', `Missing required <${req}>`, `Schema JPK_KR_PD requires the ${req} section.`);
      const from = txt('DataOd'), to = txt('DataDo');
      if (from && to && from > to) add('err', 'Reporting period reversed', `DataOd (${from}) is after DataDo (${to}).`);
      else if (from && to) add('ok', 'Reporting period', `${from} → ${to}`);

      const nips = [...get('NIP')];
      let badNip = 0;
      for (const n of nips.slice(0, 20000)) if (!this.nipValid(n.textContent)) badNip++;
      if (nips.length) {
        if (badNip) add('err', `Invalid NIP checksum (${badNip}×)`, 'One or more NIP values fail the Polish checksum (weights 6-5-7-2-3-4-5-6-7). Foreign counterparties should use NrIdKontrahenta instead.');
        else add('ok', 'NIP checksums valid', `${nips.length} NIP value(s) verified.`);
      }

      // journal entries
      const recs = [...get('Dziennik')];
      if (recs.length) {
        add('info', 'Journal entries found', `${fmtInt(recs.length)} <Dziennik> record(s).`);
        const seen = new Set(); let dups = 0, dateOut = 0, missing = 0;
        let sumW = 0, sumM = 0;
        for (let i = 0; i < recs.length; i++) {
          if (task?.cancelled) throw new Error('cancelled');
          const r = recs[i];
          const nr = r.getElementsByTagName('NrZapisu')[0]?.textContent?.trim();
          if (nr) { if (seen.has(nr)) dups++; seen.add(nr); } else missing++;
          const dt = r.getElementsByTagName('DataOperacji')[0]?.textContent?.trim();
          if (dt && from && to && (dt < from || dt > to)) dateOut++;
          sumW += parseFloat(r.getElementsByTagName('KwotaWinien')[0]?.textContent) || 0;
          sumM += parseFloat(r.getElementsByTagName('KwotaMa')[0]?.textContent) || 0;
          if (i % 8000 === 0) { Task.progress(i/recs.length); await nextFrame(); }
        }
        if (dups) add('err', `Duplicate NrZapisu (${dups}×)`, 'Journal entry numbers must be unique within the file.');
        else add('ok', 'No duplicate entry numbers', 'NrZapisu values are unique.');
        if (missing) add('err', `Missing NrZapisu (${missing}×)`, 'Every journal record requires an entry number.');
        if (dateOut) add('warn', `Operations outside period (${dateOut}×)`, 'DataOperacji falls outside DataOd–DataDo.');
        const diff = Math.abs(sumW - sumM);
        if (diff > 0.005) add('err', 'Journal not balanced', `Σ KwotaWinien = ${sumW.toFixed(2)}, Σ KwotaMa = ${sumM.toFixed(2)} (diff ${diff.toFixed(2)}). Debits must equal credits.`);
        else add('ok', 'Journal balanced', `Debits equal credits (${sumW.toFixed(2)}).`);

        const ctrl = get('DziennikCtrl')[0];
        if (ctrl) {
          const declared = parseInt(ctrl.getElementsByTagName('LiczbaWierszyDziennika')[0]?.textContent);
          if (declared && declared !== recs.length)
            add('err', 'Control record mismatch', `DziennikCtrl declares ${fmtInt(declared)} rows but the file contains ${fmtInt(recs.length)}. Re-generate control sums (they must be recomputed after splitting).`);
          else if (declared) add('ok', 'Control record consistent', `LiczbaWierszyDziennika = ${fmtInt(declared)}.`);
        } else add('warn', 'No <DziennikCtrl> control record', 'JPK_KR_PD includes control counts/sums; verify against the current XSD.');
      }
      // empty required-ish values
      let empty = 0;
      const w = doc.createTreeWalker(root, 1);
      let node2, scanned = 0;
      while ((node2 = w.nextNode()) && scanned < 300000) {
        scanned++;
        if (!node2.children.length && !node2.textContent.trim() && !node2.attributes.length) empty++;
      }
      if (empty) add('warn', `Empty elements (${empty}×)`, 'Elements without text, children or attributes — verify none of them is schema-required.');
    } else {
      add('info', 'Generic XML mode', 'No JPK header detected — business rules for JPK_KR_PD were skipped; technical checks apply.');
    }
    d.issues = issues;
    return issues;
  }
};
</script>
<script>
"use strict";
/* ============================================================================
 * Splitter — DOM mode (small/medium) + streaming mode (hundreds of MB)
 * ========================================================================== */
const Splitter = {
  detectRecordTag(d) {
    if (Settings.data.recordTag) return Settings.data.recordTag;
    if (d.doc) {
      const freq = new Map();
      for (const c of d.doc.documentElement.children)
        freq.set(c.nodeName, (freq.get(c.nodeName)||0)+1);
      let best = null, bestN = 1;
      for (const [k,v] of freq) if (v > bestN) { best = k; bestN = v; }
      return best || 'Dziennik';
    }
    return 'Dziennik';
  },

  /* -------- DOM splitting (rebuilds envelope + recomputes Ctrl) -------- */
  async splitDom(d, opts, task) {
    const { mode, maxBytes, maxCount, tag } = opts;
    const doc = d.doc, root = doc.documentElement;
    const kids = [...root.children];
    const recIdx = kids.map((k,i)=>({k,i})).filter(x=>x.k.nodeName===tag);
    if (!recIdx.length) throw new Error(`No <${tag}> record elements found under the root.`);
    const first = recIdx[0].i, last = recIdx[recIdx.length-1].i;
    const head = kids.slice(0, first).filter(k=>k.nodeName!==tag);
    const tail = kids.slice(last+1).filter(k=>k.nodeName!==tag);
    const recs = recIdx.map(x=>x.k);
    const ser = new XMLSerializer();
    const prolog = '<?xml version="1.0" encoding="UTF-8"?>\n';
    let rootOpen = '<' + root.nodeName;
    for (const a of root.attributes)
      rootOpen += ` ${a.name}="${a.value.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}"`;
    rootOpen += '>';
    const rootClose = `</${root.nodeName}>`;
    const headStr = head.map(h=>ser.serializeToString(h)).join('\n');
    const envBytes = prolog.length + rootOpen.length + rootClose.length + headStr.length + 40;

    const parts = []; let cur = [], curBytes = 0;
    const flush = () => { if (cur.length) { parts.push(cur); cur = []; curBytes = 0; } };
    for (let i = 0; i < recs.length; i++) {
      if (task?.cancelled) throw new Error('cancelled');
      const s = ser.serializeToString(recs[i]);
      const b = new Blob([s]).size;
      const wouldOverflow = mode==='size' ? (curBytes + b + envBytes > maxBytes && cur.length)
                          : mode==='count' ? cur.length >= maxCount
                          : false;
      if (wouldOverflow) flush();
      cur.push({ s, node: recs[i] }); curBytes += b + 1;
      if (i % 3000 === 0) { Task.progress(i/recs.length*0.7); await nextFrame(); }
    }
    flush();

    const outs = [];
    for (let p = 0; p < parts.length; p++) {
      if (task?.cancelled) throw new Error('cancelled');
      const group = parts[p];
      let tailStr = tail.map(t=>ser.serializeToString(t)).join('\n');
      if (Settings.data.keepCtrl && tail.some(t=>t.nodeName===tag+'Ctrl')) {   // recompute control record
        const ctrl = tail.find(t=>t.nodeName===tag+'Ctrl').cloneNode(true);
        const rows = ctrl.getElementsByTagName('LiczbaWierszyDziennika')[0];
        if (rows) rows.textContent = String(group.length);
        const sw = ctrl.getElementsByTagName('SumaWinien')[0] || ctrl.getElementsByTagName('SumaKwotWinien')[0];
        const sm = ctrl.getElementsByTagName('SumaMa')[0]     || ctrl.getElementsByTagName('SumaKwotMa')[0];
        if (sw || sm) {
          let w = 0, m = 0;
          for (const g of group) {
            w += parseFloat(g.node.getElementsByTagName('KwotaWinien')[0]?.textContent) || 0;
            m += parseFloat(g.node.getElementsByTagName('KwotaMa')[0]?.textContent) || 0;
          }
          if (sw) sw.textContent = w.toFixed(2);
          if (sm) sm.textContent = m.toFixed(2);
        }
        tailStr = tail.map(t => t.nodeName===tag+'Ctrl' ? ser.serializeToString(ctrl) : ser.serializeToString(t)).join('\n');
      }
      const body = [prolog + rootOpen, headStr, group.map(g=>g.s).join('\n'), tailStr, rootClose]
        .filter(Boolean).join('\n');
      const blob = new Blob([body], { type:'application/xml' });
      outs.push({ name: this.partName(d.name, p+1, parts.length), blob, records: group.length });
      Task.progress(0.7 + (p+1)/parts.length*0.3); await nextFrame();
    }
    return outs;
  },

  /* -------- streaming splitting (no DOM; hundreds of MB, chunked I/O) -------- */
  async splitStream(d, opts, task) {
    const { mode, maxBytes, maxCount, tag } = opts;
    const src = d.file || new Blob([d.text]);
    const CH = 8*MB, dec = new TextDecoder('utf-8');
    const open1 = `<${tag}>`, open2 = `<${tag} `, close = `</${tag}>`;
    let carry = '', pos = 0;
    let envelopeHead = null, envelopeTail = '';
    const parts = []; let cur = [], curBytes = 0, curCount = 0, totalRecs = 0;
    const flush = () => {
      if (!cur.length) return;
      parts.push({ chunks: cur, records: curCount });
      cur = []; curBytes = 0; curCount = 0;
    };
    const findOpen = (s, from) => {
      const a = s.indexOf(open1, from), b = s.indexOf(open2, from);
      if (a === -1) return b; if (b === -1) return a; return Math.min(a,b);
    };
    while (pos < src.size || carry.length) {
      if (task?.cancelled) throw new Error('cancelled');
      if (pos < src.size) {
        const buf = await src.slice(pos, pos+CH).arrayBuffer();
        carry += dec.decode(buf, { stream: pos+CH < src.size });
        pos += CH;
        Task.progress(pos/src.size*0.9);
        await nextFrame();
      }
      let progress = true;
      while (progress) {
        progress = false;
        if (envelopeHead === null) {
          const o = findOpen(carry, 0);
          if (o === -1) { if (pos >= src.size) { envelopeTail += carry; carry=''; } break; }
          envelopeHead = carry.slice(0, o);
          carry = carry.slice(o);
        }
        const o = findOpen(carry, 0);
        if (o === -1) { if (pos >= src.size) { envelopeTail += carry; carry=''; } break; }
        if (o > 0) { const between = carry.slice(0, o); if (between.trim()) envelopeTail += between; carry = carry.slice(o); }
        const c = carry.indexOf(close);
        if (c === -1) { if (pos >= src.size) { envelopeTail += carry; carry=''; break; } break; }
        const rec = carry.slice(0, c + close.length);
        carry = carry.slice(c + close.length);
        const bytes = rec.length;                     // ~byte estimate (ASCII-heavy XML)
        const overflow = mode==='size' ? (curBytes + bytes > maxBytes*0.985 && cur.length)
                       : mode==='count' ? curCount >= maxCount : false;
        if (overflow) flush();
        cur.push(rec); curBytes += bytes + 1; curCount++; totalRecs++;
        progress = true;
      }
      if (pos >= src.size && carry === '') break;
      if (pos >= src.size && envelopeHead === null) { envelopeTail = carry; carry=''; break; }
      if (pos >= src.size) { envelopeTail += ''; }
      if (pos >= src.size && carry.indexOf(close) === -1 && findOpen(carry,0) === -1) { envelopeTail += carry; break; }
    }
    flush();
    if (!totalRecs) throw new Error(`No <${tag}> records found (streaming scan).`);
    if (envelopeHead === null) envelopeHead = '<?xml version="1.0" encoding="UTF-8"?>\n<Root>';
    envelopeTail = envelopeTail.replace(/^\s+/, '\n');
    const outs = parts.map((p, i) => ({
      name: this.partName(d.name, i+1, parts.length),
      blob: new Blob([envelopeHead, p.chunks.join('\n'), envelopeTail], { type:'application/xml' }),
      records: p.records
    }));
    Task.progress(1);
    return outs;
  },

  partName(base, i, total) {
    const pad = String(i).padStart(String(total).length, '0');
    return base.replace(/\.xml$/i, '') + `_part${pad}of${total}.xml`;
  },

  async run(d, opts, task) {
    if (d.doc && !d.big) return this.splitDom(d, opts, task);
    return this.splitStream(d, opts, task);
  }
};

/* ============================================================================
 * Downloads
 * ========================================================================== */
function download(blob, name) {
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  Log.add(`Downloaded ${name} (${fmtBytes(blob.size)})`, 'ok');
}

/* ============================================================================
 * Charts — pure Canvas
 * ========================================================================== */
const Charts = {
  css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); },
  setup(cv, w, h) {
    const dpr = devicePixelRatio || 1;
    cv.width = w*dpr; cv.height = h*dpr; cv.style.width = w+'px'; cv.style.height = h+'px';
    const c = cv.getContext('2d'); c.scale(dpr,dpr); return c;
  },
  donut(cv, ratio, label, sub) {                       // gateway gauge
    const W=150,H=150,c=this.setup(cv,W,H),cx=W/2,cy=H/2,r=58;
    const over = ratio > 1;
    c.lineWidth = 13; c.lineCap='round';
    c.strokeStyle = this.css('--line'); c.beginPath();
    c.arc(cx,cy,r,-Math.PI/2,Math.PI*1.5); c.stroke();
    const grad = c.createLinearGradient(0,0,W,H);
    grad.addColorStop(0, this.css(over?'--err':'--accent2'));
    grad.addColorStop(1, this.css(over?'--err':'--accent'));
    c.strokeStyle = grad; c.beginPath();
    c.arc(cx,cy,r,-Math.PI/2,-Math.PI/2 + Math.min(1,ratio)*Math.PI*2); c.stroke();
    c.fillStyle = this.css('--text'); c.textAlign='center';
    c.font = '700 22px '+this.css('--font-ui'); c.fillText(label, cx, cy+2);
    c.fillStyle = this.css('--muted'); c.font='11px '+this.css('--font-ui');
    c.fillText(sub, cx, cy+22);
  },
  bars(cv, data, w=440, h=190) {                       // [{label, value}]
    const c = this.setup(cv,w,h);
    if (!data.length) return;
    const max = Math.max(...data.map(d=>d.value)) || 1;
    const bw = Math.min(46, (w-50)/data.length - 12);
    const grad = c.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,this.css('--accent')); grad.addColorStop(1,this.css('--accent2'));
    data.forEach((d,i) => {
      const x = 30 + i*((w-50)/data.length) + 6;
      const bh = Math.max(3,(d.value/max)*(h-58));
      c.fillStyle = grad;
      const y = h-34-bh;
      c.beginPath(); c.roundRect(x, y, bw, bh, 5); c.fill();
      c.fillStyle = this.css('--muted'); c.font='10px '+this.css('--font-ui'); c.textAlign='center';
      c.fillText(d.label.length>9?d.label.slice(0,8)+'…':d.label, x+bw/2, h-18);
      c.fillStyle = this.css('--text'); c.font='600 10px '+this.css('--font-ui');
      c.fillText(fmtInt(d.value), x+bw/2, y-5);
    });
  }
};

/* ============================================================================
 * Editor — custom (line numbers, current line, find/replace, goto, folding-lite)
 * ========================================================================== */
const Editor = {
  ta:null, hi:null, gut:null, matches:[], matchIdx:-1,
  init() {
    this.ta = $('#ed'); this.hi = $('#hilite'); this.gut = $('#gutter');
    this.ta.addEventListener('input', () => { this.onChange(); });
    this.ta.addEventListener('scroll', () => {
      this.hi.scrollTop = this.ta.scrollTop; this.hi.scrollLeft = this.ta.scrollLeft;
      this.gut.scrollTop = this.ta.scrollTop;
    });
    this.ta.addEventListener('keyup', () => this.updateCaret());
    this.ta.addEventListener('click', () => this.updateCaret());
    this.ta.addEventListener('contextmenu', e => {
      e.preventDefault();
      Ctx.show(e.clientX, e.clientY, [
        { label:'Cut',        k:'Ctrl+X', fn:()=>document.execCommand('cut') },
        { label:'Copy',       k:'Ctrl+C', fn:()=>document.execCommand('copy') },
        { label:'Paste',      k:'Ctrl+V', fn:async()=>{ try{ this.insert(await navigator.clipboard.readText()); }catch(_){ Toast.show('Clipboard blocked by browser — use Ctrl+V','warn'); } } },
        { label:'Select all', k:'Ctrl+A', fn:()=>{ this.ta.focus(); this.ta.select(); } },
        '-',
        { label:'Pretty print',  k:'Ctrl+P', fn:()=>App.pretty() },
        { label:'Validate file', k:'Ctrl+E', fn:()=>App.go('validate', true) },
        { label:'Go to line…',   k:'Ctrl+G', fn:()=>this.gotoLine() },
      ]);
    });
  },
  set(text) {
    this.ta.value = text ?? '';
    this.onChange(true);
  },
  get(){ return this.ta.value; },
  insert(t) {
    const s = this.ta.selectionStart, e = this.ta.selectionEnd;
    this.ta.setRangeText(t, s, e, 'end'); this.onChange();
  },
  onChange(fresh=false) {
    const d = Store.active;
    if (d && !fresh) { d.text = this.ta.value; d.dirty = true; }
    this.renderGutter(); this.renderHighlight(); this.updateCaret();
  },
  renderGutter() {
    const n = this.ta.value.split('\n').length;
    const cur = this.curLine();
    let out = '';
    for (let i = 1; i <= n; i++)
      out += i === cur ? `<span class="cur">${i}</span>\n` : i + '\n';
    this.gut.innerHTML = out;
    this.gut.scrollTop = this.ta.scrollTop;
  },
  renderHighlight() {
    const v = this.ta.value;
    if (v.length > Settings.data.highlightLimitKB*1024) {   // plain mode for huge docs
      this.ta.classList.add('plain'); this.hi.innerHTML = ''; return;
    }
    this.ta.classList.remove('plain');
    this.hi.innerHTML = Xml.highlight(v) + '\n';
  },
  curLine() {
    return this.ta.value.slice(0, this.ta.selectionStart).split('\n').length;
  },
  updateCaret() {
    const line = this.curLine();
    const col = this.ta.selectionStart - this.ta.value.lastIndexOf('\n', this.ta.selectionStart-1);
    $('#sb-pos').textContent = `Ln ${line}, Col ${col}`;
    this.renderGutter();
  },
  async gotoLine() {
    const v = await Dialog.prompt('Go to line', 'Line number:');
    if (!v) return;
    const lines = this.ta.value.split('\n');
    const n = Math.max(1, Math.min(lines.length, parseInt(v)||1));
    let idx = 0; for (let i = 0; i < n-1; i++) idx += lines[i].length + 1;
    this.ta.focus(); this.ta.setSelectionRange(idx, idx + lines[n-1].length);
    const lh = 12.5*1.55;
    this.ta.scrollTop = Math.max(0, (n-6)*lh);
    this.updateCaret();
  },
  find(q, { regex=false } = {}) {
    this.matches = []; this.matchIdx = -1;
    if (!q) { $('#find-count').textContent=''; return; }
    try {
      const re = regex ? new RegExp(q, 'g') : new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
      let m; const v = this.ta.value;
      while ((m = re.exec(v)) && this.matches.length < 20000) {
        this.matches.push([m.index, m.index + (m[0].length||1)]);
        if (!m[0].length) re.lastIndex++;
      }
    } catch(_) {}
    $('#find-count').textContent = this.matches.length ? `${this.matches.length} match(es)` : 'No matches';
    if (this.matches.length) this.findNext();
  },
  findNext(dir=1) {
    if (!this.matches.length) return;
    this.matchIdx = (this.matchIdx + dir + this.matches.length) % this.matches.length;
    const [s,e] = this.matches[this.matchIdx];
    this.ta.focus(); this.ta.setSelectionRange(s,e);
    const line = this.ta.value.slice(0,s).split('\n').length;
    this.ta.scrollTop = Math.max(0,(line-6)*12.5*1.55);
    $('#find-count').textContent = `${this.matchIdx+1} / ${this.matches.length}`;
    this.updateCaret();
  },
  replaceOne(q, r) {
    if (this.matchIdx < 0) { this.find(q); return; }
    const [s,e] = this.matches[this.matchIdx];
    this.ta.setRangeText(r, s, e, 'select');
    this.onChange(); this.find(q);
  },
  replaceAll(q, r) {
    if (!q) return;
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    const before = this.ta.value;
    this.ta.value = before.replace(re, r);
    const n = (before.match(re)||[]).length;
    this.onChange();
    Toast.show(`Replaced ${n} occurrence(s)`, n?'ok':'warn');
  }
};

/* ============================================================================
 * Tree view (lazy, capped children)
 * ========================================================================== */
const Tree = {
  render(container, doc) {
    container.innerHTML = '';
    if (!doc) { container.append(el('div',{class:'muted'},'No parsed document (file too large for DOM mode or not well-formed).')); return; }
    container.append(this.node(doc.documentElement, 0));
  },
  node(elm, depth) {
    const wrap = el('div', { class:'tnode' + (depth<2?' open':'') });
    const row = el('div', { class:'trow', tabindex:'0', role:'treeitem' });
    const hasKids = elm.children.length > 0;
    const tw = el('span', { class:'twist' }, hasKids ? '▶' : '·');
    row.append(tw, el('span',{class:'tname'}, '<'+elm.nodeName+'>'));
    for (const a of [...elm.attributes].slice(0,4))
      row.append(el('span',{class:'tattr'}, ` ${a.name}="${a.value.slice(0,30)}"`));
    if (hasKids) row.append(el('span',{class:'tcount'}, ` (${elm.children.length})`));
    else {
      const t = elm.textContent.trim();
      if (t) row.append(el('span',{class:'ttext'}, ' = ' + t.slice(0,120)));
    }
    wrap.append(row);
    if (hasKids) {
      const kids = el('div', { class:'kids' });
      let built = false;
      const build = () => {
        if (built) return; built = true;
        const cap = 400;
        [...elm.children].slice(0, cap).forEach(c => kids.append(this.node(c, depth+1)));
        if (elm.children.length > cap)
          kids.append(el('div',{class:'tnode muted small'}, `… ${fmtInt(elm.children.length-cap)} more siblings (capped for performance)`));
      };
      if (depth < 2) build();
      const toggle = () => { wrap.classList.toggle('open'); if (wrap.classList.contains('open')) build(); };
      tw.style.cursor = 'pointer';
      row.addEventListener('dblclick', toggle);
      tw.addEventListener('click', toggle);
      row.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); toggle(); } });
      wrap.append(kids);
    }
    return wrap;
  }
};

/* ============================================================================
 * Sample JPK_KR_PD generator (offline demo data)
 * ========================================================================== */
function generateSample(rows = 400) {
  const pad = (n,l=6)=>String(n).padStart(l,'0');
  const nips = ['5261040828','7010001454','5252248481','1132191233','8992689516'];
  const accounts = ['010','130','201','202','300','401','402','490','700','760'];
  const descs = ['Faktura sprzedaży','Faktura zakupu','Wyciąg bankowy','Amortyzacja ŚT','PK — przeksięgowanie','Lista płac','Delegacja','Nota odsetkowa'];
  let sumW = 0, sumM = 0, out = [];
  out.push('<?xml version="1.0" encoding="UTF-8"?>');
  out.push('<JPK xmlns="http://crd.gov.pl/wzor/2025/13/09/13092/">');
  out.push('  <Naglowek>');
  out.push('    <KodFormularza kodSystemowy="JPK_KR_PD (1)" wersjaSchemy="1-0">JPK_KR_PD</KodFormularza>');
  out.push('    <WariantFormularza>1</WariantFormularza>');
  out.push('    <CelZlozenia>1</CelZlozenia>');
  out.push(`    <DataWytworzeniaJPK>${new Date().toISOString().slice(0,19)}</DataWytworzeniaJPK>`);
  out.push('    <DataOd>2025-01-01</DataOd><DataDo>2025-12-31</DataDo>');
  out.push('    <KodUrzedu>1449</KodUrzedu>');
  out.push('  </Naglowek>');
  out.push('  <Podmiot1>');
  out.push('    <NIP>5261040828</NIP>');
  out.push('    <PelnaNazwa>DEMO Spolka z o.o.</PelnaNazwa>');
  out.push('  </Podmiot1>');
  for (let i = 1; i <= rows; i++) {
    const amt = (Math.random()*90000+50).toFixed(2);
    sumW += +amt; sumM += +amt;
    const mth = pad(1+Math.floor(Math.random()*12),2), day = pad(1+Math.floor(Math.random()*28),2);
    out.push('  <Dziennik>');
    out.push(`    <NrZapisu>${pad(i)}</NrZapisu>`);
    out.push(`    <DataOperacji>2025-${mth}-${day}</DataOperacji>`);
    out.push(`    <OpisOperacji>${descs[i%descs.length]} nr ${i}/2025</OpisOperacji>`);
    out.push(`    <KontoWinien>${accounts[i%accounts.length]}</KontoWinien>`);
    out.push(`    <KontoMa>${accounts[(i+3)%accounts.length]}</KontoMa>`);
    out.push(`    <KwotaWinien>${amt}</KwotaWinien>`);
    out.push(`    <KwotaMa>${amt}</KwotaMa>`);
    out.push(`    <KodKontrahenta>K${pad(i%40,4)}</KodKontrahenta>`);
    out.push(`    <NIPKontrahenta><NIP>${nips[i%nips.length]}</NIP></NIPKontrahenta>`);
    out.push('  </Dziennik>');
  }
  out.push('  <DziennikCtrl>');
  out.push(`    <LiczbaWierszyDziennika>${rows}</LiczbaWierszyDziennika>`);
  out.push(`    <SumaWinien>${sumW.toFixed(2)}</SumaWinien>`);
  out.push(`    <SumaMa>${sumM.toFixed(2)}</SumaMa>`);
  out.push('  </DziennikCtrl>');
  out.push('</JPK>');
  return out.join('\n');
}
