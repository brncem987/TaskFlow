        Log.add(`Split ${d.name} → ${parts.length} parts using <${opts.tag}>`, 'ok');
      } catch(e) {
        if (e.message!=='cancelled') { Toast.show('Split failed: '+e.message,'err'); Log.add('Split error: '+e.message,'err'); }
      }
      Task.end();
    };
    $('#sp-zip', card).onclick = async () => {
      if (!lastParts) return;
      const total = lastParts.reduce((s,p)=>s+p.blob.size,0);
      if (total > 400*MB && !(await Dialog.confirm('Large archive',
        `The uncompressed archive will be ${fmtBytes(total)}. Building it in the browser may take a while. Continue?`))) return;
      const task = Task.start('Building ZIP…');
      try {
        const z = new ZipBuilder();
        lastParts.forEach(p=>z.add(p.name, p.blob));
        const blob = await z.build(task);
        download(blob, d.name.replace(/\.xml$/i,'') + '_parts.zip');
      } catch(e){ if (e.message!=='cancelled') Toast.show('ZIP failed: '+e.message,'err'); }
      Task.end();
    };
  },

  /* ------------------------------- analyze ------------------------------ */
  async analyze() {
    const v = $('#view-analyze'); v.innerHTML = '';
    const d = Store.active;
    if (!d) { v.append(el('div',{class:'card muted'},'Open a file first.')); return; }
    if (!d.doc) { v.append(el('div',{class:'card muted'},'Analysis needs a parsed document. This file is in large-file/stream mode or is not well-formed.')); return; }
    if (!d.stats) {
      const task = Task.start('Analyzing…');
      try { d.stats = await Analyzer.run(d.doc, task); } catch(e){ Task.end(); return; }
      Task.end(); UI.status();
    }
    const s = d.stats;
    const cards = el('div',{class:'cards'});
    const mk = (t,val,sub)=>el('div',{class:'card'},el('h3',{},t),el('div',{class:'metric'},val,sub?el('small',{},sub):null));
    cards.append(
      mk('Total nodes', fmtInt(s.nodes)), mk('Elements', fmtInt(s.elements)),
      mk('Attributes', fmtInt(s.attributes)), mk('Text nodes', fmtInt(s.textNodes)),
      mk('Comments', fmtInt(s.comments)), mk('Max depth', s.maxDepth),
      mk('Namespaces', s.namespaces.size), mk('Distinct tags', s.names.size),
      mk('DOM memory est.', fmtBytes(s.memoryEstimate)), mk('Complexity index', s.complexity, 'log-scaled'));
    v.append(cards);

    const g = el('div',{class:'grid',style:'grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:14px'});
    const freq = [...s.names.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8)
      .map(([label,value])=>({label:label.replace(/^.*:/,''),value}));
    const c1 = el('div',{class:'card'},el('h3',{},'Most frequent elements'));
    const cv1 = el('canvas'); c1.append(cv1); g.append(c1);

    const c2 = el('div',{class:'card'},el('h3',{},'Largest branches (root children, grouped)'));
    s.rootGroups.slice(0,8).forEach(b=>{
      const max = s.rootGroups[0].count;
      c2.append(el('div',{style:'margin-bottom:9px'},
        el('div',{class:'row small',style:'justify-content:space-between;margin-bottom:3px'},
          el('span',{},`<${b.name}>` + (b.times>1?` ×${fmtInt(b.times)}`:'')),
          el('span',{class:'muted'},fmtInt(b.count)+' elements')),
        el('div',{class:'bar'},el('i',{style:`width:${b.count/max*100}%`}))));
    });
    g.append(c2);

    const c3 = el('div',{class:'card'},el('h3',{},'Repeated element names'),
      el('table',{class:'tbl'},
        el('thead',{},el('tr',{},el('th',{},'Element'),el('th',{},'Occurrences'))),
        el('tbody',{},...s.repeated.map(([n,c])=>el('tr',{},el('td',{},n),el('td',{},fmtInt(c)))))));
    g.append(c3);

    const c4 = el('div',{class:'card'},el('h3',{},'Namespaces'),
      s.namespaces.size
        ? el('table',{class:'tbl'},
            el('thead',{},el('tr',{},el('th',{},'URI'),el('th',{},'Elements'))),
            el('tbody',{},...[...s.namespaces.entries()].map(([n,c])=>el('tr',{},el('td',{},n),el('td',{},fmtInt(c))))))
        : el('div',{class:'muted small'},'No namespaces in use.'));
    g.append(c4);
    v.append(g);
    requestAnimationFrame(()=>Charts.bars(cv1, freq, Math.min(460, cv1.parentElement.clientWidth-32)));
  },

  /* ------------------------------- export ------------------------------- */
  export() {
    const v = $('#view-export'); v.innerHTML = '';
    const d = Store.active;
    if (!d) { v.append(el('div',{class:'card muted'},'Open a file first.')); return; }
    const base = d.name.replace(/\.xml$/i,'');
    const items = [
      ['XML', 'The current document (with editor changes applied).', () => {
        download(new Blob([d.text ?? ''],{type:'application/xml'}), base+'.xml'); }],
      ['Pretty XML', 'Re-indented XML.', async () => {
        const task = Task.start('Formatting…');
        try { const p = await Xml.prettyPrint(d.text ?? '', task);
          download(new Blob([p],{type:'application/xml'}), base+'_pretty.xml'); } catch(_){}
        Task.end(); }],
      ['JSON', 'XML converted to a JSON object (attributes as "@attr", text as "#text").', () => {
        if (!d.doc) return Toast.show('Needs a parsed document.','warn');
        download(new Blob([JSON.stringify(Xml.xmlToJson(d.doc), null, 2)],{type:'application/json'}), base+'.json'); }],
      ['CSV', 'Repeated record elements flattened into a table.', () => {
        if (!d.doc) return Toast.show('Needs a parsed document.','warn');
        const tag = Splitter.detectRecordTag(d);
        const csv = Xml.toCsv(d.doc, tag);
        if (!csv) return Toast.show(`No repeated <${tag}> records to tabulate.`,'warn');
        download(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}), base+`_${tag}.csv`); }],
      ['TXT', 'Plain text content (all text nodes).', () => {
        const t = d.doc ? d.doc.documentElement.textContent : (d.text||'');
        download(new Blob([t],{type:'text/plain'}), base+'.txt'); }],
      ['PDF report', 'Validation & statistics report — PDF generated byte-by-byte in the browser.', () => App.exportReportPdf()],
      ['ZIP', 'The current document packed into a ZIP (manual ZIP writer, no libraries).', async () => {
        const task = Task.start('Building ZIP…');
        try { const z = new ZipBuilder();
          z.add(d.name, d.file && !d.dirty ? d.file : new Blob([d.text??''],{type:'application/xml'}));
          download(await z.build(task), base+'.zip'); } catch(_){}
        Task.end(); }],
    ];
    const card = el('div',{class:'card'}, el('h3',{},'Export — all formats generated locally, zero dependencies'));
    items.forEach(([label, desc, fn]) => card.append(el('div',{class:'part'},
      el('b',{style:'width:110px;flex:none'},label),
      el('span',{class:'ps',style:'flex:1;white-space:normal'},desc),
      el('button',{class:'btn acc',onclick:fn},'Export'))));
    v.append(card);
  },

  /* ------------------------------ settings ------------------------------ */
  settings() {
    const v = $('#view-settings'); v.innerHTML = '';
    const S = Settings.data;
    const num = (key,label,min,max)=>el('label',{class:'field'},label,
      el('input',{type:'number',value:S[key],min,max,oninput(e){ S[key]=+e.target.value; Settings.save(); }}));
    const card = el('div',{class:'card'},
      el('h3',{},'Preferences'),
      el('div',{class:'row'},
        el('label',{class:'field'},'Theme',
          el('select',{oninput(e){ App.setTheme(e.target.value); }},
            el('option',{value:'dark',...(S.theme==='dark'?{selected:''}:{})},'Dark'),
            el('option',{value:'light',...(S.theme==='light'?{selected:''}:{})},'Light'))),
        num('splitTargetMB','Default split size (MB)',1,99),
        num('splitCount','Default records per part',1),
        el('label',{class:'field'},'Record element override',
          el('input',{type:'text',value:S.recordTag,placeholder:'auto-detect',oninput(e){ S.recordTag=e.target.value.trim(); Settings.save(); }}))),
      el('hr',{class:'sep'}),
      el('div',{class:'row'},
        num('domLimitMB','DOM parse limit (MB) — above this, streaming mode',5,500),
        num('highlightLimitKB','Syntax-highlight limit (KB)',100,20000),
        el('label',{class:'field'},'Recompute DziennikCtrl on split',
          el('select',{oninput(e){ S.keepCtrl = e.target.value==='1'; Settings.save(); }},
            el('option',{value:'1',...(S.keepCtrl?{selected:''}:{})},'Yes (recommended)'),
            el('option',{value:'0',...(!S.keepCtrl?{selected:''}:{})},'No — copy as-is')))),
      el('hr',{class:'sep'}),
      el('div',{class:'row'},
        el('button',{class:'btn danger',onclick:async()=>{
          if (await Dialog.confirm('Clear recent files','Remove the recent-files list stored in this browser?')) {
            Store.recents=[]; try{localStorage.removeItem('jpkstudio-recent');}catch(_){}
            UI.renderRecents(); Toast.show('Recent files cleared','ok');
          }}},'Clear recent files'),
        el('span',{class:'muted small'},'Settings persist in this browser only. The app never makes a network request.')));
    v.append(card);
  }
};
</script>
<script>
"use strict";
/* ============================================================================
 * App controller — file loading, shortcuts, drag & drop, wiring
 * ========================================================================== */
const App = {
  async init() {
    Settings.load(); Store.loadRecents();
    this.setTheme(Settings.data.theme);
    UI.init(); UI.go('dashboard'); UI.status();
    Log.add('JPK Studio ready — fully offline, no dependencies.', 'ok');

    $('#btn-open').onclick   = () => $('#file-input').click();
    $('#btn-sample').onclick = () => this.loadSample();
    $('#btn-theme').onclick  = () => this.setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
    $('#btn-sidebar').onclick= () => $('#sidebar').classList.toggle('collapsed');
    $('#btn-logs').onclick   = () => $('#logs-drawer').classList.toggle('show');
    $('#btn-logs-close').onclick = () => $('#logs-drawer').classList.remove('show');
    $('#btn-logs-clear').onclick = () => Log.clear();
    $('#btn-help').onclick   = () => this.helpDialog();
    $('#btn-validate-quick').onclick = () => this.go('validate', true);
    $('#btn-split-quick').onclick    = () => this.go('split');
    $('#file-input').addEventListener('change', e => {
      for (const f of e.target.files) this.loadFile(f);
      e.target.value = '';
    });

    /* drag & drop anywhere */
    ['dragover','dragenter'].forEach(ev => document.addEventListener(ev, e => {
      e.preventDefault(); $('#drop')?.classList.add('hot');
    }));
    ['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
      e.preventDefault(); if (ev==='dragleave' && e.relatedTarget) return;
      $('#drop')?.classList.remove('hot');
    }));
    document.addEventListener('drop', e => {
      for (const f of e.dataTransfer.files)
        if (/\.xml$/i.test(f.name) || f.type.includes('xml') || !f.type) this.loadFile(f);
        else Toast.show(`${f.name}: not an XML file`, 'warn');
    });

    /* sidebar resizer */
    const rez = $('#side-resizer');
    rez.addEventListener('mousedown', e => {
      e.preventDefault();
      const move = ev => { $('#sidebar').style.width = Math.max(170, Math.min(420, ev.clientX)) + 'px'; };
      const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
      addEventListener('mousemove', move); addEventListener('mouseup', up);
    });
    /* logs drawer resizer */
    $('#logs-head').addEventListener('mousedown', e => {
      if (e.target.closest('button')) return;
      e.preventDefault();
      const drawer = $('#logs-drawer'), startY = e.clientY, startH = drawer.offsetHeight;
      const move = ev => { drawer.style.height = Math.max(70, Math.min(innerHeight*0.6, startH + (startY-ev.clientY))) + 'px'; };
      const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
      addEventListener('mousemove', move); addEventListener('mouseup', up);
    });

    /* keyboard shortcuts */
    document.addEventListener('keydown', e => {
      const c = e.ctrlKey || e.metaKey;
      if (c && e.key >= '1' && e.key <= '8') { e.preventDefault(); this.go(NAV[+e.key-1].id); return; }
      if (c) switch (e.key.toLowerCase()) {
        case 'o': e.preventDefault(); $('#file-input').click(); break;
        case 'b': e.preventDefault(); $('#sidebar').classList.toggle('collapsed'); break;
        case 'j': e.preventDefault(); this.setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); break;
        case 'p': e.preventDefault(); this.pretty(); break;
        case 'f': if (UI.view==='editor'){ e.preventDefault(); this.toggleFind(true); } break;
        case 'h': if (UI.view==='editor'){ e.preventDefault(); this.toggleFind(true); $('#repl-q').focus(); } break;
        case 'g': if (UI.view==='editor'){ e.preventDefault(); Editor.gotoLine(); } break;
        case 'e': e.preventDefault(); this.go('validate', true); break;
        case 's': e.preventDefault(); this.go('export'); break;
      }
      if (e.key === 'F1') { e.preventDefault(); this.helpDialog(); }
      if (e.key === 'Escape') this.toggleFind(false);
    });
  },

  setTheme(t) {
    document.documentElement.dataset.theme = t;
    Settings.data.theme = t; Settings.save();
    if (UI.view==='dashboard') Views.dashboard();
    if (UI.view==='analyze') { /* re-render charts with new palette */ const d=Store.active; if(d?.stats) Views.analyze(); }
  },

  go(view, arg) { UI.go(view); if (view==='validate' && arg) Views.validate(true); },

  toggleFind(show) {
    const fb = $('#findbar'); if (!fb) return;
    fb.classList.toggle('show', !!show);
    if (show) { $('#find-q').focus(); $('#find-q').select(); }
  },

  async loadSample() {
    const rows = await Dialog.prompt('Generate sample JPK_KR_PD', 'Number of journal entries (Dziennik records):', '400');
    if (rows === null) return;
    const text = generateSample(Math.max(1, Math.min(200000, parseInt(rows)||400)));
    const blob = new Blob([text], { type:'application/xml' });
    const f = new File([blob], `sample_JPK_KR_PD_${rows}.xml`, { type:'application/xml' });
    this.loadFile(f);
  },

  async loadFile(file) {
    const task = Task.start('Loading ' + file.name + '…');
    const d = makeDoc(file.name, file.size);
    d.file = file;
    try {
      /* encoding + UTF-8 scan on a chunk (full scan for files < 64 MB) */
      const headBytes = new Uint8Array(await file.slice(0, 4096).arrayBuffer());
      d.encoding = Xml.detectEncoding(headBytes);
      Task.progress(0.1);
      if (file.size <= 64*MB) {
        const all = new Uint8Array(await file.arrayBuffer());
        d.utf8ok = Xml.validateUtf8(all).ok;
      } else {
        const probe = new Uint8Array(await file.slice(0, 8*MB).arrayBuffer());
        d.utf8ok = Xml.validateUtf8(probe.slice(0, probe.length-4)).ok;   // avoid split multibyte at edge
      }
      Task.progress(0.3);

      d.big = file.size > Settings.data.domLimitMB*MB;
      if (!d.big) {
        d.text = await file.text();
        Task.progress(0.55);
        const { doc, error, line } = Xml.parse(d.text);
        d.doc = doc; d.parseError = error; d.parseLine = line;
        if (doc) {
          const t2 = Task.active;
          d.stats = await Analyzer.run(doc, t2);
        } else {
          Log.add(`Parse error in ${file.name}: ${error}`, 'err');
        }
      } else {
        Log.add(`${file.name} opened in large-file mode (${fmtBytes(file.size)} > ${Settings.data.domLimitMB} MB DOM limit).`, 'warn');
      }

      Store.docs.set(d.id, d);
      Store.activeId = d.id;
      Store.addRecent(d.name, d.size);
      UI.renderTabs(); UI.status();
      Task.end();
      Toast.show(`${file.name} loaded (${fmtBytes(file.size)})`, 'ok');
      if (file.size > MF_LIMIT)
        Toast.show('This file exceeds the 100 MB MF gateway limit — use Split.', 'warn', 6000);
      this.go(d.doc || d.big ? 'dashboard' : 'editor');
      if (!d.doc && !d.big && d.parseError) {
        this.go('editor');
        Toast.show('XML is not well-formed — opened in editor. ' + (d.parseLine?`(line ${d.parseLine})`:''), 'err', 6000);
      }
      /* auto validation summary */
      await Validator.run(d, null).catch(()=>{});
      UI.status();
      if (UI.view==='dashboard') Views.dashboard();
    } catch (e) {
      Task.end();
      Toast.show('Failed to load: ' + e.message, 'err');
      Log.add('Load error: ' + e.message, 'err');
    }
  },

  activate(id) {
    Store.activeId = id;
    UI.renderTabs(); UI.status();
    Views[UI.view]?.();
  },

  async closeDoc(id) {
    const d = Store.docs.get(id);
    if (d?.dirty && !(await Dialog.confirm('Unsaved changes', `${d.name} has unsaved editor changes. Close anyway?`))) return;
    Store.docs.delete(id);
    if (Store.activeId === id) Store.activeId = [...Store.docs.keys()].pop() || null;
    UI.renderTabs(); UI.status(); Views[UI.view]?.();
  },

  async pretty() {
    const d = Store.active;
    if (!d || d.big) return Toast.show('Pretty print needs a document loaded in the editor.','warn');
    const task = Task.start('Pretty printing…');
    try {
      const p = await Xml.prettyPrint(d.text ?? Editor.get(), task);
      d.text = p; d.dirty = true;
      if (UI.view!=='editor') this.go('editor');
      Editor.set(p);
      UI.renderTabs();
      Toast.show('Formatted','ok');
    } catch(e){ if (e.message!=='cancelled') Toast.show('Format failed: '+e.message,'err'); }
    Task.end();
  },

  applyEditor() {
    const d = Store.active;
    if (!d) return;
    d.text = Editor.get(); d.dirty = true;
    const { doc, error, line } = Xml.parse(d.text);
    d.doc = doc; d.parseError = error;
    d.stats = null; d.issues = null;
    d.size = new Blob([d.text]).size;
    d.file = null;
    UI.renderTabs(); UI.status();
    if (error) Toast.show(`Still not well-formed${line?` (line ${line})`:''} — changes kept in memory.`, 'warn', 5000);
    else Toast.show('Changes applied — document re-parsed.', 'ok');
  },

  async xpathDialog() {
    const d = Store.active;
    if (!d?.doc) return Toast.show('XPath needs a parsed document.','warn');
    const q = await Dialog.prompt('XPath search',
      'Expression (namespaces: use *[local-name()="Dziennik"] for namespaced JPK):', '//*[local-name()="NIP"]');
    if (!q) return;
    try {
      const r = d.doc.evaluate(q, d.doc, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null);
      const rows = [];
      for (let i = 0; i < Math.min(r.snapshotLength, 200); i++) {
        const n = r.snapshotItem(i);
        rows.push(el('tr',{},
          el('td',{}, n.nodeName || n.nodeType),
          el('td',{}, (n.textContent||'').trim().slice(0,90))));
      }
      Dialog.open({ title:`XPath — ${fmtInt(r.snapshotLength)} match(es)`,
        body: rows.length
          ? el('div',{style:'max-height:50vh;overflow:auto'},
              el('table',{class:'tbl'},
                el('thead',{},el('tr',{},el('th',{},'Node'),el('th',{},'Value'))),
                el('tbody',{},...rows)),
              r.snapshotLength>200?el('div',{class:'muted small',style:'margin-top:8px'},'Showing first 200.'):null)
          : 'No matches.',
        buttons:[{label:'Close', value:true, acc:true}] });
      Log.add(`XPath "${q}" → ${r.snapshotLength} matches`);
    } catch(e) { Toast.show('XPath error: '+e.message,'err'); }
  },

  exportReportPdf() {
    const d = Store.active;
    if (!d) return Toast.show('Open a file first.','warn');
    const L = [];
    L.push(`File: ${d.name}`);
    L.push(`Size: ${fmtBytes(d.size)}  |  MF gateway limit usage: ${(d.size/MF_LIMIT*100).toFixed(1)}% of 100 MB`);
    L.push(`Encoding: ${d.encoding}  |  UTF-8 valid: ${d.utf8ok===null?'n/a':d.utf8ok?'yes':'NO'}`);
    L.push(`Generated: ${new Date().toLocaleString()}  |  JPK Studio (offline single-file tool)`);
    L.push('');
    if (d.stats) {
      const s = d.stats;
      L.push('--- STATISTICS ---');
      L.push(`Nodes ${fmtInt(s.nodes)} | Elements ${fmtInt(s.elements)} | Attributes ${fmtInt(s.attributes)} | Text nodes ${fmtInt(s.textNodes)}`);
      L.push(`Comments ${s.comments} | Max depth ${s.maxDepth} | Namespaces ${s.namespaces.size} | Distinct tags ${s.names.size}`);
      L.push(`DOM memory estimate ${fmtBytes(s.memoryEstimate)} | Complexity index ${s.complexity}`);
      L.push('');
    }
    L.push('--- VALIDATION ---');
    if (d.issues) d.issues.forEach(i => {
      L.push(`[${i.sev.toUpperCase()}] ${i.title}`);
      L.push(`        ${i.detail}`);
    });
    else L.push('Not validated yet — run Validation first for the full rule set.');
    download(buildPdf('JPK Studio — file report', L), d.name.replace(/\.xml$/i,'') + '_report.pdf');
  },

  helpDialog() {
    const rows = [
      ['Ctrl+O','Open XML file'],['Ctrl+1…8','Switch view (Dashboard…Settings)'],
      ['Ctrl+P','Pretty print'],['Ctrl+F / Ctrl+H','Find / Replace (editor)'],
      ['Ctrl+G','Go to line'],['Ctrl+E','Run validation'],['Ctrl+S','Export view'],
      ['Ctrl+B','Toggle sidebar'],['Ctrl+J','Toggle theme'],['F1','This help'],['Esc','Close find / dialogs'],
    ];
    Dialog.open({ title:'Keyboard shortcuts',
      body: el('table',{class:'tbl shortcuts'}, el('tbody',{},
        ...rows.map(([k,v])=>el('tr',{},el('td',{},el('kbd',{class:'k'},k)),el('td',{},v))))),
      buttons:[{label:'Close',value:true,acc:true}] });
  }
};

App.init();
</script>
</body>
</html>
