<!DOCTYPE html>
<html lang="en" data-theme="daylight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Personal Task Tracker</title>
<style>
/* ============ THEMES ============ */
:root{
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.9,.3,1);
}
[data-theme="daylight"]{
  --bg:#f4f5f7; --bg-grad:linear-gradient(180deg,#f7f8fa 0%,#eef0f4 100%);
  --panel:#ffffff; --panel2:#f8f9fb; --card:#ffffff; --border:#e4e6eb; --border2:#d8dbe2;
  --text:#1b1e25; --muted:#6b7280; --faint:#9aa1ad;
  --accent:#4f5de4; --accent-soft:#eceefc; --accent-text:#3a47c9;
  --danger:#dc3d43; --danger-soft:#fdecec; --warn:#e8740c; --warn-soft:#fdf1e5;
  --amber:#b88207; --amber-soft:#fcf5e0; --ok:#2f9e63; --ok-soft:#e7f6ee;
  --shadow:0 1px 2px rgba(20,22,30,.05),0 4px 16px rgba(20,22,30,.06);
  --shadow-lg:0 8px 40px rgba(20,22,30,.16);
  --drag-glow:0 8px 28px rgba(79,93,228,.28);
}
[data-theme="graphite"]{
  --bg:#0d0f13; --bg-grad:linear-gradient(180deg,#111318 0%,#0c0e12 100%);
  --panel:#161920; --panel2:#1c2029; --card:#1b1f27; --border:#272c37; --border2:#333a48;
  --text:#e8eaf0; --muted:#9aa3b2; --faint:#646d7d;
  --accent:#7b87ff; --accent-soft:#252a45; --accent-text:#a5adff;
  --danger:#ff6369; --danger-soft:#3a2226; --warn:#ff9f45; --warn-soft:#3a2c1d;
  --amber:#e8c35a; --amber-soft:#37301a; --ok:#4cc38a; --ok-soft:#1c3328;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 12px 48px rgba(0,0,0,.6);
  --drag-glow:0 8px 28px rgba(123,135,255,.35);
}
[data-theme="nordic"]{
  --bg:#edf2f3; --bg-grad:linear-gradient(180deg,#f0f5f6 0%,#e7eeef 100%);
  --panel:#ffffff; --panel2:#f5f9f9; --card:#ffffff; --border:#dde6e7; --border2:#cbd8da;
  --text:#16282b; --muted:#5d7378; --faint:#8da3a7;
  --accent:#0e7e88; --accent-soft:#e2f2f3; --accent-text:#0a6770;
  --danger:#d2403f; --danger-soft:#fbebea; --warn:#dd7011; --warn-soft:#fbf0e3;
  --amber:#a8851b; --amber-soft:#f8f2dd; --ok:#2c9061; --ok-soft:#e4f4ec;
  --shadow:0 1px 2px rgba(22,40,43,.05),0 4px 16px rgba(22,40,43,.07);
  --shadow-lg:0 8px 40px rgba(22,40,43,.18);
  --drag-glow:0 8px 28px rgba(14,126,136,.28);
}
[data-theme="espresso"]{
  --bg:#15110e; --bg-grad:linear-gradient(180deg,#1a1511 0%,#130f0c 100%);
  --panel:#201913; --panel2:#271f18; --card:#251d16; --border:#372c21; --border2:#473a2c;
  --text:#f0e8de; --muted:#b3a392; --faint:#7d6f5f;
  --accent:#e09a52; --accent-soft:#3a2c1c; --accent-text:#f0b97e;
  --danger:#f26d66; --danger-soft:#41241f; --warn:#f0a24a; --warn-soft:#3d2d18;
  --amber:#e3c46a; --amber-soft:#3a3219; --ok:#7cc08a; --ok-soft:#23331f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 12px 48px rgba(0,0,0,.6);
  --drag-glow:0 8px 28px rgba(224,154,82,.3);
}
[data-theme="midnight"]{
  --bg:#000000; --bg-grad:linear-gradient(180deg,#050507 0%,#000000 100%);
  --panel:#0c0d11; --panel2:#121319; --card:#101218; --border:#1f222c; --border2:#2b2f3c;
  --text:#e6e9f2; --muted:#8f97a8; --faint:#5a6172;
  --accent:#38c7d8; --accent-soft:#0e2a30; --accent-text:#6fdce9;
  --danger:#ff5d64; --danger-soft:#371d20; --warn:#ffa14e; --warn-soft:#382a18;
  --amber:#e5c455; --amber-soft:#332d15; --ok:#3fcf8e; --ok-soft:#15301f;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 6px 20px rgba(0,0,0,.5);
  --shadow-lg:0 12px 48px rgba(0,0,0,.8);
  --drag-glow:0 8px 28px rgba(56,199,216,.35);
}
[data-theme="ocean"]{
  --bg:#0a1220; --bg-grad:linear-gradient(180deg,#0d1626 0%,#091020 100%);
  --panel:#101b2e; --panel2:#15233a; --card:#142136; --border:#233450; --border2:#2e4366;
  --text:#e3ecf7; --muted:#92a5bf; --faint:#5e718c;
  --accent:#4d9fff; --accent-soft:#14304f; --accent-text:#7fb9ff;
  --danger:#ff6b70; --danger-soft:#3a2230; --warn:#ffa050; --warn-soft:#3a2c1a;
  --amber:#e7c560; --amber-soft:#34301c; --ok:#43c98c; --ok-soft:#14342a;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.4);
  --shadow-lg:0 12px 48px rgba(0,0,0,.65);
  --drag-glow:0 8px 28px rgba(77,159,255,.35);
}
[data-theme="sakura"]{
  --bg:#faf3f5; --bg-grad:linear-gradient(180deg,#fcf6f8 0%,#f7eef1 100%);
  --panel:#ffffff; --panel2:#fbf6f8; --card:#ffffff; --border:#f0dfe5; --border2:#e4ccd5;
  --text:#2a1e24; --muted:#8a707b; --faint:#b297a1;
  --accent:#d4527e; --accent-soft:#fbe9f0; --accent-text:#b83a66;
  --danger:#d63b41; --danger-soft:#fcebea; --warn:#e07514; --warn-soft:#fdf0e3;
  --amber:#b08415; --amber-soft:#faf3da; --ok:#2f9e63; --ok-soft:#e7f6ee;
  --shadow:0 1px 2px rgba(60,30,45,.05),0 4px 16px rgba(60,30,45,.07);
  --shadow-lg:0 8px 40px rgba(60,30,45,.17);
  --drag-glow:0 8px 28px rgba(212,82,126,.25);
}
[data-theme="forest"]{
  --bg:#eef3ec; --bg-grad:linear-gradient(180deg,#f2f6f0 0%,#e9efe6 100%);
  --panel:#ffffff; --panel2:#f6f9f4; --card:#ffffff; --border:#dde7d9; --border2:#cbd9c5;
  --text:#1c2a1e; --muted:#62755f; --faint:#91a38d;
  --accent:#3d8b4f; --accent-soft:#e5f2e7; --accent-text:#2e7340;
  --danger:#d2403f; --danger-soft:#fbebea; --warn:#d97714; --warn-soft:#fbf0e1;
  --amber:#a8861b; --amber-soft:#f6f1da; --ok:#2f8f5b; --ok-soft:#e4f3ea;
  --shadow:0 1px 2px rgba(28,42,30,.05),0 4px 16px rgba(28,42,30,.07);
  --shadow-lg:0 8px 40px rgba(28,42,30,.17);
  --drag-glow:0 8px 28px rgba(61,139,79,.25);
}
/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); background-image:var(--bg-grad);
  background-attachment:fixed; color:var(--text); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  transition:background .35s var(--ease), color .35s var(--ease);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::placeholder{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100vh}

/* ============ TOP BAR ============ */
.topbar{
  display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:var(--panel);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);z-index:40;flex-wrap:wrap;
  transition:background .35s var(--ease);
}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.02em;user-select:none}
.logo-mark{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-text));color:#fff;font-size:13px;font-weight:800;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
.searchbox{position:relative;flex:1;max-width:340px;min-width:160px}
.searchbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.searchbox input{
  width:100%;padding:7px 30px 7px 32px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--panel2);transition:border-color .2s,box-shadow .2s;
}
.searchbox input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:10px;color:var(--faint);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--panel);
}
/* status beacon — the signature element */
.beacon{
  display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--border);background:var(--panel2);font-size:12.5px;font-weight:600;
  cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;white-space:nowrap;
}
.beacon:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.beacon-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.beacon.warn .beacon-dot{background:var(--warn)}
.beacon.danger .beacon-dot{background:var(--danger);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 50%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.beacon .b-sep{color:var(--faint);font-weight:400}
.beacon .b-danger{color:var(--danger)} .beacon .b-warn{color:var(--warn)} .beacon .b-ok{color:var(--ok)}

.tb-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r-sm);
  font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--panel);
  transition:all .18s var(--ease);white-space:nowrap;
}
.btn:hover{background:var(--panel2);border-color:var(--border2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn.icon{padding:7px 9px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel2)}

/* ============ SUB BAR (views + filters) ============ */
.subbar{
  display:flex;align-items:center;gap:10px;padding:8px 18px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--panel) 60%,transparent);
  backdrop-filter:blur(8px);
}
.view-tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px}
.view-tab{
  padding:5px 14px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted);
  transition:all .2s var(--ease);display:flex;align-items:center;gap:6px;
}
.view-tab.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-sel{
  padding:5px 9px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel);
  font-size:12.5px;color:var(--muted);cursor:pointer;font-weight:500;
}
.chip-clear{font-size:12px;color:var(--accent-text);font-weight:600;display:none}
.chip-clear.show{display:inline-flex}

/* ============ BOARD ============ */
.main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding:18px;animation:viewIn .3s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.board{display:flex;gap:14px;align-items:flex-start;height:100%;min-width:min-content;padding-bottom:8px}
.col{
  width:292px;flex:none;display:flex;flex-direction:column;max-height:100%;
  background:color-mix(in srgb,var(--panel) 72%,transparent);
  border:1px solid var(--border);border-radius:var(--r-lg);
  backdrop-filter:blur(6px);transition:border-color .2s,box-shadow .2s;
}
.col.drag-over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.col-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.col-name{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.col-count{
  font-size:11px;font-weight:700;color:var(--muted);background:var(--panel2);
  border:1px solid var(--border);border-radius:999px;padding:1px 8px;font-family:var(--mono);
}
.col-menu-btn{margin-left:auto;color:var(--faint);padding:3px 6px;border-radius:6px;opacity:0;transition:opacity .15s}
.col:hover .col-menu-btn{opacity:1}
.col-menu-btn:hover{background:var(--panel2);color:var(--text)}
.col-body{overflow-y:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:8px;min-height:60px;flex:1}
.col-add{
  margin:0 10px 12px;padding:7px;border:1px dashed var(--border2);border-radius:var(--r-sm);
  color:var(--muted);font-size:12.5px;font-weight:600;transition:all .2s;
}
.col-add:hover{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.add-col-btn{
  width:240px;flex:none;padding:12px;border:1px dashed var(--border2);border-radius:var(--r-lg);
  color:var(--muted);font-weight:600;font-size:13px;transition:all .2s;height:fit-content;
}
.add-col-btn:hover{border-color:var(--accent);color:var(--accent-text)}

/* task card */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
  padding:11px 12px;cursor:grab;box-shadow:var(--shadow);
  transition:transform .18s var(--ease),box-shadow .18s,border-color .18s;
  animation:cardIn .28s var(--ease) backwards;position:relative;
}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--border2)}
.card.dragging{opacity:.45;transform:rotate(2deg) scale(1.02);box-shadow:var(--drag-glow);cursor:grabbing}
.card.done-card .card-title{text-decoration:line-through;color:var(--muted)}
.card-labels{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px}
.lbl{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.card-title{font-size:13.5px;font-weight:600;line-height:1.4;word-break:break-word}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.card-key{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:600}
.pri{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700}
.pri svg{flex:none}
.pri.urgent{color:var(--danger)} .pri.high{color:var(--warn)} .pri.medium{color:var(--amber)} .pri.low{color:var(--faint)}
.due-tag{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:6px;color:var(--muted);background:var(--panel2);border:1px solid var(--border);
}
.due-tag.overdue{color:var(--danger);background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.due-tag.today{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.due-tag.soon{color:var(--amber);background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
.card-icons{display:flex;align-items:center;gap:9px;margin-left:auto;color:var(--faint);font-size:11px}
.card-icons span{display:inline-flex;align-items:center;gap:3px}
.sub-progress{height:3px;border-radius:99px;background:var(--panel2);margin-top:9px;overflow:hidden;border:1px solid var(--border)}
.sub-progress i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s var(--ease)}
.avatar{
  width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;
  font-size:9.5px;font-weight:800;color:#fff;flex:none;letter-spacing:.02em;
}
.drop-hint{height:2px;background:var(--accent);border-radius:2px;margin:2px 4px;animation:hintIn .15s}
@keyframes hintIn{from{transform:scaleX(.5);opacity:0}to{transform:scaleX(1);opacity:1}}

/* ============ LIST VIEW ============ */
.list-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{
  text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);border-bottom:1px solid var(--border);background:var(--panel2);
  cursor:pointer;user-select:none;white-space:nowrap;
}
table.list th:hover{color:var(--text)}
table.list td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.list tr.row{cursor:pointer;transition:background .15s}
table.list tr.row:hover{background:var(--panel2)}
table.list tr:last-child td{border-bottom:none}
.status-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}

/* ============ DASHBOARD ============ */
.dash{max-width:1060px;margin:0 auto;display:grid;gap:16px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;
  box-shadow:var(--shadow);transition:transform .2s var(--ease);animation:cardIn .3s var(--ease) backwards;
}
.stat:hover{transform:translateY(-2px)}
.stat .s-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stat .s-value{font-size:30px;font-weight:750;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .s-sub{font-size:12px;color:var(--muted);margin-top:2px}
.stat.s-danger .s-value{color:var(--danger)} .stat.s-warn .s-value{color:var(--warn)} .stat.s-ok .s-value{color:var(--ok)}
.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.dash-cols{grid-template-columns:1fr}}
.dash-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow)}
.dash-panel h3{font-size:13px;font-weight:700;margin-bottom:12px;letter-spacing:-.01em}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.bar-row .br-name{width:110px;color:var(--muted);font-weight:600;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .6s var(--ease)}
.bar-row .br-n{width:26px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted)}
.up-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:6px;transition:background .15s}
.up-item:hover{background:var(--panel2)}
.up-item:last-child{border-bottom:none}
.up-title{font-weight:600;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ MODALS ============ */
.overlay{
  position:fixed;inset:0;background:rgba(10,12,18,.5);backdrop-filter:blur(4px);
  display:grid;place-items:center;z-index:100;animation:fadeIn .2s;padding:20px;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay.closing{animation:fadeOut .18s forwards}
@keyframes fadeOut{to{opacity:0}}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);
  width:min(780px,100%);max-height:min(86vh,900px);display:flex;flex-direction:column;
  animation:modalIn .3s var(--ease);
}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal.sm{width:min(440px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px 0}
.modal-key{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);padding:3px 9px;border-radius:6px}
.modal-close{margin-left:auto;color:var(--faint);padding:6px;border-radius:8px;line-height:0}
.modal-close:hover{background:var(--panel2);color:var(--text)}
.modal-body{padding:14px 20px 20px;overflow-y:auto}
.t-title{
  width:100%;font-size:19px;font-weight:700;letter-spacing:-.02em;border:none;background:transparent;
  padding:6px 0;border-bottom:2px solid transparent;transition:border-color .2s;
}
.t-title:focus{outline:none;border-bottom-color:var(--accent)}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
.field input,.field select{
  width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--panel2);transition:border-color .2s,box-shadow .2s;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.section{margin-top:18px}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.section-head h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.section-head .sh-btn{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent-text);padding:3px 8px;border-radius:6px}
.section-head .sh-btn:hover{background:var(--accent-soft)}
textarea.t-desc{
  width:100%;min-height:90px;resize:vertical;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--panel2);line-height:1.55;
}
textarea.t-desc:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.desc-render{padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel2);line-height:1.6;cursor:text;min-height:46px}
.desc-render:empty::before{content:"Add a description… (supports **bold**, *italic*, `code`)";color:var(--faint)}
.desc-render code{font-family:var(--mono);font-size:12px;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.desc-render a{color:var(--accent-text)}
/* labels editor */
.label-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lbl-del{margin-left:4px;opacity:.7;cursor:pointer;font-weight:800}
.lbl-input{width:120px;padding:4px 8px;border:1px dashed var(--border2);border-radius:999px;background:transparent;font-size:12px}
/* subtasks */
.sub-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;transition:background .15s}
.sub-item:hover{background:var(--panel2)}
.sub-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--ok);cursor:pointer;flex:none}
.sub-item .sub-text{flex:1;font-size:13px}
.sub-item.done .sub-text{text-decoration:line-through;color:var(--muted)}
.sub-item .x{color:var(--faint);opacity:0;padding:2px 6px;border-radius:5px}
.sub-item:hover .x{opacity:1}
.sub-item .x:hover{color:var(--danger);background:var(--danger-soft)}
.inline-add{display:flex;gap:8px;margin-top:6px}
.inline-add input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel2)}
.inline-add input:focus{outline:none;border-color:var(--accent)}
/* links */
.link-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:6px;background:var(--panel2)}
.link-item a{color:var(--accent-text);font-weight:600;font-size:13px;text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-item a:hover{text-decoration:underline}
/* attachments */
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.att{
  border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--panel2);
  position:relative;cursor:pointer;transition:transform .18s var(--ease),box-shadow .18s;
}
.att:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.att img{width:100%;height:74px;object-fit:cover;display:block}
.att .att-file{height:74px;display:grid;place-items:center;color:var(--faint);font-size:22px}
.att .att-name{font-size:10.5px;padding:5px 7px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.att .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:2px 7px;font-size:11px;opacity:0;transition:opacity .15s}
.att:hover .x{opacity:1}
.dropzone-hint{font-size:12px;color:var(--faint);margin-top:8px}
.modal.paste-target{outline:2px dashed var(--accent);outline-offset:-6px}
/* comments */
.comment{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.comment:last-of-type{border-bottom:none}
.comment .c-body{flex:1}
.comment .c-head{display:flex;align-items:baseline;gap:8px}
.comment .c-time{font-size:11px;color:var(--faint)}
.comment .c-text{font-size:13px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.comment .x{color:var(--faint);opacity:0;align-self:flex-start;padding:2px 6px;border-radius:5px}
.comment:hover .x{opacity:1}
/* activity */
.activity{font-size:12px;color:var(--muted);max-height:160px;overflow-y:auto}
.act-item{display:flex;gap:8px;padding:4px 0}
.act-item .a-time{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:none;width:118px}
/* modal footer */
.modal-foot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);align-items:center;flex-wrap:wrap}
/* image lightbox */
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(8,9,14,.88);display:grid;place-items:center;animation:fadeIn .2s;cursor:zoom-out}
.lightbox img{max-width:92vw;max-height:90vh;border-radius:12px;box-shadow:var(--shadow-lg);animation:modalIn .25s var(--ease)}

/* ============ TOASTS ============ */
.toasts{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{
  display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r-md);padding:11px 15px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:600;
  animation:toastIn .3s var(--ease);max-width:340px;
}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(24px)}}
.toast .t-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.toast.error .t-dot{background:var(--danger)}
.toast .t-undo{margin-left:auto;color:var(--accent-text);font-weight:700;font-size:12px}

/* empty state */
.empty{display:grid;place-items:center;height:100%;text-align:center;color:var(--muted)}
.empty .e-icon{font-size:42px;margin-bottom:10px;opacity:.5}
.empty h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.empty p{font-size:13px;max-width:300px;margin:0 auto 14px}
.col-empty{font-size:12px;color:var(--faint);text-align:center;padding:14px 6px;border:1px dashed var(--border);border-radius:var(--r-sm);margin:2px}

/* theme menu */
.menu{
  position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--shadow-lg);padding:6px;z-index:150;min-width:170px;animation:menuIn .18s var(--ease);
}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;text-align:left}
.menu-item:hover{background:var(--panel2)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger:hover{background:var(--danger-soft)}
.theme-sw{width:16px;height:16px;border-radius:50%;border:2px solid var(--border2);flex:none}
.menu-item .check{margin-left:auto;color:var(--accent-text)}
.menu-sep{height:1px;background:var(--border);margin:5px 4px}

/* premium polish */
::selection{background:var(--accent-soft);color:var(--accent-text)}
html{scrollbar-color:var(--border2) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--faint);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{transition:background .3s var(--ease),color .3s var(--ease)}
kbd{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--muted);background:var(--panel2);border:1px solid var(--border2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap}
/* command palette */
.pal-top{align-items:flex-start !important;padding-top:13vh}
.palette{width:min(620px,92vw);background:var(--panel);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;animation:modalIn .16s var(--ease)}
.pal-input{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.pal-input .pal-glyph{color:var(--faint);font-size:14px}
.pal-input input{flex:1;border:none;outline:none;background:transparent;color:var(--text);font:inherit;font-size:14.5px}
.pal-input input::placeholder{color:var(--faint)}
.pal-list{max-height:46vh;overflow:auto;padding:6px}
.pal-row{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;cursor:pointer;font-size:13px}
.pal-row.sel{background:var(--accent-soft)}
.pal-row.sel .pal-label{color:var(--accent-text);font-weight:600}
.pal-ic{width:22px;text-align:center;color:var(--muted);flex:none;font-size:13px}
.pal-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-hint{font-size:10.5px;color:var(--faint);font-family:var(--mono);flex:none}
.pal-empty{padding:18px;text-align:center;color:var(--faint);font-size:13px}
.pal-sep{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px 11px 3px}
.pal-foot{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--faint)}
.pal-foot b{font-family:var(--mono);font-weight:600;color:var(--muted)}
/* shortcuts modal */
.sc-grid{display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:center}
.sc-grid .sc-l{font-size:13px}
.sc-keys{display:flex;gap:4px;justify-content:flex-end}
/* attachments extras */
.att-size{font-size:9.5px;color:var(--faint);font-family:var(--mono);padding:0 6px 4px}
.lb-bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);color:#fff;z-index:1}
.lb-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-actions{display:flex;gap:8px}
/* snapshots */
.snap-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.snap-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);padding:9px 12px}
.snap-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.snap-info b{font-size:13px}
.snap-meta{font-size:11px;color:var(--faint);font-family:var(--mono)}
.snap-actions{display:flex;gap:6px;flex:none}
/* saved indicator */
.saved-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--faint);transition:color .25s;white-space:nowrap}
.saved-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);opacity:.7;transition:background .25s}
.saved-pill.saving{color:var(--muted)} .saved-pill.saving::before{background:var(--warn)}
.saved-pill.flash{color:var(--ok)}
/* WIP limit */
.col-count.over{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--danger-soft)}
/* blocked badge */
.blocked-tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--danger);background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 30%,transparent);border-radius:6px;padding:1px 6px}
.recur-tag{font-size:10.5px;color:var(--accent-text);font-weight:700}
/* calendar */
.cal-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px;max-width:1140px;margin:0 auto}
.cal-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-title{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-right:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:2px 6px}
.cal-cell{min-height:96px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:border-color .15s,background .15s;overflow:hidden}
.cal-cell:hover{border-color:var(--accent)}
.cal-cell.other{opacity:.45}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cal-cell.drag-over{border-color:var(--accent);background:var(--accent-soft)}
.cal-date{font-size:11px;font-weight:700;color:var(--muted)}
.cal-cell.today .cal-date{color:var(--accent-text)}
.cal-chip{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:2px 6px;cursor:grab;white-space:nowrap;overflow:hidden}
.cal-chip span{overflow:hidden;text-overflow:ellipsis}
.cal-chip i{width:6px;height:6px;border-radius:50%;flex:none}
.cal-chip:hover{border-color:var(--accent)}
.cal-chip.is-done{opacity:.5;text-decoration:line-through}
/* timeline */
.tl-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;overflow-x:auto}
.tl-grid{display:grid;grid-template-columns:210px 1fr;row-gap:7px;min-width:820px;align-items:center}
.tl-label{font-size:12.5px;font-weight:600;padding-right:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.tl-label:hover{color:var(--accent-text)}
.tl-label .card-key{margin-right:6px}
.tl-head{display:grid;grid-template-columns:repeat(28,1fr);font-family:var(--mono);font-size:9.5px;color:var(--faint);text-align:center;padding-bottom:4px}
.tl-head b{color:var(--accent-text)}
.tl-track{position:relative;height:24px;border-radius:6px;background:var(--panel2);border:1px solid var(--border)}
.tl-bar{position:absolute;top:3px;height:16px;border-radius:5px;background:var(--accent);cursor:pointer;min-width:9px;transition:filter .15s;box-shadow:var(--shadow)}
.tl-bar:hover{filter:brightness(1.12)}
.tl-bar.urgent{background:var(--danger)} .tl-bar.high{background:var(--warn)} .tl-bar.low{background:var(--faint)}
.tl-bar.is-done{opacity:.4}
.tl-today{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--danger);opacity:.6;pointer-events:none}
.tl-note{font-size:12px;color:var(--faint);margin-top:10px}
/* welcome */
.welcome{max-width:430px;text-align:center;padding:8px 4px}
.welcome .w-logo{width:54px;height:54px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;font-size:25px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-text));box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 35%,transparent)}
.welcome h2{font-size:20px;letter-spacing:-.02em;margin-bottom:6px}
.welcome>p{color:var(--muted);font-size:13px;margin-bottom:14px}
.welcome ul{text-align:left;margin:0 auto 18px;max-width:330px;color:var(--muted);font-size:12.5px;list-style:none}
.welcome li{padding:3px 0}
.welcome li b{color:var(--text)}
/* dashboard sparkline */
.spark{display:flex;align-items:flex-end;gap:4px;height:72px;margin-top:8px}
.spark .sp{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85;transition:height .5s var(--ease)}
.spark .sp.zero{background:var(--border)}
.spark-labels{display:flex;gap:4px;margin-top:4px}
.spark-labels span{flex:1;text-align:center;font-size:8.5px;color:var(--faint);font-family:var(--mono)}
.menu-note{font-size:11px;color:var(--faint);padding:6px 10px;font-family:var(--mono)}
.blocked-list .link-item a{cursor:pointer}
@media(max-width:720px){
  .searchbox{order:5;max-width:none;flex-basis:100%}
  .beacon .b-label{display:none}
  .view{padding:12px}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo"><span class="logo-mark">T</span><span>TaskFlow</span></div>
    <div class="searchbox">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Search tasks, labels, people…" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <button class="beacon" id="beacon" title="Deadline status — click to view dashboard">
      <span class="beacon-dot"></span><span id="beaconText">All clear</span>
    </button>
    <div class="tb-actions">
      <span class="saved-pill" id="savedPill" title="Everything is saved automatically on this device">Saved</span>
      <button class="btn icon ghost" id="themeBtn" title="Change theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="btn icon ghost" id="dataBtn" title="Backup &amp; restore">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="btn primary" id="newTaskBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New task
      </button>
    </div>
  </header>
  <nav class="subbar">
    <div class="view-tabs" id="viewTabs">
      <button class="view-tab active" data-view="board">Board</button>
      <button class="view-tab" data-view="list">List</button>
      <button class="view-tab" data-view="calendar">Calendar</button>
      <button class="view-tab" data-view="timeline">Timeline</button>
      <button class="view-tab" data-view="dashboard">Dashboard</button>
    </div>
    <div class="filters">
      <select class="filter-sel" id="fPriority"><option value="">Priority: All</option><option value="urgent">Urgent</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
      <select class="filter-sel" id="fLabel"><option value="">Label: All</option></select>
      <select class="filter-sel" id="fDue"><option value="">Due: All</option><option value="overdue">Overdue</option><option value="today">Due today</option><option value="week">This week</option><option value="none">No due date</option></select>
      <button class="chip-clear" id="clearFilters">Clear filters</button>
    </div>
  </nav>
  <main class="main"><div class="view" id="viewRoot"></div></main>
</div>
<div class="toasts" id="toasts"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<input type="file" id="attachFile" accept="*/*" multiple hidden>
<script>
"use strict";
/* =====================================================
   TaskFlow — single-file task tracker
   Data layer is exposed as window.App for testability.
   ===================================================== */
(function(){
const PRIORITIES = ["urgent","high","medium","low"];
const PRI_LABEL = {urgent:"Urgent",high:"High",medium:"Medium",low:"Low"};
const LABEL_COLORS = ["#4f5de4","#0e7e88","#c0392b","#b8860b","#2f9e63","#8e44ad","#d35400","#5d6d7e"];
const THEMES = [
  {id:"daylight", name:"Daylight",  sw:"#f4f5f7"},
  {id:"sakura",   name:"Sakura",    sw:"#d4527e"},
  {id:"forest",   name:"Forest",    sw:"#3d8b4f"},
  {id:"nordic",   name:"Nordic",    sw:"#0e7e88"},
  {id:"graphite", name:"Graphite",  sw:"#16191f"},
  {id:"midnight", name:"Midnight",  sw:"#06070b"},
  {id:"ocean",    name:"Ocean",     sw:"#4d9fff"},
  {id:"espresso", name:"Espresso",  sw:"#e09a52"}
];
const STORAGE_KEY = "taskflow.v1";
const APP_VERSION = "3.1";

/* ---------- utilities ---------- */
let _uid = 0;
const uid = () => "id" + Date.now().toString(36) + (_uid++).toString(36) + Math.random().toString(36).slice(2,6);
const $  = (s,el)=> (el||document).querySelector(s);
const $$ = (s,el)=> Array.from((el||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function fmtDate(iso){ if(!iso) return ""; const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + (d.getFullYear()!==new Date().getFullYear()?", "+d.getFullYear():""); }
function relTime(ts){
  const s = Math.max(0, (Date.now()-ts)/1000);
  if(s<45) return "just now";
  if(s<3600) return Math.round(s/60)+"m ago";
  if(s<86400) return Math.round(s/3600)+"h ago";
  if(s<7*86400) return Math.round(s/86400)+"d ago";
  return fmtTs(ts);
}
function fmtSize(n){ n=+n||0; return n>1048576? (n/1048576).toFixed(1)+" MB" : n>1024? Math.round(n/1024)+" KB" : n+" B"; }
function fmtTs(ts){ const d=new Date(ts); return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})+" "+d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}); }
function relDays(iso){
  if(!iso) return null;
  const ms = new Date(iso+"T00:00:00") - new Date(todayStr()+"T00:00:00");
  return Math.round(ms/86400000);
}
function initials(name){ return (name||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "?"; }
function hueFor(str){ let h=0; for(const c of String(str)) h=(h*31+c.charCodeAt(0))%360; return h; }
function labelColor(name){ return LABEL_COLORS[Math.abs([...String(name)].reduce((a,c)=>a*31+c.charCodeAt(0),7)) % LABEL_COLORS.length]; }

/* very small markdown: **bold** *italic* `code` + autolink + line breaks */
function mdRender(text){
  let h = esc(text||"");
  h = h.replace(/`([^`]+)`/g,"<code>$1</code>")
       .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
       .replace(/\*([^*]+)\*/g,"<em>$1</em>")
       .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')
       .replace(/\n/g,"<br>");
  return h;
}

/* ---------- state ---------- */
function defaultState(){
  const cols = [
    {id:uid(), name:"Backlog",     taskIds:[]},
    {id:uid(), name:"To Do",       taskIds:[]},
    {id:uid(), name:"In Progress", taskIds:[]},
    {id:uid(), name:"In Review",   taskIds:[]},
    {id:uid(), name:"Done",        taskIds:[]}
  ];
  return {version:2, counter:0, theme:"daylight", view:"board", columns:cols, tasks:{}, onboarded:false, savedAt:0,
    templates:[
      {name:"Bug report",        priority:"high",   labels:["Bug"],       recur:"none",    subtasks:["Reproduce the issue","Identify root cause","Fix and verify"]},
      {name:"Meeting follow-up", priority:"medium", labels:["Meeting"],   recur:"none",    subtasks:["Write minutes","Send action items","Schedule next check-in"]},
      {name:"Month-end close",   priority:"high",   labels:["Month-end"], recur:"monthly", subtasks:["Prepare data","Review figures","Submit"]}
    ]};
}
let state = defaultState();
let storageOk = true;

/* upgrade any older/foreign state object to the v2 shape */
function normalizeState(s){
  if(!s || !Array.isArray(s.columns) || typeof s.tasks!=="object") throw new Error("Invalid state");
  const d = defaultState();
  s.version = 2;
  if(typeof s.counter!=="number") s.counter = Object.keys(s.tasks).length;
  s.theme = THEMES.some(t=>t.id===s.theme) ? s.theme : "daylight";
  if(!s.view) s.view = "board";
  if(!Array.isArray(s.templates)) s.templates = d.templates;
  if(typeof s.onboarded!=="boolean") s.onboarded = Object.keys(s.tasks).length>0;
  if(typeof s.savedAt!=="number") s.savedAt = 0;
  for(const c of s.columns){
    if(!Array.isArray(c.taskIds)) c.taskIds = [];
    c.taskIds = c.taskIds.filter(id=>s.tasks[id]);
    if(c.wip!=null && (typeof c.wip!=="number" || c.wip<1)) c.wip = null;
  }
  const placed = new Set(); s.columns.forEach(c=>c.taskIds.forEach(id=>placed.add(id)));
  for(const id of Object.keys(s.tasks)){
    const t = s.tasks[id];
    if(!placed.has(id)) s.columns[0].taskIds.push(id);
    if(!Array.isArray(t.labels)) t.labels=[];
    if(!Array.isArray(t.subtasks)) t.subtasks=[];
    if(!Array.isArray(t.comments)) t.comments=[];
    if(!Array.isArray(t.links)) t.links=[];
    if(!Array.isArray(t.attachments)) t.attachments=[];
    if(!Array.isArray(t.activity)) t.activity=[];
    if(!Array.isArray(t.blockedBy)) t.blockedBy=[];
    t.blockedBy = t.blockedBy.filter(b=>s.tasks[b]);
    if(typeof t.start!=="string") t.start="";
    if(!t.recur) t.recur="none";
    if(t.completedAt===undefined) t.completedAt=null;
    if(!t.priority || !PRIORITIES.includes(t.priority)) t.priority="medium";
  }
  return s;
}

/* ---- IndexedDB (primary store, no size pain) with localStorage fallback ---- */
let idb = null;
function idbOpen(){
  return new Promise(res=>{
    try{
      if(typeof indexedDB==="undefined" || !indexedDB) return res(null);
      const rq = indexedDB.open("taskflow", 2);
      rq.onupgradeneeded = ()=>{ try{
        const db=rq.result;
        if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
        if(!db.objectStoreNames.contains("backups")) db.createObjectStore("backups");
      }catch(e){} };
      rq.onsuccess = ()=>res(rq.result);
      rq.onerror = ()=>res(null);
      rq.onblocked = ()=>res(null);
    }catch(e){ res(null); }
  });
}
function idbSet(db, val){
  return new Promise(res=>{
    try{
      const tx = db.transaction("kv","readwrite");
      tx.objectStore("kv").put(val,"state");
      tx.oncomplete = ()=>res(true); tx.onerror = ()=>res(false); tx.onabort = ()=>res(false);
    }catch(e){ res(false); }
  });
}
function idbGet(db){
  return new Promise(res=>{
    try{
      const tx = db.transaction("kv","readonly");
      const rq = tx.objectStore("kv").get("state");
      rq.onsuccess = ()=>res(rq.result||null); rq.onerror = ()=>res(null);
    }catch(e){ res(null); }
  });
}

/* ---- rolling snapshots: restore points kept on this device ---- */
const SNAP_LIMIT = 10, SNAP_LS_KEY = "taskflow.snapshots", SNAP_LS_LIMIT = 5;
function snapshotNow(reason){
  const json = JSON.stringify(state);
  const entry = {ts:Date.now(), reason:reason||"manual", tasks:Object.keys(state.tasks).length, size:json.length, json};
  if(idb){
    return new Promise(res=>{
      try{
        const tx = idb.transaction("backups","readwrite"), st = tx.objectStore("backups");
        st.put(entry, entry.ts);
        const rq = st.getAllKeys();
        rq.onsuccess = ()=>{ const keys=(rq.result||[]).slice().sort((a,b)=>a-b); while(keys.length>SNAP_LIMIT) st.delete(keys.shift()); };
        tx.oncomplete = ()=>res(entry); tx.onerror = ()=>res(null); tx.onabort = ()=>res(null);
      }catch(e){ res(null); }
    });
  }
  try{
    if(json.length > 800*1024) return Promise.resolve(null);   // protect localStorage quota
    let arr = JSON.parse(localStorage.getItem(SNAP_LS_KEY)||"[]");
    arr.push(entry); while(arr.length>SNAP_LS_LIMIT) arr.shift();
    try{ localStorage.setItem(SNAP_LS_KEY, JSON.stringify(arr)); }
    catch(e){ try{ localStorage.setItem(SNAP_LS_KEY, JSON.stringify([entry])); }catch(e2){ return Promise.resolve(null); } }
    return Promise.resolve(entry);
  }catch(e){ return Promise.resolve(null); }
}
function listSnapshots(){
  if(idb){
    return new Promise(res=>{
      try{
        const st = idb.transaction("backups","readonly").objectStore("backups");
        const rq = st.getAll();
        rq.onsuccess = ()=>res((rq.result||[]).sort((a,b)=>b.ts-a.ts));
        rq.onerror = ()=>res([]);
      }catch(e){ res([]); }
    });
  }
  try{ return Promise.resolve(JSON.parse(localStorage.getItem(SNAP_LS_KEY)||"[]").sort((a,b)=>b.ts-a.ts)); }
  catch(e){ return Promise.resolve([]); }
}
function deleteSnapshot(ts){
  if(idb){
    return new Promise(res=>{
      try{ const tx=idb.transaction("backups","readwrite"); tx.objectStore("backups").delete(ts); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }
      catch(e){ res(false); }
    });
  }
  try{
    const arr = JSON.parse(localStorage.getItem(SNAP_LS_KEY)||"[]").filter(s=>s.ts!==ts);
    localStorage.setItem(SNAP_LS_KEY, JSON.stringify(arr));
    return Promise.resolve(true);
  }catch(e){ return Promise.resolve(false); }
}
function restoreSnapshot(ts){
  return listSnapshots().then(list=>{
    const s = list.find(x=>x.ts===ts);
    if(!s) throw new Error("Snapshot not found");
    snapshotNow("before-restore");
    pushHistory();
    state = normalizeState(JSON.parse(s.json));
    document.documentElement.setAttribute("data-theme", state.theme);
    save(); render();
    return true;
  });
}

let saveFlashTimer = null;
function markSaved(){
  const pill = $("#savedPill"); if(!pill) return;
  pill.classList.add("saving"); pill.textContent = "Saving…";
  clearTimeout(saveFlashTimer);
  saveFlashTimer = setTimeout(()=>{
    pill.classList.remove("saving"); pill.classList.add("flash");
    const d = new Date();
    pill.textContent = "Saved ✓ " + d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
    setTimeout(()=>pill.classList.remove("flash"), 1400);
  }, 320);
}
function save(){
  state.savedAt = Date.now();
  const json = JSON.stringify(state);
  if(storageOk){
    try { localStorage.setItem(STORAGE_KEY, json); }
    catch(e){
      storageOk = false;
      if(!idb) toast("Browser storage is full — your data now lives in IndexedDB. Export a backup to be safe.","error");
    }
  }
  if(idb) idbSet(idb, json);
  markSaved();
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(parsed && parsed.columns && parsed.tasks){ state = normalizeState(parsed); } }
  }catch(e){ storageOk=false; }
}

/* ---- global undo / redo (Ctrl+Z / Ctrl+Shift+Z) ---- */
const hist = {undo:[], redo:[]};
function pushHistory(){
  hist.undo.push(JSON.stringify(state));
  if(hist.undo.length>25) hist.undo.shift();
  hist.redo.length = 0;
}
function undoAction(){
  if(!hist.undo.length){ toast("Nothing to undo"); return false; }
  hist.redo.push(JSON.stringify(state));
  state = normalizeState(JSON.parse(hist.undo.pop()));
  $$(".overlay").forEach(o=>o.remove()); openTaskId=null;
  document.documentElement.setAttribute("data-theme", state.theme);
  save(); render(); toast("Undone"); return true;
}
function redoAction(){
  if(!hist.redo.length){ toast("Nothing to redo"); return false; }
  hist.undo.push(JSON.stringify(state));
  state = normalizeState(JSON.parse(hist.redo.pop()));
  $$(".overlay").forEach(o=>o.remove()); openTaskId=null;
  document.documentElement.setAttribute("data-theme", state.theme);
  save(); render(); toast("Redone"); return true;
}

/* ---------- core operations ---------- */
function newTaskObj(data){
  state.counter++;
  const now = Date.now();
  return Object.assign({
    id: uid(), key: "TF-"+state.counter,
    title:"", desc:"", priority:"medium", labels:[], assignee:"", due:"", points:"",
    start:"", recur:"none", blockedBy:[], completedAt:null,
    subtasks:[], comments:[], links:[], attachments:[],
    createdAt: now, updatedAt: now, activity:[{ts:now,text:"created this task"}]
  }, data||{});
}
function createTask(data, columnId, opts){
  if(!(opts&&opts.silent)) pushHistory();
  const t = newTaskObj(data);
  state.tasks[t.id]=t;
  const col = state.columns.find(c=>c.id===columnId) || state.columns[0];
  col.taskIds.unshift(t.id);
  save();
  return t;
}
function columnOf(taskId){ return state.columns.find(c=>c.taskIds.includes(taskId)); }
function logAct(t, text){ t.activity.push({ts:Date.now(),text}); t.updatedAt=Date.now(); if(t.activity.length>60) t.activity = t.activity.slice(-60); }
function updateTask(id, patch){
  const t = state.tasks[id]; if(!t) return null;
  const fields = [];
  for(const k of Object.keys(patch)){
    if(JSON.stringify(t[k])!==JSON.stringify(patch[k])){ t[k]=patch[k]; fields.push(k); }
  }
  if(fields.length){ logAct(t, "updated "+fields.join(", ")); save(); }
  return t;
}
function deleteTask(id, opts){
  const t = state.tasks[id]; if(!t) return null;
  if(!(opts&&opts.silent)) pushHistory();
  const col = columnOf(id); if(col) col.taskIds = col.taskIds.filter(x=>x!==id);
  delete state.tasks[id]; save();
  return t;
}
function restoreTask(task, colId, index){
  state.tasks[task.id]=task;
  const col = state.columns.find(c=>c.id===colId) || state.columns[0];
  col.taskIds.splice(Math.min(index, col.taskIds.length),0,task.id);
  save();
}
function moveTask(id, toColId, index){
  const from = columnOf(id); const to = state.columns.find(c=>c.id===toColId);
  if(!from||!to||!state.tasks[id]) return false;
  pushHistory();
  const oldIdx = from.taskIds.indexOf(id);
  from.taskIds.splice(oldIdx,1);
  let i = (index==null||index<0) ? to.taskIds.length : Math.min(index, to.taskIds.length);
  to.taskIds.splice(i,0,id);
  const tk = state.tasks[id];
  if(from.id!==to.id) logAct(tk, 'moved from "'+from.name+'" to "'+to.name+'"');
  const dn = doneColumn();
  const nowDone = to===dn, wasDone = from===dn;
  if(nowDone && !wasDone){
    tk.completedAt = Date.now();
    const openBlockers = (tk.blockedBy||[]).filter(b=>state.tasks[b] && !isDone(b));
    if(openBlockers.length) toast(tk.key+" is still blocked by "+openBlockers.map(b=>state.tasks[b].key).join(", "),"error");
    if(tk.recur && tk.recur!=="none" && tk.due){
      const next = createTask({
        title:tk.title, desc:tk.desc, priority:tk.priority, labels:[...tk.labels],
        assignee:tk.assignee, points:tk.points, recur:tk.recur,
        due: nextDue(tk.due, tk.recur), start: tk.start? nextDue(tk.start, tk.recur):"",
        subtasks: tk.subtasks.map(s=>({id:uid(), text:s.text, done:false})),
        links: tk.links.map(l=>({id:uid(), label:l.label, url:l.url}))
      }, from.id, {silent:true});
      toast("Recurring: "+next.key+" scheduled for "+fmtDate(next.due));
    }
  }
  if(!nowDone && wasDone) tk.completedAt = null;
  save();
  return true;
}
function nextDue(iso, recur){
  const d = new Date(iso+"T00:00:00");
  if(recur==="daily") d.setDate(d.getDate()+1);
  else if(recur==="weekly") d.setDate(d.getDate()+7);
  else if(recur==="monthly"){
    const day=d.getDate();
    d.setDate(1); d.setMonth(d.getMonth()+1);
    const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day,last));                 // Jan 31 → Feb 28, not Mar 3
  }
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function addSubtask(taskId, text){
  const t=state.tasks[taskId]; if(!t||!text.trim()) return null;
  const s={id:uid(),text:text.trim(),done:false}; t.subtasks.push(s);
  logAct(t,'added subtask "'+s.text+'"'); save(); return s;
}
function toggleSubtask(taskId, subId){
  const t=state.tasks[taskId]; if(!t) return;
  const s=t.subtasks.find(x=>x.id===subId); if(!s) return;
  s.done=!s.done; logAct(t,(s.done?"completed":"reopened")+' subtask "'+s.text+'"'); save();
}
function removeSubtask(taskId, subId){
  const t=state.tasks[taskId]; if(!t) return;
  t.subtasks=t.subtasks.filter(x=>x.id!==subId); logAct(t,"removed a subtask"); save();
}
function addComment(taskId, text){
  const t=state.tasks[taskId]; if(!t||!text.trim()) return null;
  const c={id:uid(),text:text.trim(),ts:Date.now()}; t.comments.push(c);
  logAct(t,"commented"); save(); return c;
}
function removeComment(taskId, cid){
  const t=state.tasks[taskId]; if(!t) return; t.comments=t.comments.filter(c=>c.id!==cid); save();
}
function safeUrl(url){
  url = String(url||"").trim();
  if(!url) return null;
  const m = url.match(/^([a-zA-Z][a-zA-Z0-9+.-]*):/);
  if(m && !/^https?$/i.test(m[1])) return null;            // block javascript:, data:, vbscript: …
  if(!/^https?:\/\//i.test(url)) url = "https://"+url;
  return url;
}
function addLink(taskId, label, url){
  const t=state.tasks[taskId]; if(!t) return null;
  url = safeUrl(url); if(!url) return null;
  const l={id:uid(),label:(label||url).trim(),url:url.trim()};
  t.links.push(l); logAct(t,'added link "'+l.label+'"'); save(); return l;
}
function removeLink(taskId, lid){ const t=state.tasks[taskId]; if(!t)return; t.links=t.links.filter(l=>l.id!==lid); save(); }
function addAttachment(taskId, name, type, dataUrl, size){
  const t=state.tasks[taskId]; if(!t) return null;
  const a={id:uid(),name:name||"file",type:type||"",dataUrl,size:size||0};
  t.attachments.push(a); logAct(t,'attached "'+a.name+'"'); save(); return a;
}
function removeAttachment(taskId, aid){ const t=state.tasks[taskId]; if(!t)return; t.attachments=t.attachments.filter(a=>a.id!==aid); logAct(t,"removed an attachment"); save(); }

function addColumn(name){
  pushHistory();
  const c={id:uid(),name:(name||"New column").trim(),taskIds:[],wip:null};
  state.columns.push(c); save(); return c;
}
function renameColumn(id,name){ const c=state.columns.find(x=>x.id===id); if(c&&name.trim()){pushHistory();c.name=name.trim();save();} }
function setWip(id,n){ const c=state.columns.find(x=>x.id===id); if(!c) return; c.wip = (n&&n>0)? Math.floor(n) : null; save(); }
function deleteColumn(id){
  const idx=state.columns.findIndex(c=>c.id===id);
  if(idx<0||state.columns.length<=1) return false;
  pushHistory();
  const col=state.columns[idx];
  const target=state.columns[idx===0?1:0];
  target.taskIds.push(...col.taskIds);
  state.columns.splice(idx,1); save(); return true;
}
function doneColumn(){ return state.columns.find(c=>/^done$|^complete/i.test(c.name)) || state.columns[state.columns.length-1]; }
function isDone(taskId){ const c=columnOf(taskId); return !!c && c===doneColumn(); }

function dueStatus(t){
  if(!t.due) return null;
  if(isDone(t.id)) return "done";
  const d = relDays(t.due);
  if(d<0) return "overdue";
  if(d===0) return "today";
  if(d<=3) return "soon";
  return "later";
}
function getStats(){
  const all = Object.values(state.tasks);
  const done = all.filter(t=>isDone(t.id));
  const overdue = all.filter(t=>dueStatus(t)==="overdue");
  const dueToday = all.filter(t=>dueStatus(t)==="today");
  const weekAgo = Date.now()-7*86400000;
  return {
    total: all.length, done: done.length,
    open: all.length-done.length,
    overdue: overdue.length, dueToday: dueToday.length,
    doneThisWeek: done.filter(t=>t.updatedAt>=weekAgo).length,
    completion: all.length? Math.round(done.length/all.length*100):0
  };
}

/* ---------- backup ---------- */
function exportJSON(){
  return JSON.stringify({app:"TaskFlow",exportedAt:new Date().toISOString(),data:state},null,2);
}
function importJSON(str){
  const parsed = JSON.parse(str);
  const data = parsed && parsed.data && parsed.data.columns ? parsed.data : parsed;
  if(!data || !Array.isArray(data.columns) || typeof data.tasks!=="object")
    throw new Error("Not a valid TaskFlow backup file");
  if(Object.keys(state.tasks).length) snapshotNow("before-import");
  pushHistory();
  state = normalizeState(data);
  save();
  return true;
}

function setTheme(id){
  if(!THEMES.some(t=>t.id===id)) return;
  state.theme=id;
  document.documentElement.setAttribute("data-theme",id);
  save();
}

/* ---- natural-language quick input: "#label @person !high tomorrow" ---- */
function isoLocal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseQuick(text){
  let s = " " + String(text||"") + " ";
  const out = {labels:[], assignee:"", priority:"", due:""};
  s = s.replace(/\s#([\w-]+)/g, (m,l)=>{ out.labels.push(l); return " "; });
  s = s.replace(/\s@([\w.\-çğıöşüÇĞİÖŞÜ]+)/g, (m,a)=>{ out.assignee=a; return " "; });
  s = s.replace(/\s!(urgent|high|medium|low|p1|p2|p3|p4)\b/gi, (m,p)=>{
    out.priority = ({p1:"urgent",p2:"high",p3:"medium",p4:"low"})[p.toLowerCase()] || p.toLowerCase(); return " ";
  });
  const today = new Date(); today.setHours(0,0,0,0);
  s = s.replace(/\s(\d{4}-\d{2}-\d{2})\b/, (m,d)=>{ out.due=d; return " "; });
  if(!out.due) s = s.replace(/\s(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?(?=\s)/, (m,dd,mm,yy)=>{
    let y = yy? (yy.length===2? 2000+ +yy : +yy) : today.getFullYear();
    const d = new Date(y, +mm-1, +dd);
    if(!yy && d<today) d.setFullYear(y+1);
    out.due = isoLocal(d); return " ";
  });
  if(!out.due) s = s.replace(/\stoday\b/i, ()=>{ out.due=isoLocal(today); return " "; });
  if(!out.due) s = s.replace(/\stomorrow\b/i, ()=>{ const d=new Date(today); d.setDate(d.getDate()+1); out.due=isoLocal(d); return " "; });
  if(!out.due) s = s.replace(/\sin (\d+)\s*d(?:ays?)?\b/i, (m,n)=>{ const d=new Date(today); d.setDate(d.getDate()+ +n); out.due=isoLocal(d); return " "; });
  if(!out.due) s = s.replace(/\s(?:next |on )?(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i, (m,w)=>{
    const idx = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"].indexOf(w.toLowerCase());
    const d = new Date(today); let add = (idx - d.getDay() + 7) % 7; if(add===0) add=7;
    d.setDate(d.getDate()+add); out.due=isoLocal(d); return " ";
  });
  out.title = s.replace(/\s+/g," ").trim();
  return out;
}

   RENDERING
   ===================================================== */
const root = $("#viewRoot");
const filters = {q:"", priority:"", label:"", due:""};
let openTaskId = null;

function allLabels(){
  const s=new Set(); Object.values(state.tasks).forEach(t=>t.labels.forEach(l=>s.add(l)));
  return Array.from(s).sort();
}
function taskMatches(t){
  if(filters.q){
    const q=filters.q.toLowerCase();
    const hay=(t.title+" "+t.key+" "+t.desc+" "+t.labels.join(" ")+" "+t.assignee).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  if(filters.priority && t.priority!==filters.priority) return false;
  if(filters.label && !t.labels.includes(filters.label)) return false;
  if(filters.due){
    const s=dueStatus(t); const d=relDays(t.due);
    if(filters.due==="overdue" && s!=="overdue") return false;
    if(filters.due==="today" && s!=="today") return false;
    if(filters.due==="week" && !(t.due && d>=0 && d<=7)) return false;
    if(filters.due==="none" && t.due) return false;
  }
  return true;
}
const priIcon = p => ({
  urgent:'<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 22 20H2z"/></svg>',
  high:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="m5 15 7-7 7 7"/></svg>',
  medium:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M5 9h14M5 15h14"/></svg>',
  low:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="m5 9 7 7 7-7"/></svg>'
}[p]||"");

function isBlocked(t){ return (t.blockedBy||[]).some(b=>state.tasks[b] && !isDone(b)); }
function blockedTag(t){ return isBlocked(t)? '<span class="blocked-tag" title="Blocked by: '+t.blockedBy.filter(b=>state.tasks[b]&&!isDone(b)).map(b=>esc(state.tasks[b].key)).join(", ")+'">⛔ Blocked</span>' : ""; }
function dueTagHtml(t){
  const s=dueStatus(t); if(!t.due) return "";
  const d=relDays(t.due);
  let txt=fmtDate(t.due);
  if(s==="overdue") txt = Math.abs(d)+"d overdue";
  else if(s==="today") txt="Due today";
  else if(s==="soon") txt="Due in "+d+"d";
  const cls = (s==="overdue"||s==="today"||s==="soon")?s:"";
  return '<span class="due-tag '+cls+'"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'+esc(txt)+'</span>';
}
function cardHtml(t, idx){
  const subsDone=t.subtasks.filter(s=>s.done).length;
  const pct=t.subtasks.length? Math.round(subsDone/t.subtasks.length*100):0;
  const done=isDone(t.id);
  return '<article class="card'+(done?" done-card":"")+'" draggable="true" data-id="'+t.id+'" style="animation-delay:'+Math.min(idx*30,240)+'ms" tabindex="0">'
    +(t.labels.length?'<div class="card-labels">'+t.labels.map(l=>'<span class="lbl" style="background:'+labelColor(l)+'22;color:'+labelColor(l)+'">'+esc(l)+'</span>').join("")+'</div>':"")
    +'<div class="card-title">'+esc(t.title)+'</div>'
    +'<div class="card-meta">'
      +'<span class="card-key">'+esc(t.key)+'</span>'
      +'<span class="pri '+t.priority+'" title="'+PRI_LABEL[t.priority]+' priority">'+priIcon(t.priority)+'</span>'
      +dueTagHtml(t)
      +blockedTag(t)
      +(t.recur && t.recur!=="none" ? '<span class="recur-tag" title="Repeats '+t.recur+'">↻</span>' : "")
      +'<span class="card-icons">'
        +(t.subtasks.length?'<span title="Subtasks">☑ '+subsDone+'/'+t.subtasks.length+'</span>':"")
        +(t.comments.length?'<span title="Comments">💬 '+t.comments.length+'</span>':"")
        +(t.attachments.length?'<span title="Attachments">📎 '+t.attachments.length+'</span>':"")
        +(t.links.length?'<span title="Links">🔗 '+t.links.length+'</span>':"")
      +'</span>'
      +(t.assignee?'<span class="avatar" title="'+esc(t.assignee)+'" style="background:hsl('+hueFor(t.assignee)+' 55% 45%)">'+esc(initials(t.assignee))+'</span>':"")
    +'</div>'
    +(t.subtasks.length?'<div class="sub-progress"><i style="width:'+pct+'%"></i></div>':"")
  +'</article>';
}

function renderBoard(){
  const anyTask = Object.keys(state.tasks).length>0;
  let html='<div class="board">';
  for(const col of state.columns){
    const tasks = col.taskIds.map(id=>state.tasks[id]).filter(Boolean).filter(taskMatches);
    html+='<section class="col" data-col="'+col.id+'">'
      +'<div class="col-head"><span class="col-name">'+esc(col.name)+'</span><span class="col-count'+(col.wip&&col.taskIds.length>col.wip?" over":"")+'" title="'+(col.wip?'WIP limit '+col.wip:'Task count')+'">'+tasks.length+(col.wip?'/'+col.wip:"")+'</span>'
      +'<button class="col-menu-btn" data-colmenu="'+col.id+'" title="Column options">⋯</button></div>'
      +'<div class="col-body" data-col="'+col.id+'">'
      +(tasks.length? tasks.map((t,i)=>cardHtml(t,i)).join("") : '<div class="col-empty">'+(anyTask?"No matching tasks":"Drop tasks here")+'</div>')

      +'<button class="col-add" data-addto="'+col.id+'">+ Add task</button>'
