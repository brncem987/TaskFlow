    html='<div class="empty"><div class="e-icon">◴</div><h3>Your board is empty</h3><p>Create your first task to get started. Everything is saved locally in this browser.</p><button class="btn primary" id="emptyNew">+ Create a task</button></div>';
  }
  root.innerHTML=html;
  bindBoard();
}

function renderList(){
  const tasks=Object.values(state.tasks).filter(taskMatches);
  const sortKey = state.listSort||"updated";
  const dir = state.listDir||-1;
  const colName=id=>{const c=columnOf(id);return c?c.name:"";};
  tasks.sort((a,b)=>{
    let va,vb;
    switch(sortKey){
      case "title": va=a.title.toLowerCase(); vb=b.title.toLowerCase(); break;
      case "priority": va=PRIORITIES.indexOf(a.priority); vb=PRIORITIES.indexOf(b.priority); break;
      case "due": va=a.due||"9999"; vb=b.due||"9999"; break;
      case "status": va=colName(a.id); vb=colName(b.id); break;
      default: va=a.updatedAt; vb=b.updatedAt;
    }
    return (va<vb?-1:va>vb?1:0)*dir;
  });
  if(!tasks.length){ root.innerHTML='<div class="empty"><div class="e-icon">≡</div><h3>No tasks to show</h3><p>Try clearing the filters, or create a new task.</p></div>'; return; }
  const arrow=k=> sortKey===k ? (dir===1?" ↑":" ↓") : "";
  let html='<div class="list-wrap"><table class="list"><thead><tr>'
    +'<th data-sort="title">Task'+arrow("title")+'</th><th data-sort="status">Status'+arrow("status")+'</th>'
    +'<th data-sort="priority">Priority'+arrow("priority")+'</th><th data-sort="due">Due'+arrow("due")+'</th>'
    +'<th>Assignee</th><th data-sort="updated">Updated'+arrow("updated")+'</th></tr></thead><tbody>';
  for(const t of tasks){
    html+='<tr class="row" data-id="'+t.id+'">'
      +'<td><span class="card-key" style="margin-right:8px">'+esc(t.key)+'</span><strong>'+esc(t.title)+'</strong></td>'
      +'<td><span class="status-pill">'+esc(colName(t.id))+'</span></td>'
      +'<td><span class="pri '+t.priority+'">'+priIcon(t.priority)+' '+PRI_LABEL[t.priority]+'</span></td>'
      +'<td>'+(t.due?dueTagHtml(t):'<span style="color:var(--faint)">—</span>')+'</td>'
      +'<td>'+(t.assignee?'<span class="avatar" style="background:hsl('+hueFor(t.assignee)+' 55% 45%)">'+esc(initials(t.assignee))+'</span>':'<span style="color:var(--faint)">—</span>')+'</td>'
      +'<td style="color:var(--muted);font-size:12px">'+fmtTs(t.updatedAt)+'</td></tr>';
  }
  html+='</tbody></table></div>';
  root.innerHTML=html;
  $$("tr.row",root).forEach(r=>r.addEventListener("click",()=>openTask(r.dataset.id)));
  $$("th[data-sort]",root).forEach(th=>th.addEventListener("click",()=>{
    const k=th.dataset.sort;
    if(state.listSort===k) state.listDir=-(state.listDir||-1); else {state.listSort=k; state.listDir=1;}
    save(); renderList();
  }));
}

function renderDashboard(){
  const s=getStats();
  const upcoming=Object.values(state.tasks)
    .filter(t=>t.due && !isDone(t.id))
    .sort((a,b)=>a.due<b.due?-1:1).slice(0,8);
  let html='<div class="dash"><div class="dash-grid">'
    +'<div class="stat"><div class="s-label">Open tasks</div><div class="s-value">'+s.open+'</div><div class="s-sub">of '+s.total+' total</div></div>'
    +'<div class="stat s-danger"><div class="s-label">Overdue</div><div class="s-value">'+s.overdue+'</div><div class="s-sub">need attention</div></div>'
    +'<div class="stat s-warn"><div class="s-label">Due today</div><div class="s-value">'+s.dueToday+'</div><div class="s-sub">'+todayStr()+'</div></div>'
    +'<div class="stat s-ok"><div class="s-label">Done this week</div><div class="s-value">'+s.doneThisWeek+'</div><div class="s-sub">'+s.completion+'% completed overall</div></div>'
  +'</div><div class="dash-cols">';
  // per-column distribution
  const max=Math.max(1,...state.columns.map(c=>c.taskIds.length));
  html+='<div class="dash-panel"><h3>Tasks by status</h3>';
  for(const c of state.columns){
    html+='<div class="bar-row"><span class="br-name">'+esc(c.name)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(c.taskIds.length/max*100)+'%"></div></div><span class="br-n">'+c.taskIds.length+'</span></div>';
  }
  html+='</div><div class="dash-panel"><h3>Upcoming deadlines</h3>';
  if(!upcoming.length) html+='<p style="color:var(--faint);font-size:13px">Nothing scheduled. Enjoy the calm.</p>';
  for(const t of upcoming){
    html+='<div class="up-item" data-id="'+t.id+'"><span class="card-key">'+esc(t.key)+'</span><span class="up-title">'+esc(t.title)+'</span>'+dueTagHtml(t)+'</div>';
  }
  html+='</div></div>';
  // 14-day completion sparkline
  const days=[]; const counts=[];
  for(let i=13;i>=0;i--){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const lo=d.getTime(), hi=lo+86400000;
    counts.push(Object.values(state.tasks).filter(t=>t.completedAt && t.completedAt>=lo && t.completedAt<hi).length);
    days.push(d.toLocaleDateString("en-US",{day:"numeric"}));
  }
  const cmax=Math.max(1,...counts);
  html+='<div class="dash-panel"><h3>Completed per day — last 14 days</h3><div class="spark">'
    +counts.map(c=>'<div class="sp'+(c?'':' zero')+'" style="height:'+(c? Math.max(8, c/cmax*100):3)+'%" title="'+c+' completed"></div>').join("")
    +'</div><div class="spark-labels">'+days.map(d=>'<span>'+d+'</span>').join("")+'</div></div>';
  html+='</div>';
  root.innerHTML=html;
  $$(".up-item",root).forEach(el=>el.addEventListener("click",()=>openTask(el.dataset.id)));
}

function render(){
  updateBeacon(); updateLabelFilter(); updateClearBtn();
  $$(".view-tab").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));
  if(state.view==="list") renderList();
  else if(state.view==="dashboard") renderDashboard();
  else if(state.view==="calendar") renderCalendar();
  else if(state.view==="timeline") renderTimeline();
  else renderBoard();
}

function updateBeacon(){
  const s=getStats();
  const el=$("#beacon"); const txt=$("#beaconText");
  el.classList.remove("warn","danger");
  if(s.overdue>0){
    el.classList.add("danger");
    txt.innerHTML='<span class="b-danger">'+s.overdue+' overdue</span>'+(s.dueToday?'<span class="b-sep"> · </span><span class="b-warn">'+s.dueToday+' due today</span>':"");
  } else if(s.dueToday>0){
    el.classList.add("warn");
    txt.innerHTML='<span class="b-warn">'+s.dueToday+' due today</span>';
  } else {
    txt.innerHTML='<span class="b-ok">On track</span><span class="b-sep b-label"> · '+s.open+' open</span>';
  }
}
function updateLabelFilter(){
  const sel=$("#fLabel"); const cur=filters.label;
  sel.innerHTML='<option value="">Label: All</option>'+allLabels().map(l=>'<option value="'+esc(l)+'"'+(l===cur?" selected":"")+'>'+esc(l)+'</option>').join("");
}
function updateClearBtn(){
  $("#clearFilters").classList.toggle("show", !!(filters.q||filters.priority||filters.label||filters.due));
}

/* ---------- calendar view ---------- */
let calCursor = (function(){ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();
function renderCalendar(){
  const y=calCursor.getFullYear(), m=calCursor.getMonth();
  const monthName = calCursor.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const firstDow = (new Date(y,m,1).getDay()+6)%7;            // Monday = 0
  const gridStart = new Date(y,m,1-firstDow);
  const tIso = todayStr();
  const byDue = {};
  Object.values(state.tasks).filter(taskMatches).forEach(t=>{ if(t.due) (byDue[t.due]=byDue[t.due]||[]).push(t); });
  const priDot = {urgent:"var(--danger)",high:"var(--warn)",medium:"var(--accent)",low:"var(--faint)"};
  let html='<div class="cal-wrap"><div class="cal-top"><span class="cal-title">'+monthName+'</span>'
    +'<button class="btn icon" id="calPrev" title="Previous month">‹</button>'
    +'<button class="btn" id="calToday">Today</button>'
    +'<button class="btn icon" id="calNext" title="Next month">›</button></div>'
    +'<div class="cal-grid">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>'<div class="cal-dow">'+d+'</div>').join("");
  for(let i=0;i<42;i++){
    const d=new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const iso=isoLocal(d);
    const other=d.getMonth()!==m;
    const chips=(byDue[iso]||[]).map(t=>'<div class="cal-chip'+(isDone(t.id)?" is-done":"")+'" draggable="true" data-id="'+t.id+'" title="'+esc(t.key+" — "+t.title)+'"><i style="background:'+priDot[t.priority]+'"></i><span>'+esc(t.title)+'</span></div>').join("");
    html+='<div class="cal-cell'+(other?" other":"")+(iso===tIso?" today":"")+'" data-date="'+iso+'"><span class="cal-date">'+d.getDate()+'</span>'+chips+'</div>';
  }
  html+='</div></div>';
  root.innerHTML=html;
  $("#calPrev").addEventListener("click",()=>{calCursor.setMonth(calCursor.getMonth()-1);renderCalendar();});
  $("#calNext").addEventListener("click",()=>{calCursor.setMonth(calCursor.getMonth()+1);renderCalendar();});
  $("#calToday").addEventListener("click",()=>{calCursor=new Date();calCursor.setDate(1);renderCalendar();});
  $$(".cal-chip",root).forEach(ch=>{
    ch.addEventListener("click",e=>{e.stopPropagation();openTask(ch.dataset.id);});
    ch.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",ch.dataset.id);e.dataTransfer.effectAllowed="move";});
  });
  $$(".cal-cell",root).forEach(cell=>{
    cell.addEventListener("click",()=>quickAdd(null,{due:cell.dataset.date}));
    cell.addEventListener("dragover",e=>{e.preventDefault();cell.classList.add("drag-over");});
    cell.addEventListener("dragleave",()=>cell.classList.remove("drag-over"));
    cell.addEventListener("drop",e=>{
      e.preventDefault(); cell.classList.remove("drag-over");
      const id=e.dataTransfer.getData("text/plain");
      if(id && state.tasks[id]){ updateTask(id,{due:cell.dataset.date}); toast(state.tasks[id].key+" rescheduled to "+fmtDate(cell.dataset.date)); renderCalendar(); updateBeacon(); }
    });
  });
}

/* ---------- timeline (gantt) view ---------- */
function renderTimeline(){
  const DAYS=28;
  const start=new Date(); start.setHours(0,0,0,0);
  start.setDate(start.getDate()-((start.getDay()+6)%7));      // this week's Monday
  const startMs=start.getTime();
  const dayIdx = iso => Math.floor((new Date(iso+"T00:00:00")-startMs)/86400000);
  const tasks=Object.values(state.tasks).filter(taskMatches).filter(t=>t.due).sort((a,b)=>a.due<b.due?-1:1);
  const noDue=Object.values(state.tasks).filter(taskMatches).filter(t=>!t.due).length;
  let head='<div></div><div class="tl-head">';
  for(let i=0;i<DAYS;i++){ const d=new Date(startMs+i*86400000); const isT=isoLocal(d)===todayStr();
    head+=(isT?'<b>':'<span>')+d.getDate()+(isT?'</b>':'</span>'); }
  head+='</div>';
  let rows="";
  const todayIdx=dayIdx(todayStr());
  for(const t of tasks){
    let s=t.start? dayIdx(t.start): dayIdx(t.due);
    let e=dayIdx(t.due);
    if(e<s) e=s;
    if(e<0 || s>=DAYS){                                       // fully outside the window
      continue;
    }
    const cs=Math.max(0,s), ce=Math.min(DAYS-1,e);
    const left=(cs/DAYS*100).toFixed(2), width=(((ce-cs+1)/DAYS)*100).toFixed(2);
    rows+='<div class="tl-label" data-id="'+t.id+'"><span class="card-key">'+esc(t.key)+'</span>'+esc(t.title)+'</div>'
      +'<div class="tl-track">'
      +(todayIdx>=0&&todayIdx<DAYS?'<div class="tl-today" style="left:'+(((todayIdx+0.5)/DAYS)*100)+'%"></div>':"")
      +'<div class="tl-bar '+t.priority+(isDone(t.id)?" is-done":"")+'" data-id="'+t.id+'" style="left:'+left+'%;width:'+width+'%" title="'+esc(t.key+" — "+t.title+(t.start?" · "+fmtDate(t.start):"")+" → "+fmtDate(t.due))+'"></div></div>';
  }
  const shown=rows? rows : '<div></div><div class="tl-note" style="margin:0">No scheduled tasks fall inside the next 4 weeks.</div>';
  root.innerHTML='<div class="tl-wrap"><div class="tl-grid">'+head+shown+'</div>'
    +'<p class="tl-note">Showing a 4-week window from this Monday. Bars run from start date (or due date) to due date.'
    +(noDue?' '+noDue+' task'+(noDue!==1?'s have':' has')+' no due date and '+(noDue!==1?'are':'is')+' not shown.':'')+'</p></div>';
  $$(".tl-bar,.tl-label",root).forEach(el=>el.addEventListener("click",()=>openTask(el.dataset.id)));
}

/* ---------- drag & drop ---------- */
let dragId=null;
function bindBoard(){
  $$(".card",root).forEach(card=>{
    card.addEventListener("click",()=>openTask(card.dataset.id));
    card.addEventListener("keydown",e=>{if(e.key==="Enter")openTask(card.dataset.id);});
    card.addEventListener("dragstart",e=>{
      dragId=card.dataset.id; card.classList.add("dragging");
      e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",dragId);
    });
    card.addEventListener("dragend",()=>{dragId=null; card.classList.remove("dragging"); $$(".col").forEach(c=>c.classList.remove("drag-over")); $$(".drop-hint").forEach(h=>h.remove());});
  });
  $$(".col-body",root).forEach(body=>{
    body.addEventListener("dragover",e=>{
      e.preventDefault(); e.dataTransfer.dropEffect="move";
      body.closest(".col").classList.add("drag-over");
      const after=dropAfter(body,e.clientY);
      $$(".drop-hint",body).forEach(h=>h.remove());
      const hint=document.createElement("div"); hint.className="drop-hint";
      if(after==null) body.appendChild(hint); else body.insertBefore(hint,after);
    });
    body.addEventListener("dragleave",e=>{ if(!body.contains(e.relatedTarget)){ body.closest(".col").classList.remove("drag-over"); $$(".drop-hint",body).forEach(h=>h.remove()); }});
    body.addEventListener("drop",e=>{
      e.preventDefault();
      const id=dragId||e.dataTransfer.getData("text/plain"); if(!id) return;
      const after=dropAfter(body,e.clientY);
      const cards=$$(".card",body).filter(c=>c.dataset.id!==id);
      let index = after? cards.indexOf(after) : cards.length;
      moveTask(id, body.dataset.col, index);
      render();
    });
  });
  $$(".col-add",root).forEach(b=>b.addEventListener("click",()=>quickAdd(b.dataset.addto)));
  $$(".col-menu-btn",root).forEach(b=>b.addEventListener("click",e=>{e.stopPropagation(); colMenu(b, b.dataset.colmenu);}));
  const addCol=$("#addColBtn"); if(addCol) addCol.addEventListener("click",()=>{
    promptDialog("Add column","Column name","e.g. Blocked",name=>{ if(name.trim()){ addColumn(name); render(); toast("Column added"); } });
  });
  const en=$("#emptyNew"); if(en) en.addEventListener("click",()=>quickAdd());
}
function dropAfter(container,y){
  const cards=$$(".card:not(.dragging)",container);
  for(const c of cards){ const r=c.getBoundingClientRect(); if(y < r.top + r.height/2) return c; }
  return null;
}

/* =====================================================
   MODALS & MENUS
   ===================================================== */
function closeOverlay(ov){ ov.classList.add("closing"); setTimeout(()=>ov.remove(),170); }
function overlay(inner, opts){
  const ov=document.createElement("div"); ov.className="overlay"; ov.innerHTML=inner;
  ov.addEventListener("mousedown",e=>{ if(e.target===ov && !(opts&&opts.sticky)) closeOverlay(ov); });
  document.body.appendChild(ov);
  return ov;
}
function promptDialog(title, label, placeholder, cb){
  const ov=overlay('<div class="modal sm"><div class="modal-head"><strong>'+esc(title)+'</strong><button class="modal-close">✕</button></div>'
    +'<div class="modal-body"><div class="field"><label>'+esc(label)+'</label><input id="pInput" placeholder="'+esc(placeholder)+'"></div></div>'
    +'<div class="modal-foot"><button class="btn primary" id="pOk">Save</button><button class="btn" id="pCancel">Cancel</button></div></div>');
  const input=$("#pInput",ov); input.focus();
  const ok=()=>{ const v=input.value; closeOverlay(ov); cb(v); };
  $("#pOk",ov).addEventListener("click",ok);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") ok(); });
  $("#pCancel",ov).addEventListener("click",()=>closeOverlay(ov));
  $(".modal-close",ov).addEventListener("click",()=>closeOverlay(ov));
}
function confirmDialog(title, msg, cb){
  const ov=overlay('<div class="modal sm"><div class="modal-head"><strong>'+esc(title)+'</strong><button class="modal-close">✕</button></div>'
    +'<div class="modal-body"><p style="color:var(--muted)">'+esc(msg)+'</p></div>'
    +'<div class="modal-foot"><button class="btn danger" id="cOk">Delete</button><button class="btn" id="cCancel">Cancel</button></div></div>');
  $("#cOk",ov).addEventListener("click",()=>{closeOverlay(ov);cb();});
  $("#cCancel",ov).addEventListener("click",()=>closeOverlay(ov));
  $(".modal-close",ov).addEventListener("click",()=>closeOverlay(ov));
}
function quickAdd(colId, preset){
  preset = preset||{};
  const cols = state.columns.map(c=>'<option value="'+c.id+'"'+(c.id===colId?" selected":"")+'>'+esc(c.name)+'</option>').join("");
  const tpls = '<option value="">No template</option>'+state.templates.map((tp,i)=>'<option value="'+i+'">'+esc(tp.name)+'</option>').join("");
  const ov=overlay('<div class="modal sm"><div class="modal-head"><strong>New task</strong><button class="modal-close">✕</button></div>'
    +'<div class="modal-body">'
    +'<div class="field"><label>Title</label><input id="ntTitle" placeholder="e.g. Send report tomorrow #Reporting @Emre !high" autocomplete="off">'
      +'<p style="font-size:11px;color:var(--faint);margin-top:4px">Smart input: #label · @assignee · !priority · today / tomorrow / friday / 15.07 / in 3d</p></div>'
    +'<div class="field" style="margin-top:10px"><label>Template</label><select id="ntTpl">'+tpls+'</select></div>'
    +'<div class="field-grid">'
      +'<div class="field"><label>Priority</label><select id="ntPriority">'+PRIORITIES.map(p=>'<option value="'+p+'"'+(p==="medium"?" selected":"")+'>'+PRI_LABEL[p]+'</option>').join("")+'</select></div>'
      +'<div class="field"><label>Due date</label><input type="date" id="ntDue" value="'+esc(preset.due||"")+'"></div>'
      +'<div class="field"><label>Start date</label><input type="date" id="ntStart"></div>'
      +'<div class="field"><label>Repeat</label><select id="ntRecur"><option value="none">Never</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>'
      +'<div class="field"><label>Assignee</label><input id="ntAssignee" placeholder="Name"></div>'
      +'<div class="field"><label>Labels</label><input id="ntLabels" placeholder="comma, separated"></div>'
    +'</div>'
    +'<div class="field"><label>Column</label><select id="ntCol">'+cols+'</select></div>'
    +'</div>'
    +'<div class="modal-foot"><button class="btn primary" id="ntCreate">Create task</button><button class="btn" id="ntCancel">Cancel</button>'
    +'<span style="margin-left:auto;font-size:11px;color:var(--faint)">Enter to create · Esc to cancel</span></div></div>');
  const f = id => $(id, ov);
  let tplSubs = [];
  f("#ntTitle").focus();
  f("#ntTpl").addEventListener("change", e=>{
    const tp = state.templates[+e.target.value];
    tplSubs = [];
    if(!tp) return;
    f("#ntPriority").value = tp.priority||"medium";
    f("#ntLabels").value = (tp.labels||[]).join(", ");
    f("#ntRecur").value = tp.recur||"none";
    if(!f("#ntTitle").value.trim()) f("#ntTitle").value = tp.name;
    tplSubs = (tp.subtasks||[]).slice();
  });
  const doCreate = ()=>{
    const nlp = parseQuick(f("#ntTitle").value);
    const title = nlp.title;
    if(!title){ toast("A title is required","error"); f("#ntTitle").focus(); return; }
    const labels = [...new Set([...(nlp.labels||[]), ...f("#ntLabels").value.split(",").map(s=>s.trim()).filter(Boolean)])];
    const selPri = f("#ntPriority").value;
    const t = createTask({
      title,
      priority: (selPri==="medium" && nlp.priority)? nlp.priority : selPri,
      due: f("#ntDue").value || nlp.due || "",
      start: f("#ntStart").value || "",
      recur: f("#ntRecur").value,
      assignee: f("#ntAssignee").value.trim() || nlp.assignee || "",
      labels,
      subtasks: tplSubs.map(s=>({id:uid(), text:s, done:false}))
    }, f("#ntCol").value);
    closeOverlay(ov); render(); toast("Task "+t.key+" created");
  };
  f("#ntCreate").addEventListener("click", doCreate);
  ov.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.tagName!=="SELECT") doCreate(); });
  f("#ntCancel").addEventListener("click",()=>closeOverlay(ov));
  $(".modal-close",ov).addEventListener("click",()=>closeOverlay(ov));
}

/* ---- task detail modal ---- */
function openTask(id){
  const ex=$("#taskOverlay"); if(ex){ ex.remove(); openTaskId=null; }
  const t=state.tasks[id]; if(!t) return;
  openTaskId=id;
  const col=columnOf(id);
  const ov=overlay(taskModalHtml(t,col),{sticky:false});
  ov.id="taskOverlay";
  bindTaskModal(ov,t);
}
function taskModalHtml(t,col){
  const subsDone=t.subtasks.filter(s=>s.done).length;
  return '<div class="modal" id="taskModal">'
  +'<div class="modal-head"><span class="modal-key">'+esc(t.key)+'</span>'
    +'<select class="filter-sel" id="mStatus">'+state.columns.map(c=>'<option value="'+c.id+'"'+(col&&c.id===col.id?" selected":"")+'>'+esc(c.name)+'</option>').join("")+'</select>'
    +'<button class="modal-close" title="Close (Esc)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>'
  +'<div class="modal-body">'
    +'<input class="t-title" id="mTitle" value="'+esc(t.title)+'" placeholder="Task title">'
    +'<div class="field-grid">'
      +'<div class="field"><label>Priority</label><select id="mPriority">'+PRIORITIES.map(p=>'<option value="'+p+'"'+(t.priority===p?" selected":"")+'>'+PRI_LABEL[p]+'</option>').join("")+'</select></div>'
      +'<div class="field"><label>Due date</label><input type="date" id="mDue" value="'+esc(t.due)+'"></div>'
      +'<div class="field"><label>Assignee</label><input id="mAssignee" value="'+esc(t.assignee)+'" placeholder="Name"></div>'
      +'<div class="field"><label>Estimate (pts)</label><input id="mPoints" value="'+esc(t.points)+'" placeholder="e.g. 3" inputmode="numeric"></div>'
      +'<div class="field"><label>Start date</label><input type="date" id="mStart" value="'+esc(t.start||"")+'"></div>'
      +'<div class="field"><label>Repeat</label><select id="mRecur">'+["none","daily","weekly","monthly"].map(r=>'<option value="'+r+'"'+((t.recur||"none")===r?" selected":"")+'>'+(r==="none"?"Never":r[0].toUpperCase()+r.slice(1))+'</option>').join("")+'</select></div>'
    +'</div>'
    +'<div class="section"><div class="section-head"><h4>Labels</h4></div>'
      +'<div class="label-row" id="mLabels"></div></div>'
    +'<div class="section"><div class="section-head"><h4>Description</h4></div>'
      +'<div class="desc-render" id="mDescView">'+mdRender(t.desc)+'</div>'
      +'<textarea class="t-desc" id="mDescEdit" hidden>'+esc(t.desc)+'</textarea></div>'
    +'<div class="section"><div class="section-head"><h4>Subtasks'+(t.subtasks.length?' · '+subsDone+'/'+t.subtasks.length:"")+'</h4></div>'
      +'<div id="mSubs"></div>'
      +'<div class="inline-add"><input id="mSubInput" placeholder="Add a subtask and press Enter"><button class="btn" id="mSubAdd">Add</button></div></div>'
    +'<div class="section"><div class="section-head"><h4>Blocked by</h4></div><div class="blocked-list" id="mBlocked"></div>'
      +'<div class="inline-add"><select id="mBlockSel" class="filter-sel" style="flex:1"></select><button class="btn" id="mBlockAdd">Add blocker</button></div></div>'
    +'<div class="section"><div class="section-head"><h4>Links</h4><button class="sh-btn" id="mLinkAdd">+ Add link</button></div><div id="mLinks"></div></div>'
    +'<div class="section"><div class="section-head"><h4>Attachments <span id="mAttCount" style="font-weight:600;color:var(--faint);font-size:11px"></span></h4><button class="sh-btn" id="mAttAdd">+ Upload</button></div>'
      +'<div class="att-grid" id="mAtts"></div>'
      +'<p class="dropzone-hint">Tip: paste a screenshot here (Ctrl/Cmd+V) or drop files onto this window.</p></div>'
    +'<div class="section"><div class="section-head"><h4>Comments</h4></div><div id="mComments"></div>'
      +'<div class="inline-add"><input id="mCommentInput" placeholder="Write a comment and press Enter"><button class="btn" id="mCommentAdd">Comment</button></div></div>'
    +'<div class="section"><div class="section-head"><h4>Activity</h4></div><div class="activity" id="mActivity"></div></div>'
  +'</div>'
  +'<div class="modal-foot">'
    +'<button class="btn" id="mEmail" title="Open in your mail client — attach exported files manually">✉ Email</button>'
    +'<button class="btn" id="mCopy" title="Copy a text summary for Teams / Outlook">⧉ Copy summary</button>'
    +'<button class="btn" id="mSaveTpl" title="Reuse this task\'s structure later">☆ Save as template</button>'
    +'<span style="margin-left:auto;font-size:11.5px;color:var(--faint)">Created '+fmtTs(t.createdAt)+'</span>'
    +'<button class="btn primary" id="mSaveClose">Save &amp; close</button>'
    +'<button class="btn danger" id="mDelete">Delete</button>'
  +'</div></div>';
}
function bindTaskModal(ov,t){
  const refreshLists=()=>{ renderSubs(ov,t); renderLinks(ov,t); renderAtts(ov,t); renderComments(ov,t); renderActivity(ov,t); renderLabels(ov,t); renderBlocked(ov,t); };
  refreshLists();
  $(".modal-close",ov).addEventListener("click",()=>{closeOverlay(ov);openTaskId=null;render();});
  // fields
  $("#mTitle",ov).addEventListener("change",e=>updateTask(t.id,{title:e.target.value.trim()||t.title}));
  $("#mPriority",ov).addEventListener("change",e=>updateTask(t.id,{priority:e.target.value}));
  $("#mDue",ov).addEventListener("change",e=>updateTask(t.id,{due:e.target.value}));
  $("#mAssignee",ov).addEventListener("change",e=>updateTask(t.id,{assignee:e.target.value.trim()}));
  $("#mPoints",ov).addEventListener("change",e=>updateTask(t.id,{points:e.target.value.trim()}));
  $("#mStart",ov).addEventListener("change",e=>updateTask(t.id,{start:e.target.value}));
  $("#mRecur",ov).addEventListener("change",e=>{updateTask(t.id,{recur:e.target.value}); if(e.target.value!=="none"&&!t.due) toast("Set a due date so recurrence knows when to repeat");});
  $("#mBlockAdd",ov).addEventListener("click",()=>{
    const sel=$("#mBlockSel",ov); const bid=sel.value;
    if(!bid) return;
    if(!t.blockedBy.includes(bid)){ updateTask(t.id,{blockedBy:[...t.blockedBy,bid]}); }
    renderBlocked(ov,t);
  });
  $("#mSaveClose",ov).addEventListener("click",()=>{
    const ttl=$("#mTitle",ov).value.trim(); if(ttl) updateTask(t.id,{title:ttl});
    const de2=$("#mDescEdit",ov); if(!de2.hidden) updateTask(t.id,{desc:de2.value});
    save(); closeOverlay(ov); openTaskId=null; render(); toast("Saved ✓");
  });
  $("#mSaveTpl",ov).addEventListener("click",()=>{
    state.templates.push({name:t.title.slice(0,40)||"Template", priority:t.priority, labels:[...t.labels], recur:t.recur||"none", subtasks:t.subtasks.map(s=>s.text)});
    save(); toast('Template "'+(t.title.slice(0,40))+'" saved');
  });
  $("#mStatus",ov).addEventListener("change",e=>{ moveTask(t.id,e.target.value,0); });
  // description edit-in-place
  const dv=$("#mDescView",ov), de=$("#mDescEdit",ov);
  dv.addEventListener("click",()=>{ dv.hidden=true; de.hidden=false; de.focus(); });
  de.addEventListener("blur",()=>{ updateTask(t.id,{desc:de.value}); dv.innerHTML=mdRender(de.value); de.hidden=true; dv.hidden=false; renderActivity(ov,t); });
  // subtasks
  const addSub=()=>{ const i=$("#mSubInput",ov); if(i.value.trim()){ addSubtask(t.id,i.value); i.value=""; refreshLists(); } };
  $("#mSubAdd",ov).addEventListener("click",addSub);
  $("#mSubInput",ov).addEventListener("keydown",e=>{if(e.key==="Enter")addSub();});
  // comments
  const addCom=()=>{ const i=$("#mCommentInput",ov); if(i.value.trim()){ addComment(t.id,i.value); i.value=""; refreshLists(); } };
  $("#mCommentAdd",ov).addEventListener("click",addCom);
  $("#mCommentInput",ov).addEventListener("keydown",e=>{if(e.key==="Enter")addCom();});
  // links
  $("#mLinkAdd",ov).addEventListener("click",()=>{
    promptDialog("Add link","URL (Jira, Confluence, anything)","https://…",url=>{
      if(!url.trim())return;
      promptDialog("Add link","Label (optional)","e.g. JIRA GMF-1421",label=>{
        if(addLink(t.id,label,url)===null) toast("Only http(s) links are allowed","error");
        refreshLists();
      });
    });
  });
  // attachments
  $("#mAttAdd",ov).addEventListener("click",()=>$("#attachFile").click());
  $("#attachFile").onchange=e=>{ for(const f of e.target.files) readFileToAttachment(t.id,f,()=>refreshLists()); e.target.value=""; };
  ov.addEventListener("paste",e=>{
    const items=e.clipboardData && e.clipboardData.items; if(!items) return;
    for(const it of items){ if(it.kind==="file"){ const f=it.getAsFile(); if(f){ readFileToAttachment(t.id,f,()=>refreshLists()); toast("Screenshot attached"); } } }
  });
  ov.addEventListener("dragover",e=>{e.preventDefault(); $("#taskModal",ov).classList.add("paste-target");});
  ov.addEventListener("dragleave",()=>$("#taskModal",ov).classList.remove("paste-target"));
  ov.addEventListener("drop",e=>{
    e.preventDefault(); $("#taskModal",ov).classList.remove("paste-target");
    if(e.dataTransfer.files) for(const f of e.dataTransfer.files) readFileToAttachment(t.id,f,()=>refreshLists());
  });
  // email share
  $("#mEmail",ov).addEventListener("click",()=>{
    location.href="mailto:?subject="+encodeURIComponent("["+t.key+"] "+t.title)+"&body="+encodeURIComponent(shareText(t));
  });
  $("#mCopy",ov).addEventListener("click",()=>{
    const txt = shareText(t);
    const done = ()=>toast("Summary copied to clipboard");
    const fall = ()=>{
      try{
        const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select();
        const ok=document.execCommand("copy"); ta.remove();
        ok? done() : toast("Couldn't access the clipboard","error");
      }catch(e){ toast("Couldn't access the clipboard","error"); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,fall);
    else fall();
  });
  // delete with undo
  $("#mDelete",ov).addEventListener("click",()=>{
    confirmDialog("Delete task",'Delete "'+t.title+'" ('+t.key+')? You can undo right after.',()=>{
      const col=columnOf(t.id); const idx=col?col.taskIds.indexOf(t.id):0; const snapshot=t; const colId=col?col.id:state.columns[0].id;
      deleteTask(t.id); closeOverlay(ov); openTaskId=null; render();
      toast("Task "+t.key+" deleted","ok",{label:"Undo",fn:()=>{restoreTask(snapshot,colId,idx);render();}});
    });
  });
}
function readFileToAttachment(taskId,file,done){
  const cap = idb? 8 : 2.5;
  if(file.size>cap*1024*1024){ toast("File over "+cap+" MB — too large for local storage","error"); return; }
  const r=new FileReader();
  r.onload=()=>{ addAttachment(taskId,file.name,file.type,r.result,file.size); done&&done(); };
  r.readAsDataURL(file);
}
function renderLabels(ov,t){
  const wrap=$("#mLabels",ov);
  wrap.innerHTML=t.labels.map(l=>'<span class="lbl" style="background:'+labelColor(l)+'22;color:'+labelColor(l)+'">'+esc(l)+'<span class="lbl-del" data-l="'+esc(l)+'">×</span></span>').join("")
    +'<input class="lbl-input" id="mLabelInput" placeholder="+ label">';
  $$(".lbl-del",wrap).forEach(x=>x.addEventListener("click",()=>{ updateTask(t.id,{labels:t.labels.filter(l=>l!==x.dataset.l)}); renderLabels(ov,t); }));
  const inp=$("#mLabelInput",wrap);
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&inp.value.trim()){
      const v=inp.value.trim();
      if(!t.labels.includes(v)) updateTask(t.id,{labels:[...t.labels,v]});
      renderLabels(ov,t);
    }
  });
}
function renderBlocked(ov,t){
  const wrap=$("#mBlocked",ov); if(!wrap) return;
  wrap.innerHTML=(t.blockedBy||[]).filter(b=>state.tasks[b]).map(b=>{
    const bt=state.tasks[b]; const open=!isDone(b);
    return '<div class="link-item">'+(open?"⛔":"✅")+' <a data-open="'+b+'">'+esc(bt.key)+' — '+esc(bt.title)+'</a><button class="x" data-x="'+b+'" style="color:var(--faint)">✕</button></div>';
  }).join("") || '<p style="color:var(--faint);font-size:12.5px;padding:2px">This task is not waiting on anything.</p>';
  $$("a[data-open]",wrap).forEach(a=>a.addEventListener("click",()=>{closeOverlay(ov);openTaskId=null;openTask(a.dataset.open);}));
  $$("button.x",wrap).forEach(b=>b.addEventListener("click",()=>{updateTask(t.id,{blockedBy:t.blockedBy.filter(x=>x!==b.dataset.x)});renderBlocked(ov,t);}));
  const sel=$("#mBlockSel",ov); if(!sel) return;
  const opts=Object.values(state.tasks).filter(x=>x.id!==t.id && !t.blockedBy.includes(x.id));
  sel.innerHTML='<option value="">Select a task…</option>'+opts.map(x=>'<option value="'+x.id+'">'+esc(x.key+" — "+x.title.slice(0,48))+'</option>').join("");
}
function renderSubs(ov,t){
  const wrap=$("#mSubs",ov);
  wrap.innerHTML=t.subtasks.map(s=>'<div class="sub-item'+(s.done?" done":"")+'"><input type="checkbox" '+(s.done?"checked":"")+' data-s="'+s.id+'"><span class="sub-text">'+esc(s.text)+'</span><button class="x" data-x="'+s.id+'">✕</button></div>').join("")
    || '<p style="color:var(--faint);font-size:12.5px;padding:2px">Break this task into smaller steps.</p>';
  $$("input[type=checkbox]",wrap).forEach(cb=>cb.addEventListener("change",()=>{toggleSubtask(t.id,cb.dataset.s); renderSubs(ov,t); renderActivity(ov,t);}));
  $$("button.x",wrap).forEach(b=>b.addEventListener("click",()=>{removeSubtask(t.id,b.dataset.x); renderSubs(ov,t);}));
}
function renderLinks(ov,t){
  const wrap=$("#mLinks",ov);
  wrap.innerHTML=t.links.map(l=>'<div class="link-item">🔗 <a href="'+esc(l.url)+'" target="_blank" rel="noopener" title="'+esc(l.url)+'">'+esc(l.label)+'</a><button class="x" data-x="'+l.id+'" style="color:var(--faint)">✕</button></div>').join("")
    || '<p style="color:var(--faint);font-size:12.5px;padding:2px">Attach Jira tickets, docs or any URL.</p>';
  $$("button.x",wrap).forEach(b=>b.addEventListener("click",()=>{removeLink(t.id,b.dataset.x); renderLinks(ov,t);}));
}
function shareText(t){
  const col=columnOf(t.id);
  return ["Task: "+t.key+" — "+t.title,
    "Status: "+(col?col.name:""),
    "Priority: "+PRI_LABEL[t.priority],
    t.due?"Due: "+fmtDate(t.due):"",
    t.start?"Start: "+fmtDate(t.start):"",
    t.assignee?"Assignee: "+t.assignee:"",
    t.labels.length?"Labels: "+t.labels.join(", "):"",
    t.points?"Estimate: "+t.points+" pts":"",
    (t.recur&&t.recur!=="none")?"Repeats: "+t.recur:"",
    "", t.desc||"",
    t.subtasks.length?"\nSubtasks:\n"+t.subtasks.map(s=>(s.done?"[x] ":"[ ] ")+s.text).join("\n"):"",
    t.links.length?"\nLinks:\n"+t.links.map(l=>"- "+l.label+": "+l.url).join("\n"):"",
    t.attachments.length?"\nAttachments ("+t.attachments.length+"):\n"+t.attachments.map(a=>"- "+a.name+(a.size?" ("+fmtSize(a.size)+")":"")).join("\n"):""
  ].filter(Boolean).join("\n");
}
function dlAttachment(a){
  const dl=document.createElement("a"); dl.href=a.dataUrl; dl.download=a.name||"attachment";
  document.body.appendChild(dl); dl.click(); dl.remove();
}
function openLightbox(a){
  const lb=document.createElement("div"); lb.className="lightbox";
  lb.innerHTML='<div class="lb-bar"><span class="lb-name">'+esc(a.name)+(a.size?' · '+fmtSize(a.size):"")+'</span>'
    +'<span class="lb-actions"><button class="btn" data-dl>⬇ Download</button><button class="btn icon" data-close title="Close (Esc)">✕</button></span></div>'
    +'<img src="'+a.dataUrl+'" alt="'+esc(a.name)+'">';
  const onKey=e=>{ if(e.key==="Escape"){ e.stopPropagation(); close(); } };
  const close=()=>{ lb.remove(); document.removeEventListener("keydown",onKey,true); };
  lb.addEventListener("click",e=>{
    if(e.target.closest("[data-dl]")){ dlAttachment(a); return; }
    if(e.target===lb || e.target.closest("[data-close]")) close();
  });
  document.addEventListener("keydown",onKey,true);   // capture: don't let global Esc close the task modal below
  document.body.appendChild(lb);
}
function renderAtts(ov,t){
  const wrap=$("#mAtts",ov);
  const head=$("#mAttCount",ov);
  if(head) head.textContent = t.attachments.length
    ? t.attachments.length+" · "+fmtSize(t.attachments.reduce((a,x)=>a+(+x.size||0),0))
    : "";
  wrap.innerHTML=t.attachments.map(a=>'<div class="att" data-a="'+a.id+'">'
    +(a.type&&a.type.startsWith("image/")?'<img src="'+a.dataUrl+'" alt="'+esc(a.name)+'">':'<div class="att-file">📄</div>')
    +'<div class="att-name" title="'+esc(a.name)+'">'+esc(a.name)+'</div>'
    +'<div class="att-size">'+(a.size?fmtSize(a.size):"")+'</div>'
    +'<button class="x" data-dl="'+a.id+'" title="Download">⬇</button>'
    +'<button class="x" data-x="'+a.id+'" title="Remove">✕</button></div>').join("");
  $$(".att",wrap).forEach(el=>{
    el.addEventListener("click",e=>{
      const a=t.attachments.find(x=>x.id===el.dataset.a); if(!a) return;
      if(e.target.dataset.x){ removeAttachment(t.id,e.target.dataset.x); renderAtts(ov,t); return; }
      if(e.target.dataset.dl){ dlAttachment(a); return; }
      if(a.type&&a.type.startsWith("image/")) openLightbox(a);
      else dlAttachment(a);
    });
  });
}
function renderComments(ov,t){
  const wrap=$("#mComments",ov);
  wrap.innerHTML=t.comments.map(c=>'<div class="comment"><span class="avatar" style="background:hsl('+hueFor("me")+' 55% 45%)">ME</span>'
    +'<div class="c-body"><div class="c-head"><strong style="font-size:12.5px">You</strong><span class="c-time" title="'+fmtTs(c.ts)+'">'+relTime(c.ts)+'</span></div>'
    +'<div class="c-text">'+esc(c.text)+'</div></div><button class="x" data-x="'+c.id+'">✕</button></div>').join("")
    || '<p style="color:var(--faint);font-size:12.5px;padding:2px">No comments yet.</p>';
  $$("button.x",wrap).forEach(b=>b.addEventListener("click",()=>{removeComment(t.id,b.dataset.x); renderComments(ov,t);}));
}
function renderActivity(ov,t){
  $("#mActivity",ov).innerHTML=[...t.activity].reverse().map(a=>'<div class="act-item"><span class="a-time" title="'+fmtTs(a.ts)+'">'+relTime(a.ts)+'</span><span>'+esc(a.text)+'</span></div>').join("");
}

/* ---- menus ---- */
let openMenu=null;
function closeMenu(){ if(openMenu){openMenu.remove();openMenu=null;} }
function menuAt(btn, html){
  closeMenu();
  const m=document.createElement("div"); m.className="menu"; m.innerHTML=html;
  document.body.appendChild(m);
  const r=btn.getBoundingClientRect();
  m.style.top=(r.bottom+6)+"px";
  m.style.left=Math.min(r.left, window.innerWidth-m.offsetWidth-10)+"px";
  openMenu=m;
  setTimeout(()=>document.addEventListener("mousedown",function h(e){ if(!m.contains(e.target)){closeMenu();document.removeEventListener("mousedown",h);} }),0);
  return m;
}
function colMenu(btn,colId){
  const m=menuAt(btn,'<button class="menu-item" data-act="rename">✎ Rename column</button>'
    +'<button class="menu-item" data-act="wip">⛳ Set WIP limit</button>'
    +'<button class="menu-item" data-act="clear">⌫ Archive done tasks here</button>'
    +'<div class="menu-sep"></div><button class="menu-item danger" data-act="delete">🗑 Delete column</button>');
  m.addEventListener("click",e=>{
    const act=e.target.dataset.act; if(!act)return; closeMenu();
    const col=state.columns.find(c=>c.id===colId);
    if(act==="rename") promptDialog("Rename column","Name",col.name,v=>{renameColumn(colId,v);render();});
    if(act==="wip") promptDialog("WIP limit for "+col.name,"Max tasks (leave empty to remove)",col.wip||"",v=>{ setWip(colId, parseInt(v,10)); render(); toast(v&&+v>0?"WIP limit set to "+parseInt(v,10):"WIP limit removed"); });
    if(act==="delete") confirmDialog("Delete column",'Delete "'+col.name+'"? Its tasks move to the first column.',()=>{ if(deleteColumn(colId)){render();toast("Column deleted");} else toast("You need at least one column","error"); });
    if(act==="clear"){
      const ids=[...col.taskIds];
      let n=0; ids.forEach(id=>{ deleteTask(id); n++; });
      render(); toast(n+" task"+(n!==1?"s":"")+" removed");
    }
  });
}
function themeMenu(btn){
  const m=menuAt(btn,THEMES.map(th=>'<button class="menu-item" data-th="'+th.id+'"><span class="theme-sw" style="background:'+th.sw+'"></span>'+th.name+(state.theme===th.id?'<span class="check">✓</span>':"")+'</button>').join(""));
  m.addEventListener("click",e=>{
    const b=e.target.closest("[data-th]"); if(!b)return;
    setTheme(b.dataset.th); closeMenu(); toast("Theme: "+THEMES.find(t=>t.id===b.dataset.th).name);
  });
}
function snapshotsModal(){
  listSnapshots().then(list=>{
    const rows=list.map(s=>'<div class="snap-row"><div class="snap-info"><b>'+fmtTs(s.ts)+'</b>'
      +'<span class="snap-meta">'+s.tasks+' task'+(s.tasks!==1?"s":"")+' · '+fmtSize(s.size)+' · '+esc(s.reason)+'</span></div>'
      +'<div class="snap-actions"><button class="btn" data-restore="'+s.ts+'">Restore</button>'
      +'<button class="btn icon" data-del="'+s.ts+'" title="Delete snapshot">✕</button></div></div>').join("")
      || '<p style="color:var(--faint);font-size:12.5px">No snapshots yet. TaskFlow saves one automatically once a day and before risky operations (import, restore, reset).</p>';
    const ov=overlay('<div class="modal sm" id="snapModal"><div class="modal-head"><strong>Snapshots &amp; restore</strong><button class="modal-close">✕</button></div>'
      +'<div class="modal-body"><p style="font-size:12px;color:var(--muted);margin-bottom:10px">Restore points kept on this device ('+(idb?"IndexedDB, last "+SNAP_LIMIT:"local storage, last "+SNAP_LS_LIMIT)+' kept). Restoring replaces the current board — a safety snapshot is taken first, and Ctrl+Z also works.</p>'
      +'<div class="snap-list">'+rows+'</div></div>'
      +'<div class="modal-foot"><button class="btn primary" id="snapNow">＋ Snapshot now</button></div></div>');
    $(".modal-close",ov).addEventListener("click",()=>closeOverlay(ov));
    $("#snapNow",ov).addEventListener("click",()=>{
      snapshotNow("manual").then(r=>{
        ov.remove();                                  // instant: the modal re-opens refreshed
        r? toast("Snapshot saved") : toast("Couldn't save the snapshot (storage limit)","error");
        if(r) snapshotsModal();
      });
    });
    $$("[data-restore]",ov).forEach(b=>b.addEventListener("click",()=>{
      const ts=+b.dataset.restore;
      confirmDialog("Restore snapshot","Replace the current board with the snapshot from "+fmtTs(ts)+"? A safety snapshot of the current board is saved first.",()=>{
        closeOverlay(ov);
        restoreSnapshot(ts).then(()=>toast("Snapshot restored — Ctrl+Z to go back")).catch(e=>toast(e.message,"error"));
      });
    }));
    $$("[data-del]",ov).forEach(b=>b.addEventListener("click",()=>{
      deleteSnapshot(+b.dataset.del).then(()=>{ ov.remove(); snapshotsModal(); });
    }));
  });
}
function exportBackup(){
  const blob=new Blob([exportJSON()],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  const hm=new Date(); a.download="taskflow-backup-"+todayStr()+"-"+String(hm.getHours()).padStart(2,"0")+String(hm.getMinutes()).padStart(2,"0")+".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Backup downloaded");
}
function dataMenu(btn){
  const kb=Math.round(JSON.stringify(state).length/1024);
  const m=menuAt(btn,'<div class="menu-note">Local data: ~'+(kb>1024?(kb/1024).toFixed(1)+" MB":kb+" KB")+(idb?" · IndexedDB":" · localStorage")+'</div>'
    +'<div class="menu-sep"></div>'
    +'<button class="menu-item" data-act="export">⬇ Export backup (.json)</button>'
    +'<button class="menu-item" data-act="import">⬆ Import backup</button>'
    +'<button class="menu-item" data-act="snapshots">🕘 Snapshots &amp; restore</button>'
    +'<div class="menu-sep"></div><button class="menu-item" data-act="sample">✦ Load sample data</button>'
    +'<button class="menu-item danger" data-act="wipe">🗑 Erase everything</button>');
  m.addEventListener("click",e=>{
    const act=e.target.dataset.act; if(!act)return; closeMenu();
    if(act==="export") exportBackup();
    if(act==="import") $("#importFile").click();
    if(act==="snapshots") snapshotsModal();
    if(act==="sample"){ loadSample(); render(); toast("Sample data loaded"); }
    if(act==="wipe") confirmDialog("Erase everything","This deletes all tasks and columns permanently. A snapshot is saved first; Ctrl+Z also works.",()=>{ if(Object.keys(state.tasks).length) snapshotNow("before-reset"); pushHistory(); state=defaultState(); state.onboarded=true; save(); render(); toast("Workspace reset — Ctrl+Z to undo"); });
  });
}
$("#importFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ importJSON(r.result); document.documentElement.setAttribute("data-theme",state.theme); render(); toast("Backup restored"); } catch(err){ toast(err.message,"error"); } };
  r.readAsText(f); e.target.value="";
});

/* ---------- toasts ---------- */
function toast(msg,type,undo){
  const el=document.createElement("div"); el.className="toast"+(type==="error"?" error":"");
  el.innerHTML='<span class="t-dot"></span><span>'+esc(msg)+'</span>'+(undo?'<button class="t-undo">'+esc(undo.label)+'</button>':"");
  $("#toasts").appendChild(el);
  if(undo) $(".t-undo",el).addEventListener("click",()=>{undo.fn();el.remove();});
  setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),260);}, undo?6000:3200);
}

/* ---------- sample data ---------- */

/* ---------- global bindings & init ---------- */
/* =====================================================
   COMMAND PALETTE (Ctrl/Cmd+K) & SHORTCUTS
   ===================================================== */
function paletteActions(){
  const setView = v => ()=>{ state.view=v; save(); render(); };
  const acts = [
    {ic:"＋", label:"New task",            hint:"N",      run:()=>quickAdd()},
    {ic:"▦",  label:"Go to Board",         hint:"view",   run:setView("board")},
    {ic:"☰",  label:"Go to List",          hint:"view",   run:setView("list")},
    {ic:"▤",  label:"Go to Calendar",      hint:"view",   run:setView("calendar")},
    {ic:"━",  label:"Go to Timeline",      hint:"view",   run:setView("timeline")},
    {ic:"◔",  label:"Go to Dashboard",     hint:"view",   run:setView("dashboard")},
    {ic:"↶",  label:"Undo last change",    hint:"Ctrl+Z", run:undoAction},
    {ic:"↷",  label:"Redo",                hint:"Ctrl+\u21E7+Z", run:redoAction},
    {ic:"🕘", label:"Snapshots & restore", hint:"backup", run:snapshotsModal},
    {ic:"＋", label:"Snapshot now",        hint:"backup", run:()=>snapshotNow("manual").then(r=>{ if(r) toast("Snapshot saved"); else toast("Couldn't save the snapshot","error"); })},
    {ic:"⬇",  label:"Export backup (.json)", hint:"backup", run:exportBackup},
    {ic:"⬆",  label:"Import backup",       hint:"backup", run:()=>$("#importFile").click()},
    {ic:"?",  label:"Keyboard shortcuts",  hint:"?",      run:shortcutsModal},
    {ic:"ⓘ",  label:"About TaskFlow",      hint:"v"+APP_VERSION, run:()=>toast("TaskFlow v"+APP_VERSION+" — single file, "+Object.keys(state.tasks).length+" tasks on this device")}
  ];
  for(const th of THEMES) acts.push({ic:"◐", label:"Theme: "+th.name, hint:"theme", run:()=>{setTheme(th.id); toast("Theme: "+th.name);}});
  return acts;
}
function palMatch(label,q){
  label=label.toLowerCase();
  return q.split(/\s+/).every(tok=>label.includes(tok));
}
function openPalette(){
  const ov=overlay('<div class="palette" id="palette">'
    +'<div class="pal-input"><span class="pal-glyph">⌘</span><input id="palQ" placeholder="Type a command or search tasks…" autocomplete="off"></div>'
    +'<div class="pal-list" id="palList"></div>'
    +'<div class="pal-foot"><span><b>↑↓</b> navigate</span><span><b>↵</b> run</span><span><b>esc</b> close</span><span style="margin-left:auto"><b>ctrl+k</b> toggle</span></div></div>');
  ov.classList.add("pal-top");
  const q=$("#palQ",ov), list=$("#palList",ov);
  let items=[], sel=0;
  const paint=()=>{
    list.innerHTML = items.map((it,i)=>
      (it.sep?'<div class="pal-sep">'+esc(it.sep)+'</div>':'')
      +'<div class="pal-row'+(i===sel?" sel":"")+'" data-i="'+i+'"><span class="pal-ic">'+it.ic+'</span>'
      +'<span class="pal-label">'+esc(it.label)+'</span>'
      +(it.hint?'<span class="pal-hint">'+esc(it.hint)+'</span>':"")+'</div>').join("")
      || '<div class="pal-empty">No matching commands or tasks</div>';
    const s=$(".pal-row.sel",list); if(s&&s.scrollIntoView) s.scrollIntoView({block:"nearest"});
  };
  const build=()=>{
    const term=q.value.trim().toLowerCase();
    const acts = paletteActions().filter(a=>!term||palMatch(a.label,term));
    const tasks = Object.values(state.tasks)
      .filter(t=>!term||palMatch(t.key+" "+t.title,term))
      .slice(0, term?8:4)
      .map(t=>({ic:"⬚", label:t.key+" — "+t.title, hint:(columnOf(t.id)||{}).name||"", run:()=>openTask(t.id)}));
    items = term? [...acts, ...tasks] : [...acts.slice(0,8), ...tasks];
    if(items.length){ items[0]={...items[0], sep:"Commands & tasks"}; }
    sel=0; paint();
  };
  const go=i=>{
    const it=items[i]; if(!it) return;
    ov.remove();                                    // instant: it.run may open another overlay
    it.run();
  };
  q.addEventListener("input", build);
  q.addEventListener("keydown", e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); sel=(sel+1)%Math.max(1,items.length); paint(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); sel=(sel-1+items.length)%Math.max(1,items.length); paint(); }
    else if(e.key==="Enter"){ e.preventDefault(); go(sel); }
  });
  list.addEventListener("click", e=>{ const r=e.target.closest(".pal-row"); if(r) go(+r.dataset.i); });
  list.addEventListener("mousemove", e=>{ const r=e.target.closest(".pal-row"); if(r && +r.dataset.i!==sel){ sel=+r.dataset.i; paint(); } });
  build(); q.focus();
}
function shortcutsModal(){
  const rows=[
    ["New task","N"], ["Command palette","Ctrl K"], ["Focus search","/"],
    ["Undo","Ctrl Z"], ["Redo","Ctrl \u21E7 Z"], ["Open card","Enter"],
    ["Close / back","Esc"], ["This help","?"]
  ].map(r=>'<div class="sc-l">'+esc(r[0])+'</div><div class="sc-keys">'+r[1].split(" ").map(k=>"<kbd>"+esc(k)+"</kbd>").join("")+'</div>').join("");
  const ov=overlay('<div class="modal sm" id="scModal"><div class="modal-head"><strong>Keyboard shortcuts</strong><button class="modal-close">✕</button></div>'
    +'<div class="modal-body"><div class="sc-grid">'+rows+'</div>'
    +'<p style="margin-top:14px;font-size:11.5px;color:var(--faint)">Smart input in New task: #label · @assignee · !priority · today / tomorrow / friday / 15.07 / in 3d</p></div></div>');
  $(".modal-close",ov).addEventListener("click",()=>closeOverlay(ov));
}
function bindGlobal(){
  $("#newTaskBtn").addEventListener("click",()=>quickAdd());
  $("#beacon").addEventListener("click",()=>{state.view="dashboard";save();render();});
  $("#themeBtn").addEventListener("click",e=>themeMenu(e.currentTarget));
  $("#dataBtn").addEventListener("click",e=>dataMenu(e.currentTarget));
  $("#viewTabs").addEventListener("click",e=>{
    const b=e.target.closest(".view-tab"); if(!b)return;
    state.view=b.dataset.view; save(); render();
  });
  $("#search").addEventListener("input",e=>{filters.q=e.target.value;render();});
  $("#fPriority").addEventListener("change",e=>{filters.priority=e.target.value;render();});
  $("#fLabel").addEventListener("change",e=>{filters.label=e.target.value;render();});
  $("#fDue").addEventListener("change",e=>{filters.due=e.target.value;render();});
  $("#clearFilters").addEventListener("click",()=>{
    filters.q=filters.priority=filters.label=filters.due="";
    $("#search").value=""; $("#fPriority").value=""; $("#fLabel").value=""; $("#fDue").value="";
    render();
  });
  document.addEventListener("keydown",e=>{
    const tag=(e.target.tagName||"").toLowerCase();
    const typing=tag==="input"||tag==="textarea"||tag==="select";
    if(e.key==="Escape"){
      closeMenu();
      const lb=$(".lightbox"); if(lb){lb.remove();return;}
      const ov=$$(".overlay").pop(); if(ov){closeOverlay(ov); if(ov.id==="taskOverlay"){openTaskId=null;render();}}
      return;
    }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){
      e.preventDefault();
      const p=$("#palette");
      if(p) p.closest(".overlay").remove(); else openPalette();
      return;
    }
    if(typing) return;
    if(e.key==="?"){ e.preventDefault(); shortcutsModal(); return; }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); if(e.shiftKey) redoAction(); else undoAction(); return; }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y"){ e.preventDefault(); redoAction(); return; }
    if(e.key==="/"){ e.preventDefault(); $("#search").focus(); }
    if(e.key.toLowerCase()==="n" && !$$(".overlay").length){ e.preventDefault(); quickAdd(); }
  });
  // refresh due tags & beacon every minute
  setInterval(()=>{ if(!$$(".overlay").length) render(); }, 60000);
}

function showWelcome(){
  const ov=overlay('<div class="modal sm"><div class="modal-body welcome">'
    +'<div class="w-logo">T</div><h2>Welcome to TaskFlow</h2>'
    +'<p>A fast, private task tracker. Everything stays on this device — nothing is sent anywhere.</p>'
    +'<ul>'
    +'<li><b>Board · List · Calendar · Timeline</b> views</li>'
    +'<li><b>Smart quick add</b> — try "Report tomorrow #urgent @me !high"</li>'
    +'<li><b>N</b> new task · <b>/</b> search · <b>Ctrl+Z</b> undo</li>'
    +'<li><b>Backups</b> — export / import JSON anytime</li>'
    +'</ul>'
    +'<div style="display:flex;gap:8px;justify-content:center"><button class="btn primary" id="wDemo">Load demo board</button><button class="btn" id="wEmpty">Start empty</button></div>'
    +'<p style="margin-top:14px;font-size:10.5px;color:var(--faint)">TaskFlow v'+APP_VERSION+' · single file · press <kbd>Ctrl</kbd><kbd>K</kbd> anytime</p>'
    +'</div></div>',{sticky:true});
  $("#wDemo",ov).addEventListener("click",()=>{ loadSample(); closeOverlay(ov); render(); toast("Demo board loaded — replace it anytime from the backup menu"); });
  $("#wEmpty",ov).addEventListener("click",()=>{ state.onboarded=true; save(); closeOverlay(ov); });
}
window.addEventListener("error", e=>{
  try{ toast("Something went wrong — your data is safe. ("+((e.message||"unknown error").slice(0,80))+")","error"); }catch(_){}
});
window.addEventListener("unhandledrejection", ()=>{
  try{ toast("A background task failed — your data is safe.","error"); }catch(_){}
});
function init(){
  load();
  document.documentElement.setAttribute("data-theme", state.theme||"daylight");
  bindGlobal();
  render();
  if(!state.onboarded && !Object.keys(state.tasks).length) showWelcome();
  // hydrate from IndexedDB (survives localStorage quota limits)
  idbOpen().then(db=>{
    idb=db;
    const afterHydrate = ()=>{
      if(!Object.keys(state.tasks).length) return;
      listSnapshots().then(list=>{
        const newest = list.length? list[0].ts : 0;
        if(Date.now()-newest > 20*3600*1000) snapshotNow("auto");
      });
    };
    if(!db){ afterHydrate(); return; }
    idbGet(db).then(raw=>{
      if(!raw){ idbSet(db, JSON.stringify(state)); afterHydrate(); return; }
      try{
        const s=normalizeState(JSON.parse(raw));
        if((s.savedAt||0) > (state.savedAt||0)){
          state=s;
          document.documentElement.setAttribute("data-theme", state.theme);
          render();
        }
      }catch(e){}
      afterHydrate();
    });
  });
}

/* ---------- public API (used by the UI and by tests) ---------- */
window.App = {
  get state(){return state;},
  set state(s){state=s;},
  createTask, updateTask, deleteTask, restoreTask, moveTask, columnOf,
  addSubtask, toggleSubtask, removeSubtask,
  addComment, removeComment, addLink, removeLink, addAttachment, removeAttachment,
  addColumn, renameColumn, deleteColumn,
  dueStatus, relDays, getStats, isDone,
  exportJSON, importJSON, setTheme, save, load, normalizeState,
  parseQuick, safeUrl, nextDue, undoAction, redoAction, setWip, isBlocked,
  snapshotNow, listSnapshots, deleteSnapshot, restoreSnapshot, fmtSize, shareText, themes:THEMES,
  relTime, version:APP_VERSION, exportBackup,
  render, loadSample, defaultState, mdRender, esc
};

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
})();
