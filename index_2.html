  /* -------------------------------- split ------------------------------- */
  split() {
    const v = $('#view-split'); v.innerHTML = '';
    const d = Store.active;
    if (!d) { v.append(el('div',{class:'card muted'},'Open a file first.')); return; }
    const tag = Splitter.detectRecordTag(d);
    const card = el('div',{class:'card'});
    card.append(el('h3',{},'Split JPK_KR_PD for the MF gateway'));
    const modeSel = el('select',{id:'sp-mode'},
      el('option',{value:'period'},'By period (dates — MF-documented)'),
      el('option',{value:'size'},'By maximum part size'),
      el('option',{value:'count'},'By record count'),
      el('option',{value:'element'},'Every record separately'));
    const perIn   = el('input',{type:'text',id:'sp-period',placeholder:'e.g. 2025-07-01'});
    const sizeIn  = el('input',{type:'number',id:'sp-size',value:Settings.data.splitTargetMB,min:'1',max:'99'});
    const cntIn   = el('input',{type:'number',id:'sp-count',value:Settings.data.splitCount,min:'1'});
    const tagIn   = el('input',{type:'text',id:'sp-tag',value:tag});
    card.append(el('div',{class:'row'},
      el('label',{class:'field'},'Split mode', modeSel),
      el('label',{class:'field'},'Period boundary date(s), comma-sep', perIn),
      el('label',{class:'field'},'Max part size (MB)', sizeIn),
      el('label',{class:'field'},'Records per part', cntIn),
      el('label',{class:'field'},'Record element (auto-detected)', tagIn)));
    const secNote = d.scan?.ok
      ? ' Detected record sections: ' + [...Splitter.planFromScan(d.scan, null).names].map(n=>`<${n}>`).join(', ') + '.'
      : '';
    card.append(el('div',{class:'small muted',style:'margin-top:10px;line-height:1.6'},
      'PERIOD mode implements the mechanism documented by MF (FAQ JPK_PD Q39/Q106): each part gets its own DataOd–DataDo, records are assigned by operation date (D_7 / DataOperacji), RPD carries 0 in interim parts and the final K_1…K_8 only in the last part. ',
      'Other modes rebuild each part as complete XML: prolog + root + envelope sections + a document-order batch of records.',
      Settings.data.keepCtrl?' Every control record (DziennikCtrl, <Ctrl> C_1…C_5) is recomputed per part.':'',
      secNote,
      d.big?' Large-file mode: chunked streaming split — the whole document is never loaded into memory.':''));
    card.append(el('hr',{class:'sep'}));
    card.append(el('div',{class:'row'},
      el('button',{class:'btn acc',id:'sp-run'},'Split file'),
      el('button',{class:'btn',id:'sp-zip',disabled:''},'Download all as ZIP'),
      el('span',{class:'muted small',id:'sp-note'},
        d.size>MF_LIMIT?`Estimated parts at ${Settings.data.splitTargetMB} MB: ~${Math.ceil(d.size/(Settings.data.splitTargetMB*MB))}`:'File already fits under 100 MB — splitting is optional.')));
    v.append(card);
    const res = el('div',{style:'margin-top:14px'}); v.append(res);

    let lastParts = null;
    $('#sp-run', card).onclick = async () => {
      const opts = {
        mode: modeSel.value === 'element' ? 'count' : modeSel.value,
        maxBytes: (parseFloat(sizeIn.value)||95)*MB,
        maxCount: modeSel.value === 'element' ? 1 : (parseInt(cntIn.value)||50000),
        tag: tagIn.value.trim() || tag,
        auto: !tagIn.value.trim() || tagIn.value.trim() === tag
      };
      if (modeSel.value === 'period') {
        opts.boundaries = perIn.value.split(',').map(s => s.trim()).filter(Boolean).sort();
        if (!opts.boundaries.length || opts.boundaries.some(b => !/^\d{4}-\d{2}-\d{2}$/.test(b)))
          return Toast.show('Enter boundary date(s) as YYYY-MM-DD (comma-separated). Each part starts at a boundary, e.g. 2025-07-01 → Jan–Jun + Jul–Dec.', 'warn', 6000);
      }
      Settings.data.splitTargetMB = parseFloat(sizeIn.value)||95;
      Settings.data.splitCount = parseInt(cntIn.value)||50000; Settings.save();
      const task = Task.start('Splitting…');
      res.innerHTML = '';
      try {
        const parts = await Splitter.run(d, opts, task);
        lastParts = parts;
        $('#sp-zip', card).disabled = false;
        const total = parts.reduce((s,p)=>s+p.blob.size,0);
        res.append(el('div',{class:'card'},
          el('h3',{},`Result — ${parts.length} part(s), ${fmtBytes(total)} total`),
          ...parts.map(p => {
            const over = p.blob.size > MF_LIMIT;
            return el('div',{class:'part'},
              el('span',{class:'pn'},p.name),
              el('span',{class:'ps'},`${fmtInt(p.records)} records` + (p.period ? ` · ${p.period[0]} → ${p.period[1]}` : '')),
              el('span',{class:'pill '+(over?'err':'ok')}, fmtBytes(p.blob.size)),
              el('button',{class:'btn',onclick(){ download(p.blob, p.name); }},'Download'));
          })));
        Toast.show(`Split into ${parts.length} part(s)`,'ok');
        Log.add(`Split ${d.name} → ${parts.length} parts using <${opts.tag}>`, 'ok');
      } catch(e) {
        if (e.message!=='cancelled') { Toast.show('Split failed: '+e.message,'err'); Log.add('Split error: '+e.message,'err'); }
      }
      Task.end();
    };
    $('#sp-zip', card).onclick = async () => {
      if (!lastParts) return;
      const total = lastParts.reduce((s,p)=>s+p.blob.size,0);
      if (total > 400*MB && !(await Dialog.confirm('Large archive',
        `The uncompressed archive will be ${fmtBytes(total)}. Building it in the browser may take a while. Continue?`))) return;
      const task = Task.start('Building ZIP…');
      try {
        const z = new ZipBuilder();
        lastParts.forEach(p=>z.add(p.name, p.blob));
        const blob = await z.build(task);
        download(blob, d.name.replace(/\.xml$/i,'') + '_parts.zip');
      } catch(e){ if (e.message!=='cancelled') Toast.show('ZIP failed: '+e.message,'err'); }
      Task.end();
    };
  },

  /* ------------------------------- analyze ------------------------------ */
  async analyze() {
    const v = $('#view-analyze'); v.innerHTML = '';
    const d = Store.active;
    if (!d) { v.append(el('div',{class:'card muted'},'Open a file first.')); return; }
    if (!d.doc && !d.stats) { v.append(el('div',{class:'card muted'}, d.big && d.wf === false
      ? 'This file is not well-formed XML — fix the structure first (see Validate for the line number).'
      : 'Analysis needs a parsed or scanned document. Re-open the file to run the streaming scan.')); return; }
    if (!d.stats && d.doc) {
      const task = Task.start('Analyzing…');
      try { d.stats = await Analyzer.run(d.doc, task); } catch(e){ Task.end(); return; }
      Task.end(); UI.status();
    }
    const s = d.stats;
    const cards = el('div',{class:'cards'});
    const mk = (t,val,sub)=>el('div',{class:'card'},el('h3',{},t),el('div',{class:'metric'},val,sub?el('small',{},sub):null));
    cards.append(
      mk('Total nodes', fmtInt(s.nodes)), mk('Elements', fmtInt(s.elements)),
      mk('Attributes', fmtInt(s.attributes)), mk('Text nodes', fmtInt(s.textNodes)),
      mk('Comments', fmtInt(s.comments)), mk('Max depth', s.maxDepth),
      mk('Namespaces', s.namespaces.size), mk('Distinct tags', s.names.size),
      mk('DOM memory est.', fmtBytes(s.memoryEstimate)), mk('Complexity index', s.complexity, 'log-scaled'));
    v.append(cards);

    const g = el('div',{class:'grid',style:'grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:14px'});
    const freq = [...s.names.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8)
      .map(([label,value])=>({label:label.replace(/^.*:/,''),value}));
    const c1 = el('div',{class:'card'},el('h3',{},'Most frequent elements'));
    const cv1 = el('canvas'); c1.append(cv1); g.append(c1);

    const c2 = el('div',{class:'card'},el('h3',{},s.fromScan?'Root sections (streaming scan)':'Largest branches (root children, grouped)'));
    s.rootGroups.slice(0,8).forEach(b=>{
      const max = s.rootGroups[0].count;
      c2.append(el('div',{style:'margin-bottom:9px'},
        el('div',{class:'row small',style:'justify-content:space-between;margin-bottom:3px'},
          el('span',{},`<${b.name}>` + (b.times>1?` ×${fmtInt(b.times)}`:'')),
          el('span',{class:'muted'},fmtInt(b.count)+(s.fromScan?' occurrences':' elements'))),
        el('div',{class:'bar'},el('i',{style:`width:${b.count/max*100}%`}))));
    });
    g.append(c2);

    const c3 = el('div',{class:'card'},el('h3',{},'Repeated element names'),
      el('table',{class:'tbl'},
        el('thead',{},el('tr',{},el('th',{},'Element'),el('th',{},'Occurrences'))),
        el('tbody',{},...s.repeated.map(([n,c])=>el('tr',{},el('td',{},n),el('td',{},fmtInt(c)))))));
    g.append(c3);

    const c4 = el('div',{class:'card'},el('h3',{},'Namespaces'),
      s.namespaces.size
        ? el('table',{class:'tbl'},
            el('thead',{},el('tr',{},el('th',{},'URI'),el('th',{},'Elements'))),
            el('tbody',{},...[...s.namespaces.entries()].map(([n,c])=>el('tr',{},el('td',{},n),el('td',{},fmtInt(c))))))
        : el('div',{class:'muted small'},'No namespaces in use.'));
    g.append(c4);
    v.append(g);
    requestAnimationFrame(()=>Charts.bars(cv1, freq, Math.min(460, cv1.parentElement.clientWidth-32)));
  },

  /* ------------------------------- export ------------------------------- */
  export() {
    const v = $('#view-export'); v.innerHTML = '';
    const d = Store.active;
    if (!d) { v.append(el('div',{class:'card muted'},'Open a file first.')); return; }
    const base = d.name.replace(/\.xml$/i,'');
    const items = [
      ['XML', 'The current document (with editor changes applied).', () => {
        if (d.text == null && d.file) return download(d.file, d.name);   /* large-file mode: original bytes */
        download(new Blob([d.text ?? ''],{type:'application/xml'}), base+'.xml'); }],
      ['Pretty XML', 'Re-indented XML.', async () => {
        if (d.text == null) return Toast.show('Pretty print needs the document text — not available in large-file mode.','warn');
        const task = Task.start('Formatting…');
        try { const p = await Xml.prettyPrint(d.text ?? '', task);
          download(new Blob([p],{type:'application/xml'}), base+'_pretty.xml'); } catch(_){}
        Task.end(); }],
      ['JSON', 'XML converted to a JSON object (attributes as "@attr", text as "#text").', () => {
        if (!d.doc) return Toast.show('Needs a parsed document.','warn');
        download(new Blob([JSON.stringify(Xml.xmlToJson(d.doc), null, 2)],{type:'application/json'}), base+'.json'); }],
      ['CSV', 'Repeated record elements flattened into a table.', () => {
        if (!d.doc) return Toast.show('Needs a parsed document.','warn');
        const tag = Splitter.detectRecordTag(d);
        const csv = Xml.toCsv(d.doc, tag);
        if (!csv) return Toast.show(`No repeated <${tag}> records to tabulate.`,'warn');
        download(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}), base+`_${tag}.csv`); }],
      ['TXT', 'Plain text content (all text nodes).', () => {
        if (!d.doc && d.text == null) return Toast.show('Text extraction needs a parsed document — not available in large-file mode.','warn');
        const t = d.doc ? d.doc.documentElement.textContent : (d.text||'');
        download(new Blob([t],{type:'text/plain'}), base+'.txt'); }],
      ['PDF report', 'Validation & statistics report — PDF generated byte-by-byte in the browser.', () => App.exportReportPdf()],
      ['ZIP', 'The current document packed into a ZIP (manual ZIP writer, no libraries).', async () => {
        const task = Task.start('Building ZIP…');
        try { const z = new ZipBuilder();
          z.add(d.name, d.file && !d.dirty ? d.file : new Blob([d.text??''],{type:'application/xml'}));
          download(await z.build(task), base+'.zip'); } catch(_){}
        Task.end(); }],
    ];
    const card = el('div',{class:'card'}, el('h3',{},'Export — all formats generated locally, zero dependencies'));
    items.forEach(([label, desc, fn]) => card.append(el('div',{class:'part'},
      el('b',{style:'width:110px;flex:none'},label),
      el('span',{class:'ps',style:'flex:1;white-space:normal'},desc),
      el('button',{class:'btn acc',onclick:fn},'Export'))));
    v.append(card);
  },

  /* ------------------------------ reconcile ----------------------------- */
  reconcile() {
    const v = $('#view-reconcile'); v.innerHTML = '';
    const card = el('div',{class:'card'},
      el('h3',{},'Reconcile split parts against the original file'),
      el('div',{class:'small muted',style:'line-height:1.6;margin-bottom:10px'},
        'Streams every file chunk by chunk (nothing is loaded into memory) and proves: journal-row and KontoZapis-line counts, grand totals Σ Z_4 / Σ Z_7 in exact grosze, D_1 coverage without gaps or overlaps, per-part <Ctrl> consistency (C_1/C_3/C_4/C_5), envelope identity (NIP, reporting period) and the 100 MB gateway limit.'),
      el('div',{class:'row'},
        el('button',{class:'btn',onclick(){ $('#rc-orig').click(); }},'1 · Choose ORIGINAL file'),
        el('button',{class:'btn',onclick(){ $('#rc-parts').click(); }},'2 · Choose SPLIT PARTS (multi-select)'),
        el('button',{class:'btn acc',id:'rc-run',disabled:''},'3 · Reconcile'),
        el('button',{class:'btn',id:'rc-pdf',disabled:''},'Export PDF report')),
      el('div',{class:'small muted',id:'rc-files',style:'margin-top:8px'},'No files chosen.'));
    v.append(card,
      el('input',{type:'file',id:'rc-orig',accept:'.xml',hidden:''}),
      el('input',{type:'file',id:'rc-parts',accept:'.xml',multiple:'',hidden:''}));
    const res = el('div',{style:'margin-top:14px'}); v.append(res);
    const paintFiles = () => {
      $('#rc-files').textContent =
        `Original: ${Recon.orig ? Recon.orig.name + ' (' + fmtBytes(Recon.orig.size) + ')' : '—'}   |   Parts: ` +
        (Recon.parts.length ? Recon.parts.map(p=>p.name).join(', ') : '—');
      $('#rc-run').disabled = !(Recon.orig && Recon.parts.length);
    };
    $('#rc-orig').onchange  = e => { Recon.orig = e.target.files[0] || null; e.target.value=''; paintFiles(); };
    $('#rc-parts').onchange = e => { Recon.parts = [...e.target.files]; e.target.value=''; paintFiles(); };
    paintFiles();
    $('#rc-run').onclick = () => App.runReconcile(res);
    $('#rc-pdf').onclick = () => App.exportReconPdf();
    if (Recon.report) Views.paintRecon(res);
  },

  paintRecon(res) {
    if (!Recon.report) return;
    res.innerHTML = '';
    const { scans, issues } = Recon.report;
    const money = c => (c/100).toFixed(2);
    const rows = scans.map((s, i) => el('tr', {},
      el('td', {}, i ? 'part ' + i : 'ORIGINAL'),
      el('td', {}, s.name), el('td', {}, fmtBytes(s.size)),
      el('td', {}, fmtInt(s.dz)), el('td', {}, fmtInt(s.kz)),
      el('td', {}, money(s.z4)), el('td', {}, money(s.z7)),
      el('td', {}, s.d1min === null ? '—' : fmtInt(s.d1min) + '…' + fmtInt(s.d1max))));
    const sum = k => scans.slice(1).reduce((a, p) => a + p[k], 0);
    rows.push(el('tr', {}, el('td', {}, 'Σ parts'), el('td', {}, ''), el('td', {}, fmtBytes(scans.slice(1).reduce((a,p)=>a+p.size,0))),
      el('td', {}, fmtInt(sum('dz'))), el('td', {}, fmtInt(sum('kz'))),
      el('td', {}, money(sum('z4'))), el('td', {}, money(sum('z7'))), el('td', {}, '')));
    res.append(el('div', {class:'card'}, el('h3', {}, 'Totals'),
      el('table', {class:'tbl'},
        el('thead', {}, el('tr', {}, ...['Role','File','Size','Dziennik','KontoZapis','Σ Z_4','Σ Z_7','D_1 range'].map(h => el('th', {}, h)))),
        el('tbody', {}, ...rows))));
    const s = { err:0, warn:0, ok:0, info:0 };
    issues.forEach(i => s[i.sev]++);
    const box = el('div', {class:'card', style:'margin-top:14px'},
      el('h3', {}, 'Reconciliation checks'),
      el('div', {class:'row', style:'margin-bottom:12px'},
        el('span', {class:'pill err'}, s.err + ' errors'), el('span', {class:'pill warn'}, s.warn + ' warnings'),
        el('span', {class:'pill ok'}, s.ok + ' passed'), el('span', {class:'pill info'}, s.info + ' info')));
    issues.forEach(i => box.append(el('div', {class:'issue ' + i.sev},
      el('span', {class:'ic'}), el('div', {}, el('b', {}, i.title), el('div', {class:'d'}, i.detail)))));
    res.append(box);
    const pdf = $('#rc-pdf'); if (pdf) pdf.disabled = false;
  },

  /* ------------------------------ settings ------------------------------ */
  settings() {
    const v = $('#view-settings'); v.innerHTML = '';
    const S = Settings.data;
    const num = (key,label,min,max)=>el('label',{class:'field'},label,
      el('input',{type:'number',value:S[key],min,max,oninput(e){ S[key]=+e.target.value; Settings.save(); }}));
    const card = el('div',{class:'card'},
      el('h3',{},'Preferences'),
      el('div',{class:'row'},
        el('label',{class:'field'},'Theme',
          el('select',{oninput(e){ App.setTheme(e.target.value); }},
            el('option',{value:'dark',...(S.theme==='dark'?{selected:''}:{})},'Dark'),
            el('option',{value:'light',...(S.theme==='light'?{selected:''}:{})},'Light'))),
        num('splitTargetMB','Default split size (MB)',1,99),
        num('splitCount','Default records per part',1),
        el('label',{class:'field'},'Record element override',
          el('input',{type:'text',value:S.recordTag,placeholder:'auto-detect',oninput(e){ S.recordTag=e.target.value.trim(); Settings.save(); }}))),
      el('hr',{class:'sep'}),
      el('div',{class:'row'},
        num('domLimitMB','DOM parse limit (MB) — above this, streaming mode',5,500),
        num('highlightLimitKB','Syntax-highlight limit (KB)',100,20000),
        el('label',{class:'field'},'Recompute DziennikCtrl on split',
          el('select',{oninput(e){ S.keepCtrl = e.target.value==='1'; Settings.save(); }},
            el('option',{value:'1',...(S.keepCtrl?{selected:''}:{})},'Yes (recommended)'),
            el('option',{value:'0',...(!S.keepCtrl?{selected:''}:{})},'No — copy as-is')))),
      el('hr',{class:'sep'}),
      el('div',{class:'row'},
        el('button',{class:'btn danger',onclick:async()=>{
          if (await Dialog.confirm('Clear recent files','Remove the recent-files list stored in this browser?')) {
            Store.recents=[]; try{localStorage.removeItem('jpkstudio-recent');}catch(_){}
            UI.renderRecents(); Toast.show('Recent files cleared','ok');
          }}},'Clear recent files'),
        el('span',{class:'muted small'},'Settings persist in this browser only. The app never makes a network request.')));
    v.append(card);
  }
};
</script>
<script>
"use strict";
/* ============================================================================
 * App controller — file loading, shortcuts, drag & drop, wiring
 * ========================================================================== */
const App = {
  async init() {
    Settings.load(); Store.loadRecents();
    this.setTheme(Settings.data.theme);
    UI.init(); UI.go('dashboard'); UI.status();
    Log.add('JPK Studio ready — fully offline, no dependencies.', 'ok');

    $('#btn-open').onclick   = () => $('#file-input').click();
    $('#btn-sample').onclick = () => this.loadSample();
    $('#btn-theme').onclick  = () => this.setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
    $('#btn-sidebar').onclick= () => $('#sidebar').classList.toggle('collapsed');
    $('#btn-logs').onclick   = () => $('#logs-drawer').classList.toggle('show');
    $('#btn-logs-close').onclick = () => $('#logs-drawer').classList.remove('show');
    $('#btn-logs-clear').onclick = () => Log.clear();
    $('#btn-help').onclick   = () => this.helpDialog();
    $('#btn-validate-quick').onclick = () => this.go('validate', true);
    $('#btn-split-quick').onclick    = () => this.go('split');
    $('#file-input').addEventListener('change', e => {
      for (const f of e.target.files) this.loadFile(f);
      e.target.value = '';
    });

    /* drag & drop anywhere */
    ['dragover','dragenter'].forEach(ev => document.addEventListener(ev, e => {
      e.preventDefault(); $('#drop')?.classList.add('hot');
    }));
    ['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
      e.preventDefault(); if (ev==='dragleave' && e.relatedTarget) return;
      $('#drop')?.classList.remove('hot');
    }));
    document.addEventListener('drop', e => {
      for (const f of e.dataTransfer.files)
        if (/\.xml$/i.test(f.name) || f.type.includes('xml') || !f.type) this.loadFile(f);
        else Toast.show(`${f.name}: not an XML file`, 'warn');
    });

    /* sidebar resizer */
    const rez = $('#side-resizer');
    rez.addEventListener('mousedown', e => {
      e.preventDefault();
      const move = ev => { $('#sidebar').style.width = Math.max(170, Math.min(420, ev.clientX)) + 'px'; };
      const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
      addEventListener('mousemove', move); addEventListener('mouseup', up);
    });
    /* logs drawer resizer */
    $('#logs-head').addEventListener('mousedown', e => {
      if (e.target.closest('button')) return;
      e.preventDefault();
      const drawer = $('#logs-drawer'), startY = e.clientY, startH = drawer.offsetHeight;
      const move = ev => { drawer.style.height = Math.max(70, Math.min(innerHeight*0.6, startH + (startY-ev.clientY))) + 'px'; };
      const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
      addEventListener('mousemove', move); addEventListener('mouseup', up);
    });

    /* keyboard shortcuts */
    document.addEventListener('keydown', e => {
      const c = e.ctrlKey || e.metaKey;
      if (c && e.key >= '1' && e.key <= '9') { e.preventDefault(); this.go(NAV[+e.key-1].id); return; }
      if (c) switch (e.key.toLowerCase()) {
        case 'o': e.preventDefault(); $('#file-input').click(); break;
        case 'b': e.preventDefault(); $('#sidebar').classList.toggle('collapsed'); break;
        case 'j': e.preventDefault(); this.setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); break;
        case 'p': e.preventDefault(); this.pretty(); break;
        case 'f': if (UI.view==='editor'){ e.preventDefault(); this.toggleFind(true); } break;
        case 'h': if (UI.view==='editor'){ e.preventDefault(); this.toggleFind(true); $('#repl-q').focus(); } break;
        case 'g': if (UI.view==='editor'){ e.preventDefault(); Editor.gotoLine(); } break;
        case 'e': e.preventDefault(); this.go('validate', true); break;
        case 's': e.preventDefault(); this.go('export'); break;
      }
      if (e.key === 'F1') { e.preventDefault(); this.helpDialog(); }
      if (e.key === 'Escape') this.toggleFind(false);
    });
  },

  setTheme(t) {
    document.documentElement.dataset.theme = t;
    Settings.data.theme = t; Settings.save();
    if (UI.view==='dashboard') Views.dashboard();
    if (UI.view==='analyze') { /* re-render charts with new palette */ const d=Store.active; if(d?.stats) Views.analyze(); }
  },

  go(view, arg) { UI.go(view); if (view==='validate' && arg) Views.validate(true); },

  toggleFind(show) {
    const fb = $('#findbar'); if (!fb) return;
    fb.classList.toggle('show', !!show);
    if (show) { $('#find-q').focus(); $('#find-q').select(); }
  },

  async loadSample() {
    const rows = await Dialog.prompt('Generate sample JPK_KR_PD', 'Number of journal entries (Dziennik records):', '400');
    if (rows === null) return;
    const text = generateSample(Math.max(1, Math.min(200000, parseInt(rows)||400)));
    const blob = new Blob([text], { type:'application/xml' });
    const f = new File([blob], `sample_JPK_KR_PD_${rows}.xml`, { type:'application/xml' });
    this.loadFile(f);
  },

  async loadFile(file) {
    const task = Task.start('Loading ' + file.name + '…');
    const d = makeDoc(file.name, file.size);
    d.file = file;
    try {
      /* encoding + UTF-8 scan on a chunk (full scan for files < 64 MB) */
      const headBytes = new Uint8Array(await file.slice(0, 4096).arrayBuffer());
      d.encoding = Xml.detectEncoding(headBytes);
      Task.progress(0.1);
      /* full-file UTF-8 scan, chunked — no more probe-only sampling and no
       * false positives from a chunk boundary landing inside a Polish char */
      d.utf8ok = (await Xml.validateUtf8Stream(file, Task.active, 0.1, 0.3)).ok;
      Task.progress(0.3);

      d.big = file.size > Settings.data.domLimitMB*MB;
      if (!d.big) {
        d.text = await file.text();
        Task.progress(0.45);
        const { doc, error, line } = Xml.parse(d.text);
        d.doc = doc; d.parseError = error; d.parseLine = line;
        if (doc) {
          const t2 = Task.active;
          d.stats = await Analyzer.run(doc, t2);
        } else if (file.size > 32*MB) {
          /* Browsers can fail DOMParser on very large inputs for memory
           * reasons and report it like a syntax error. Double-check with the
           * streaming scanner before claiming the XML is broken. */
          d.scan = await Xml.scanStream(file, Task.active, 0.5, 0.85);
          if (d.scan.ok) {
            d.big = true; d.doc = null; d.text = null; d.wf = true;
            d.stats = statsFromScan(d.scan, file.size);
            Log.add(`${file.name}: browser DOM parse failed but the streaming scan confirms the XML is well-formed — switched to large-file mode.`, 'warn');
            Toast.show('Document is well-formed; the browser could not hold its DOM, so large-file mode was enabled.', 'warn', 6000);
          } else Log.add(`Parse error in ${file.name}: ${error}`, 'err');
        } else {
          Log.add(`Parse error in ${file.name}: ${error}`, 'err');
        }
      } else {
        Log.add(`${file.name} opened in large-file mode (${fmtBytes(file.size)} > ${Settings.data.domLimitMB} MB DOM limit).`, 'warn');
        d.scan = await Xml.scanStream(file, Task.active, 0.35, 0.85);
        d.wf = d.scan.ok;
        if (d.scan.ok) {
          d.stats = statsFromScan(d.scan, file.size);
          Log.add(`Streaming scan: well-formed, ${fmtInt(d.scan.stats.elements)} elements, depth ${d.scan.stats.maxDepth}.`, 'ok');
        } else {
          Log.add(`Streaming scan: NOT well-formed — ${d.scan.error} (line ${d.scan.line}).`, 'err');
        }
      }

      Store.docs.set(d.id, d);
      Store.activeId = d.id;
      Store.addRecent(d.name, d.size);
      UI.renderTabs(); UI.status();
      Task.end();
      Toast.show(`${file.name} loaded (${fmtBytes(file.size)})`, 'ok');
      if (file.size > MF_LIMIT)
        Toast.show('This file exceeds the 100 MB MF gateway limit — use Split.', 'warn', 6000);
      this.go(d.doc || d.big ? 'dashboard' : 'editor');
      if (!d.doc && !d.big && d.parseError) {
        this.go('editor');
        Toast.show('XML is not well-formed — opened in editor. ' + (d.parseLine?`(line ${d.parseLine})`:''), 'err', 6000);
      }
      if (d.big && d.wf === false)
        Toast.show(`XML is not well-formed: ${d.scan.error} (around line ${fmtInt(d.scan.line||0)})`, 'err', 8000);
      /* auto validation summary */
      await Validator.run(d, null).catch(()=>{});
      UI.status();
      if (UI.view==='dashboard') Views.dashboard();
    } catch (e) {
      Task.end();
      Toast.show('Failed to load: ' + e.message, 'err');
      Log.add('Load error: ' + e.message, 'err');
    }
  },

  activate(id) {
    Store.activeId = id;
    UI.renderTabs(); UI.status();
    Views[UI.view]?.();
  },

  async closeDoc(id) {
    const d = Store.docs.get(id);
    if (d?.dirty && !(await Dialog.confirm('Unsaved changes', `${d.name} has unsaved editor changes. Close anyway?`))) return;
    Store.docs.delete(id);
    if (Store.activeId === id) Store.activeId = [...Store.docs.keys()].pop() || null;
    UI.renderTabs(); UI.status(); Views[UI.view]?.();
  },

  /* Opt-in DOM parse for a large file (tree view / XPath). Honest failure:
   * if the parser dies on a file the stream scan proved well-formed, say so. */
  async forceDom() {
    const d = Store.active;
    if (!d?.file || !d.big) return;
    const go = await Dialog.confirm('Load into DOM?',
      `${d.name} is ${fmtBytes(d.size)}. Parsing it into a DOM may use several GB of memory and freeze the tab for a while. Continue?`);
    if (!go) return;
    const task = Task.start('Parsing into DOM…');
    try {
      const text = await d.file.text();
      Task.progress(0.35); await nextFrame();
      const { doc, error, line } = Xml.parse(text);
      if (!doc) {
        Task.end();
        if (d.wf === true)
          return Toast.show('The XML is well-formed (stream-verified), but the browser could not build a DOM this large. Streaming tools remain fully available.', 'warn', 8000);
        d.parseError = error; d.parseLine = line;
        return Toast.show(`Not well-formed: ${error}` + (line?` (line ${line})`:''), 'err', 7000);
      }
      d.doc = doc; d.text = null;                 /* keep memory down: DOM without a text copy */
      d.big = false; d.forcedDom = true;
      d.stats = await Analyzer.run(doc, Task.active);
      Task.end();
      Toast.show('DOM loaded — tree view and XPath are now available.', 'ok');
      UI.status(); Views[UI.view]?.();
    } catch (e) {
      Task.end();
      if (d.wf === true)
        Toast.show('The XML is well-formed (stream-verified), but the browser ran out of memory building the DOM. Streaming tools remain fully available.', 'warn', 8000);
      else Toast.show('DOM load failed: ' + e.message, 'err');
    }
  },

  async pretty() {
    const d = Store.active;
    if (!d || d.big) return Toast.show('Pretty print needs a document loaded in the editor.','warn');
    const task = Task.start('Pretty printing…');
    try {
      const p = await Xml.prettyPrint(d.text ?? Editor.get(), task);
      d.text = p; d.dirty = true;
      if (UI.view!=='editor') this.go('editor');
      Editor.set(p);
      UI.renderTabs();
      Toast.show('Formatted','ok');
    } catch(e){ if (e.message!=='cancelled') Toast.show('Format failed: '+e.message,'err'); }
    Task.end();
  },

  applyEditor() {
    const d = Store.active;
    if (!d) return;
    if (d.big || (d.text == null && d.file))
      return Toast.show('This file is in large-file mode — the editor shows a placeholder, not the document, so there is nothing to apply.', 'warn', 5000);
    d.text = Editor.get(); d.dirty = true;
    const { doc, error, line } = Xml.parse(d.text);
    d.doc = doc; d.parseError = error;
    d.stats = null; d.issues = null;
    d.size = new Blob([d.text]).size;
    d.file = null;
    UI.renderTabs(); UI.status();
    if (error) Toast.show(`Still not well-formed${line?` (line ${line})`:''} — changes kept in memory.`, 'warn', 5000);
    else Toast.show('Changes applied — document re-parsed.', 'ok');
  },

  async xpathDialog() {
    const d = Store.active;
    if (!d?.doc) return Toast.show('XPath needs a parsed document.','warn');
    const q = await Dialog.prompt('XPath search',
      'Expression (namespaces: use *[local-name()="Dziennik"] for namespaced JPK):', '//*[local-name()="NIP"]');
    if (!q) return;
    try {
      const r = d.doc.evaluate(q, d.doc, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null);
      const rows = [];
      for (let i = 0; i < Math.min(r.snapshotLength, 200); i++) {
        const n = r.snapshotItem(i);
        rows.push(el('tr',{},
          el('td',{}, n.nodeName || n.nodeType),
          el('td',{}, (n.textContent||'').trim().slice(0,90))));
      }
      Dialog.open({ title:`XPath — ${fmtInt(r.snapshotLength)} match(es)`,
        body: rows.length
          ? el('div',{style:'max-height:50vh;overflow:auto'},
              el('table',{class:'tbl'},
                el('thead',{},el('tr',{},el('th',{},'Node'),el('th',{},'Value'))),
                el('tbody',{},...rows)),
              r.snapshotLength>200?el('div',{class:'muted small',style:'margin-top:8px'},'Showing first 200.'):null)
          : 'No matches.',
        buttons:[{label:'Close', value:true, acc:true}] });
      Log.add(`XPath "${q}" → ${r.snapshotLength} matches`);
    } catch(e) { Toast.show('XPath error: '+e.message,'err'); }
  },

  exportReportPdf() {
    const d = Store.active;
    if (!d) return Toast.show('Open a file first.','warn');
    const L = [];
    L.push(`File: ${d.name}`);
    L.push(`Size: ${fmtBytes(d.size)}  |  MF gateway limit usage: ${(d.size/MF_LIMIT*100).toFixed(1)}% of 100 MB`);
    L.push(`Encoding: ${d.encoding}  |  UTF-8 valid: ${d.utf8ok===null?'n/a':d.utf8ok?'yes':'NO'}`);
    L.push(`Generated: ${new Date().toLocaleString()}  |  JPK Studio (offline single-file tool)`);
    L.push('');
    if (d.stats) {
      const s = d.stats;
      L.push('--- STATISTICS ---');
      L.push(`Nodes ${fmtInt(s.nodes)} | Elements ${fmtInt(s.elements)} | Attributes ${fmtInt(s.attributes)} | Text nodes ${fmtInt(s.textNodes)}`);
      L.push(`Comments ${s.comments} | Max depth ${s.maxDepth} | Namespaces ${s.namespaces.size} | Distinct tags ${s.names.size}`);
      L.push(`DOM memory estimate ${fmtBytes(s.memoryEstimate)} | Complexity index ${s.complexity}`);
      L.push('');
    }
    L.push('--- VALIDATION ---');
    if (d.issues) d.issues.forEach(i => {
      L.push(`[${i.sev.toUpperCase()}] ${i.title}`);
      L.push(`        ${i.detail}`);
    });
    else L.push('Not validated yet — run Validation first for the full rule set.');
    download(buildPdf('JPK Studio — file report', L), d.name.replace(/\.xml$/i,'') + '_report.pdf');
  },

  async runReconcile(resEl) {
    if (!Recon.orig || !Recon.parts.length) return;
    const task = Task.start('Reconciling…');
    try {
      const files = [Recon.orig, ...Recon.parts];
      const scans = [];
      for (let i = 0; i < files.length; i++)
        scans.push(await reconScan(files[i], task, i / files.length, (i + 1) / files.length));
      const [o, ...ps] = scans;
      const issues = [];
      const add = (sev, title, detail) => issues.push({ sev, title, detail });
      const money = c => (c / 100).toFixed(2);
      const sum = k => ps.reduce((s, p) => s + p[k], 0);
      if (sum('dz') === o.dz) add('ok', 'Journal rows reconcile', `Σ parts = ${fmtInt(sum('dz'))} = original ${fmtInt(o.dz)} <Dziennik> record(s).`);
      else add('err', 'Journal rows DO NOT reconcile', `Σ parts ${fmtInt(sum('dz'))} ≠ original ${fmtInt(o.dz)}.`);
      if (sum('kz') === o.kz) add('ok', 'KontoZapis lines reconcile', `Σ parts = ${fmtInt(sum('kz'))} = original ${fmtInt(o.kz)}.`);
      else add('err', 'KontoZapis lines DO NOT reconcile', `Σ parts ${fmtInt(sum('kz'))} ≠ original ${fmtInt(o.kz)}.`);
      if (sum('z4') === o.z4) add('ok', 'Grand total Σ Z_4 (debit) reconciles', `${money(o.z4)} — exact to the grosz.`);
      else add('err', 'Σ Z_4 DOES NOT reconcile', `Parts ${money(sum('z4'))} ≠ original ${money(o.z4)} (diff ${money(sum('z4') - o.z4)}).`);
      if (sum('z7') === o.z7) add('ok', 'Grand total Σ Z_7 (credit) reconciles', `${money(o.z7)} — exact to the grosz.`);
      else add('err', 'Σ Z_7 DOES NOT reconcile', `Parts ${money(sum('z7'))} ≠ original ${money(o.z7)} (diff ${money(sum('z7') - o.z7)}).`);
      if (o.z4 === o.z7) add('ok', 'Original is balanced', `Σ Z_4 = Σ Z_7 = ${money(o.z4)}.`);
      else add('err', 'Original is NOT balanced', `Σ Z_4 ${money(o.z4)} ≠ Σ Z_7 ${money(o.z7)}.`);
      ps.forEach((p, i) => p.z4 === p.z7
        ? add('ok', `Part ${i + 1} is balanced`, `Σ Z_4 = Σ Z_7 = ${money(p.z4)}.`)
        : add('err', `Part ${i + 1} is NOT balanced`, `Σ Z_4 ${money(p.z4)} ≠ Σ Z_7 ${money(p.z7)}.`));
      /* D_1 coverage: every entry in exactly one part */
      const origSet = new Set(o.d1);
      if (origSet.size !== o.d1.length) add('err', 'Duplicate D_1 in original', `${fmtInt(o.d1.length - origSet.size)} duplicate value(s).`);
      const seen = new Set(); let overlap = 0, alien = 0;
      for (const p of ps) for (const v of p.d1) { if (seen.has(v)) overlap++; else seen.add(v); if (!origSet.has(v)) alien++; }
      let gaps = 0; for (const v of origSet) if (!seen.has(v)) gaps++;
      if (overlap) add('err', `D_1 overlap between parts (${fmtInt(overlap)}×)`, 'The same journal entry appears in more than one part.');
      if (alien) add('err', `Unknown D_1 in parts (${fmtInt(alien)}×)`, 'Parts contain entry numbers that do not exist in the original.');
      if (gaps) add('err', `D_1 missing from parts (${fmtInt(gaps)}×)`, 'Some journal entries of the original appear in no part.');
      if (!overlap && !alien && !gaps) add('ok', 'D_1 coverage complete', `All ${fmtInt(origSet.size)} entry numbers appear in exactly one part — no gaps, no overlaps.`);
      if (o.d1min !== null && origSet.size === o.d1max - o.d1min + 1) add('ok', 'D_1 sequence contiguous', `${fmtInt(o.d1min)}…${fmtInt(o.d1max)} without holes.`);
      else if (o.d1min !== null) add('warn', 'D_1 sequence has holes', `Range ${fmtInt(o.d1min)}…${fmtInt(o.d1max)} vs ${fmtInt(origSet.size)} unique values.`);
      /* Ctrl consistency per file */
      const ctrlCheck = (s, label) => {
        if (s.ctrl.C_1 === undefined) { add('warn', `${label}: no <Ctrl> record`, 'Expected C_1…C_5 control sums.'); return; }
        const bad = [];
        if (+s.ctrl.C_1 !== s.dz) bad.push(`C_1=${s.ctrl.C_1} vs ${fmtInt(s.dz)} Dziennik`);
        if (s.ctrl.C_3 !== undefined && +s.ctrl.C_3 !== s.kz) bad.push(`C_3=${s.ctrl.C_3} vs ${fmtInt(s.kz)} KontoZapis`);
        if (s.ctrl.C_4 !== undefined && Math.round(parseFloat(s.ctrl.C_4) * 100) !== s.z4) bad.push(`C_4=${s.ctrl.C_4} vs Σ Z_4 ${money(s.z4)}`);
        if (s.ctrl.C_5 !== undefined && Math.round(parseFloat(s.ctrl.C_5) * 100) !== s.z7) bad.push(`C_5=${s.ctrl.C_5} vs Σ Z_7 ${money(s.z7)}`);
        if (bad.length) add('err', `${label}: Ctrl INCONSISTENT`, bad.join('; ') + '. Re-split with “Recompute Ctrl on split” enabled.');
        else add('ok', `${label}: Ctrl consistent`, `C_1=${s.ctrl.C_1}, C_3=${s.ctrl.C_3}, C_4=${s.ctrl.C_4}, C_5=${s.ctrl.C_5} match the contents.`);
      };
      ctrlCheck(o, 'Original');
      ps.forEach((p, i) => ctrlCheck(p, `Part ${i + 1}`));
      /* envelope, size, duplication */
      const nipBad = ps.filter(p => p.nip !== o.nip);
      if (nipBad.length) add('err', 'NIP differs in some parts', nipBad.map(p => p.name).join(', ') + ' — does not match the original.');
      else add('ok', 'NIP identical', `NIP ${o.nip} in every part.`);
      const samePeriod = ps.every(p => p.dataOd === o.dataOd && p.dataDo === o.dataDo);
      const subPeriods = !samePeriod && ps.every(p => p.dataOd >= o.dataOd && p.dataDo <= o.dataDo);
      if (samePeriod)
        add('warn', 'Record-based split — identical DataOd–DataDo in every part',
          'The mechanism documented by MF for large JPK_KR_PD files is a PERIOD split: the taxpayer may generate partial files for any periods not shorter than one day, each with its own DataOd–DataDo (MF FAQ JPK_PD, questions 39 & 106; SKwP presentation 12.2025). Parts that all declare the full-year period are a technical record split, not that documented convention — obtain acceptance from the tax office / advisor before submitting.');
      else if (subPeriods)
        add('ok', 'Period-based split', 'Each part declares its own sub-period within the original reporting year — consistent with the MF partial-file mechanism (periods ≥ 1 day).');
      else
        add('err', 'Part periods outside the original range', 'DataOd–DataDo of some parts falls outside the original reporting period.');
      ps.forEach((p, i) => p.size <= MF_LIMIT
        ? add('ok', `Part ${i + 1} under the 100 MB limit`, fmtBytes(p.size))
        : add('err', `Part ${i + 1} EXCEEDS 100 MB`, fmtBytes(p.size)));
      if (ps.length > 1 && ps.every(p => p.zois && p.zois === o.zois))
        add(subPeriods ? 'info' : 'warn', 'ZOiS duplicated in every part', `Each part carries the full ZOiS (${fmtInt(o.zois)} accounts). MF FAQ JPK_PD question 106 addresses exactly this: in partial (period) files, what ZOiS scope to report — which confirms partial files each carry their own ZOiS section. For a record-based split with identical periods, duplicated identical ZOiS is unvalidated territory — confirm with the tax office / advisor.`);
      const rpdFinal = ps.filter(p => p.rpdSum > 0);
      if (rpdFinal.length > 1)
        add('warn', 'Non-zero RPD in multiple parts', `Per MF FAQ JPK_PD question 39, partial JPK_KR_PD files should carry interim RPD values (e.g. 0) and the final full-year K_1…K_8 only in the LAST part. Non-zero RPD amounts appear in ${rpdFinal.length} part(s) — the values risk being read twice. Use the “By period” split mode, which zeroes RPD in interim parts.`);
      else if (ps.some(p => p.rpd))
        add('ok', 'RPD final values in a single part', 'Interim parts carry zero RPD; the final K_1…K_8 appear once — consistent with MF FAQ question 39.');
      Recon.report = { scans, issues };
      Log.add(`Reconcile: ${issues.filter(i => i.sev === 'err').length} error(s), ${issues.filter(i => i.sev === 'warn').length} warning(s).`, 'ok');
      Toast.show('Reconciliation finished', 'ok');
    } catch (e) { if (e.message !== 'cancelled') Toast.show('Reconcile failed: ' + e.message, 'err'); }
    Task.end();
    if (resEl) Views.paintRecon(resEl);
  },

  exportReconPdf() {
    if (!Recon.report) return;
    const L = [];
    for (const [i, s] of Recon.report.scans.entries())
      L.push(`${i ? 'PART ' + i : 'ORIGINAL'}: ${s.name} | ${fmtBytes(s.size)} | Dziennik ${fmtInt(s.dz)} | KontoZapis ${fmtInt(s.kz)} | Z_4 ${(s.z4/100).toFixed(2)} | Z_7 ${(s.z7/100).toFixed(2)} | D_1 ${s.d1min}..${s.d1max}`);
    L.push('');
    for (const i of Recon.report.issues) { L.push(`[${i.sev.toUpperCase()}] ${i.title}`); L.push(`        ${i.detail}`); }
    download(buildPdf('JPK Studio — split reconciliation report', L), 'reconciliation_report.pdf');
  },

  helpDialog() {
    const rows = [
      ['Ctrl+O','Open XML file'],['Ctrl+1…9','Switch view (Dashboard…Settings)'],
      ['Ctrl+P','Pretty print'],['Ctrl+F / Ctrl+H','Find / Replace (editor)'],
      ['Ctrl+G','Go to line'],['Ctrl+E','Run validation'],['Ctrl+S','Export view'],
      ['Ctrl+B','Toggle sidebar'],['Ctrl+J','Toggle theme'],['F1','This help'],['Esc','Close find / dialogs'],
    ];
    Dialog.open({ title:'Keyboard shortcuts',
      body: el('table',{class:'tbl shortcuts'}, el('tbody',{},
        ...rows.map(([k,v])=>el('tr',{},el('td',{},el('kbd',{class:'k'},k)),el('td',{},v))))),
      buttons:[{label:'Close',value:true,acc:true}] });
  }
};

App.init();
</script>
